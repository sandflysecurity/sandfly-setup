  "/hosts/{host_id}/triage":
    get:
      operationId: getHostTriage
      description: |-
        Get the cached AI triage verdict for a host.

        A host that has never been triaged returns a record rather than a 404: not yet judged is a normal state for a host, not a missing resource. Its `state` is `queued` or `running` if the host is waiting for its first verdict, and `none` if nothing has judged it and nothing is pending.

        Whenever the host is on the triage queue the response carries `queue_position` and `queue_length`, so a view can report progress without a second request. A host that already has a verdict and has been asked for again keeps its verdict and its `state`, and reports the position of the re-run beside them.
      summary: Host AI triage verdict
      tags:
        - AI Triage
      parameters:
        - name: host_id
          description: host_id or host_sequence_id to retrieve.
          in: path
          required: true
          schema:
            oneOf:
              - title: host_id
                format: string
                type: string
              - title: host_sequence_id
                format: string
                type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostTriage"
          description: The host's AI triage verdict.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Host ID not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
    post:
      operationId: beginHostTriage
      description: |-
        Request a fresh AI triage submission for a host.

        The request is queued ahead of automatic work and ignores the configured minimum interval between verdicts, the unchanged-input check and the reuse of another host's verdict, so for a host with something alerting it always results in a submission to the configured model. A host with nothing alerting is recorded as `clean` without a submission, as it would be automatically. The configured daily limit does not apply to the request, though its submission is counted against the day. A request for a host whose verdict is being formed at that moment runs again once it finishes, against the host as it is then; a scan that lands during a requested run re-runs the host as automatic work rather than as a second request.

        The host tag exclusion does not apply to a request. `exclude_host_tags` scopes automatic triage, so a host it keeps out of the unattended path is still triaged when an operator asks, and the verdict that comes back is kept rather than taken back by the next automatic pass. While the request waits, the host's existing verdict, if any, stays in place and is reported with the request's queue position beside it.
      summary: Request host AI triage
      tags:
        - AI Triage
      parameters:
        - name: host_id
          description: host_id or host_sequence_id to triage.
          in: path
          required: true
          schema:
            oneOf:
              - title: host_id
                format: string
                type: string
              - title: host_sequence_id
                format: string
                type: integer
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueued"
          description: The host was queued for triage.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: "Neither AI triage nor AI analysis is enabled on this server. A request made by hand needs only a usable AI connection: it runs on the AI triage configuration when there is one, and on the AI analysis configuration otherwise."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Host ID not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/hosts/{host_id}/triage/overrides":
    delete:
      operationId: revertHostTriageSeverities
      description: |-
        Remove the AI severity from every artifact on a host, so each reports the severity its sandflies give it again.

        The host's own AI rating is withdrawn with it, whether or not any artifact carried an AI severity: until a new verdict is formed the host's `severity` is the highest severity among its alerting artifacts, and the verdict reports `severity_withdrawn`. The verdict itself is not deleted and still reports the severity the model gave it.

        This clears every AI severity on the host, including one set by a classification requested on an artifact directly -- unlike a new host verdict, which leaves those alone. The un-steered severity is never lost while a verdict is in force, since it is recomputed on every scan, so this restores exactly what the sandflies currently say rather than what they said when the verdict was formed.
      summary: Revert AI severities on a host
      tags:
        - AI Triage
      parameters:
        - name: host_id
          description: host_id or host_sequence_id to revert.
          in: path
          required: true
          schema:
            oneOf:
              - title: host_id
                format: string
                type: string
              - title: host_sequence_id
                format: string
                type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageReverted"
          description: How many artifacts were reverted.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Host ID not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/hosts/{host_id}/triage/document":
    get:
      operationId: getHostTriageDocument
      description: |-
        Build the AI triage submission for a host and return it without sending it: the system instruction, the JSON document describing the host, and the question, exactly as a triage submission for the host would send them now.

        The document is assembled against the host's previous verdict and the configured `max_payload_kb`, unless a different budget is given. Nothing is sent to the AI provider, queued or recorded, and the checks that decide whether a host is submitted at all are not applied: a host with no alerting artifacts, an excluded host, or a host whose verdict is still current returns the document it would have been sent. AI triage does not need to be enabled.
      summary: Preview a host's AI triage submission
      tags:
        - AI Triage
      parameters:
        - name: host_id
          description: host_id or host_sequence_id to build the submission for.
          in: path
          required: true
          schema:
            oneOf:
              - title: host_id
                format: string
                type: string
              - title: host_sequence_id
                format: string
                type: integer
        - name: max_payload_kb
          description: Size budget to build the document to, in KB, in place of the configured `max_payload_kb`.
          in: query
          required: false
          schema:
            type: integer
            minimum: 16
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageDocument"
          description: The submission the host would be sent.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: max_payload_kb is invalid.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Host ID not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  /hosts/triage:
    post:
      operationId: beginHostsTriage
      description: |-
        Request AI triage for several hosts at once.

        The whole list is queued in one step. Hosts that do not exist are left out rather than failing the request, and a host named more than once counts once, so the `queued` count in the response may be lower than the number of hosts asked for. A host already waiting on the queue is moved to the front as a manual request. See beginHostTriage for more details.
      summary: Request AI triage for several hosts
      tags:
        - AI Triage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageBulkRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueued"
          description: The hosts were queued for triage.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The request body was not valid JSON, or named no hosts.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: "Neither AI triage nor AI analysis is enabled on this server. A request made by hand needs only a usable AI connection: it runs on the AI triage configuration when there is one, and on the AI analysis configuration otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/artifacts/{artifact_id}/triage":
    get:
      operationId: getArtifactTriage
      description: |-
        Get what AI triage has concluded about one artifact.

        This is the finding the host's verdict rated the artifact under, or the artifact's own classification if one was requested. An artifact that exists but nothing has judged returns a record rather than a 404: `queued` or `running` if a classification is waiting, `none` otherwise. An artifact id that does not exist is a 404. An artifact that has a record and has been asked for again keeps it and reports `queue_position` and `queue_length` beside it.

        A host verdict leaves a record only on the artifacts of a finding it gave a severity to. An alerting artifact the verdict grouped into a finding that offered no severity is not judged in isolation and has no record of its own, so it reads as `none`.
      summary: Artifact AI classification
      tags:
        - AI Triage
      parameters:
        - name: artifact_id
          description: Numeric artifact ID.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactTriage"
          description: The artifact's AI classification.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Bad artifact ID.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Artifact not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
    post:
      operationId: beginArtifactTriage
      description: |-
        Request AI classification of one artifact.

        Unlike the rating an artifact picks up from its host's verdict, a classification carries the artifact's own `verdict`, `report` and `tags`.

        The host tag exclusion does not apply: it scopes automatic triage, and a classification is only ever asked for, so an artifact on an excluded host is classified like any other. An id that names no artifact is a 404, as it is on the read: a list can easily hold a row something else has since deleted.

        A classification outranks a host verdict's reading of the same artifact, and survives later verdicts for its host. A verdict takes back only what a previous verdict set, and it does not apply a finding's severity to an artifact that carries a classification: that artifact keeps its own verdict, report and severity until it is classified again, its AI severity is reverted, or it stops existing.
      summary: Request artifact AI classification
      tags:
        - AI Triage
      parameters:
        - name: artifact_id
          description: Numeric artifact ID.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueued"
          description: The artifact was queued for classification.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Bad artifact ID.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: "Neither AI triage nor AI analysis is enabled on this server. A request made by hand needs only a usable AI connection: it runs on the AI triage configuration when there is one, and on the AI analysis configuration otherwise."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Artifact not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/artifacts/{artifact_id}/triage/override":
    delete:
      operationId: revertArtifactTriageSeverity
      description: |-
        Remove the AI severity from one artifact, so it reports the severity its sandflies give it again.

        The host's AI rating is withdrawn with it. An operator who restores one artifact has overruled part of the verdict's rating, so until a new verdict is formed the host's `severity` is the highest severity among its alerting artifacts, and the verdict reports `severity_withdrawn`. Neither the host's verdict nor the artifact's own record is deleted, and a later verdict for the host may set the severity again.

        Idempotent: reverting an artifact that has no AI severity succeeds, changes nothing -- the host's rating included -- and reports that there was nothing to revert, so a bulk action does not have to know which rows have one.
      summary: Revert an AI severity
      tags:
        - AI Triage
      parameters:
        - name: artifact_id
          description: Numeric artifact ID.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The artifact is no longer steered.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Bad artifact ID.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  /triage/queue:
    get:
      operationId: getTriageQueue
      summary: AI triage queue
      description: |-
        List the AI triage queue: every host waiting for a verdict or being judged now, and every artifact waiting to be classified, in `position` order.

        Requests made by hand are worked first, then items that only take up a verdict already formed for another host in the same situation, then everything else, oldest first. Each item's `position` is the one `getHostTriage` and `getArtifactTriage` report for its subject, where 1 is next, and no two items share one. An item that is held -- waiting out the minimum interval between verdicts, the daily limit, a retry after a failed attempt, or a verdict being formed for another host in the same situation -- is not in line until its hold ends, and is not counted ahead of anything in line. Held items are listed after every item in line, the one whose hold ends soonest first, and `held_until` says when each hold ends. When a hold ends, the item takes its place in line by the order above.

        `available`, `automatic` and `paused_until` describe the queue as a whole. Nothing runs while `available` is false, and automatic items wait while `automatic` is false, whatever their own `state` says.
      tags:
        - AI Triage
      parameters:
        - description: number of items per page
          in: query
          name: size
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 10000
        - description: page number of items to retrieve
          in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueue"
          description: One page of the AI triage queue.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Page or size query parameter is invalid.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  /triage/deletequeue:
    post:
      operationId: removeTriageQueueItems
      summary: Remove AI triage queue items
      description: |-
        Take the given items off the AI triage queue.

        An item that is waiting is removed at once. An item that is running cannot be recalled, because its submission is already with the AI provider: it finishes, its verdict is kept, and it then leaves the queue without being retried, held or run again, even if a scan or a request asked for its subject while it ran. Until then it stays on the queue with `removed` set, so that nothing else starts on the same subject meanwhile. A verdict it forms is still shared with the other hosts in the same situation, which queues them to take it up without a submission.

        A removed host is not queued again automatically until something about it changes: a scan that changes what is alerting on it, or a change to its alerting artifacts made some other way, such as whitelisting. A host that has no verdict yet is queued again by its next scan, as any host without a verdict is. A request made by hand queues a host or artifact again at any time.

        Ids that are not on the queue, such as an item that finished after the list was read, are ignored, so `removed` may be lower than the number of ids given.
      tags:
        - AI Triage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageQueueRemoveRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueueRemoved"
          description: The items were taken off the queue.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The request body was not valid JSON, or named no queue items.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  /triage/deletequeue/all:
    delete:
      operationId: clearTriageQueue
      summary: Clear the AI triage queue
      description: |-
        Take every item off the AI triage queue. Nothing goes back on it until a scan, a change to a host's alerting artifacts or a request made by hand puts it there.

        An item that is waiting is removed at once. An item that is running cannot be recalled, because its submission is already with the AI provider: it finishes, its verdict is kept, and it then leaves the queue without being retried, held or run again, even if a scan or a request asked for its subject while it ran. Until then it stays on the queue with `removed` set, so that nothing else starts on the same subject meanwhile. A verdict it forms is still shared with the other hosts in the same situation, which queues them to take it up without a submission.

        A removed host is not queued again automatically until something about it changes: a scan that changes what is alerting on it, or a change to its alerting artifacts made some other way, such as whitelisting. A host that has no verdict yet is queued again by its next scan, as any host without a verdict is. A request made by hand queues a host or artifact again at any time.

        An item queued while the queue is being cleared is a new request, and is left in place.
      tags:
        - AI Triage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueueRemoved"
          description: The queue was cleared.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/triage/deletequeue/{queue_item_id}":
    delete:
      operationId: removeTriageQueueItem
      summary: Remove an AI triage queue item
      description: |-
        Take one item off the AI triage queue.

        An item that is waiting is removed at once. An item that is running cannot be recalled, because its submission is already with the AI provider: it finishes, its verdict is kept, and it then leaves the queue without being retried, held or run again, even if a scan or a request asked for its subject while it ran. Until then it stays on the queue with `removed` set, so that nothing else starts on the same subject meanwhile. A verdict it forms is still shared with the other hosts in the same situation, which queues them to take it up without a submission.

        A removed host is not queued again automatically until something about it changes: a scan that changes what is alerting on it, or a change to its alerting artifacts made some other way, such as whitelisting. A host that has no verdict yet is queued again by its next scan, as any host without a verdict is. A request made by hand queues a host or artifact again at any time.
      tags:
        - AI Triage
      parameters:
        - name: queue_item_id
          description: The queue item's `id`, as the queue listing reports it.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueueRemoved"
          description: The item was taken off the queue.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Bad queue item ID.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: No item with this ID is on the queue. It may have finished since the list was read.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
  "/triage/queue/{queue_item_id}/run":
    post:
      operationId: runTriageQueueItemNow
      summary: Run an AI triage queue item now
      description: |-
        Turn a waiting item into a request made by hand, so that it is worked as soon as a submission slot is free.

        Whatever was holding the item no longer does: the minimum interval between verdicts, the daily limit, a retry delay after a failed attempt, or a verdict being formed for another host in the same situation. Its attempt count starts again, and it moves to the front of the queue. When it runs it is treated as any request made by hand, as described for `beginHostTriage`: a host with something alerting is submitted to the AI provider whatever the automatic checks would have decided. An item that would only have taken up another host's verdict becomes a full triage of its host.

        A pause after the AI provider rate-limits a submission applies to the whole queue and is not lifted by this request; the item runs when the pause ends.
      tags:
        - AI Triage
      parameters:
        - name: queue_item_id
          description: The queue item's `id`, as the queue listing reports it.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageQueued"
          description: The item is now a request made by hand, at the front of the queue.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Bad queue item ID.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: "Neither AI triage nor AI analysis is enabled on this server. A request made by hand needs only a usable AI connection: it runs on the AI triage configuration when there is one, and on the AI analysis configuration otherwise."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: No item with this ID is on the queue. It may have finished since the list was read.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The item is already running.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
