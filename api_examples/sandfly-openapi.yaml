    ProcessFlag:
      type: string
      title: ProcessFlag
      description: Attributes of a running process.
      enum:
        - deleted
        - marked_deleted
        - immutable
        - containerized
        - hidden
      x-enumDescriptions:
        deleted: "The executable no longer exists on disk: a fileless or self-deleting program."
        marked_deleted: The kernel reports the executable path with a "(deleted)" suffix.
        immutable: The executable carries the immutable attribute (chattr +i).
        containerized: The process runs inside a container.
        hidden: "The process is not visible to normal process listing: a sign of rootkit concealment."
      x-enumSeverities:
        deleted: 5
        marked_deleted: 5
        immutable: 5
        containerized: 0
        hidden: 5
