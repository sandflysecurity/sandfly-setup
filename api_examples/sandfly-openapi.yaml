          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Action queued for the specified host.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Key has no stored value, host is inactive, or no placements found.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Insufficient role or response actions disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Key or host not found, or no active placements.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyLastKeyProtectionResponse"
          description: "Last-key protection: the remove action would leave the host with no SSH keys known to Sandfly. The response body identifies the affected host and users. Set allow_last_key_removal=true in the request body to override."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Remove or deduplicate an SSH key on a specific host
      tags:
        - Response Actions
  "/responseaction/sshpubkey/{keyid}/{action}/host/{host_sequence_id}/user/{username}":
    post:
      description: Performs an SSH key response action for a specific user on a specific host. Requires the responder role. For 'remove' actions, a last-key protection safety check denies the request with HTTP 409 if the host would be left with zero SSH keys known to Sandfly after removing the key for this user; set allow_last_key_removal=true in the request body to override.
