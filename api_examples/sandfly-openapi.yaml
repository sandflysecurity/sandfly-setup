    LlmRequestLogEntry:
      description: One request sent to an LLM provider, by AI analysis or AI triage.
      type: object
      required:
        - id
        - created_at
        - purpose
        - manual
        - requested_by
        - requested_by_name
        - provider
        - model
        - input_tokens
        - output_tokens
        - succeeded
        - duration_ms
        - analysis_id
        - host_sequence_id
        - artifact_id
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the log entry.
        created_at:
          type: string
          format: date-time
          description: When the request was recorded (UTC).
        purpose:
          type: string
          enum:
            - analysis
            - host_triage
            - artifact_triage
          description: What the request was for.
        manual:
          type: boolean
          description: Whether a user asked for the request. An analysis is always manual; triage is manual when a user requested it and automatic when a scan did.
        requested_by:
          type: string
          description: The username of the user who asked for the request, or an empty string when there is none.
        requested_by_name:
          type: string
          description: The full name of the user who asked for the request. This is their username when they have no full name or the user no longer exists, and an empty string when no user asked for the request.
        provider:
          type: string
          description: The LLM API service the request was sent to, as configured at the time (for example `Claude` or `OpenAI`).
        model:
          type: string
          description: The model the request was sent to.
        input_tokens:
          type: integer
          nullable: true
          description: Input tokens the provider reported for the request. Null when unknown.
        output_tokens:
          type: integer
          nullable: true
          description: Output tokens the provider reported for the request. Null when unknown.
        succeeded:
          type: boolean
          description: Whether the provider returned an answer.
        duration_ms:
          type: integer
          description: How long the request took, in milliseconds.
        analysis_id:
          type: integer
          nullable: true
          description: The AI analysis the request was for, or null if it was not for an analysis. The analysis may since have been deleted.
        host_sequence_id:
          type: integer
          nullable: true
          description: The host the request was about, or null if it was not about a single host. The host may since have been deleted.
        artifact_id:
          type: integer
          format: int64
          nullable: true
          description: The artifact the request was about, or null if it was not about a single artifact. The artifact may since have been deleted.
    LlmUsageReport:
      description: The AI request log totalled separately for AI analysis and AI triage.
      type: object
      required:
        - analysis
        - triage
      properties:
        analysis:
          description: "Requests made by AI analysis: one entry per UTC day, provider and model that had any, newest day first."
          type: array
          items:
            $ref: "#/components/schemas/LlmRequestLogSummary"
        triage:
          description: "Requests made by AI triage, host and artifact triage together: one entry per UTC day, provider and model that had any, newest day first."
          type: array
          items:
            $ref: "#/components/schemas/LlmRequestLogSummary"
    LlmRequestLogSummary:
      description: Totals of the LLM request log for one UTC day, provider and model.
      type: object
      required:
        - day
        - provider
        - model
        - requests
        - failed
        - input_tokens
        - output_tokens
        - unreported_requests
      properties:
        day:
          type: string
          format: date
          description: The UTC calendar day, as YYYY-MM-DD.
        provider:
          type: string
          description: The LLM API service the requests were sent to.
        model:
          type: string
          description: The model the requests were sent to.
        requests:
          type: integer
          description: Number of requests sent.
        failed:
          type: integer
          description: Number of those requests that did not return an answer.
        input_tokens:
          type: integer
          format: int64
          description: Total input tokens the provider reported. Requests without a reported count are not included; see `unreported_requests`.
        output_tokens:
          type: integer
          format: int64
          description: Total output tokens the provider reported. Requests without a reported count are not included; see `unreported_requests`.
        unreported_requests:
          type: integer
          description: Number of requests missing an input or output token count. When this is non-zero the token totals are lower than what was actually used.
    LlmAnalysisSummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the LLM analysis.
        state:
          $ref: "#/components/schemas/LlmAnalysisState"
        mode:
          $ref: "#/components/schemas/LlmAnalysisMode"
        hosts:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/LlmAnalysisHost"
              - $ref: "#/components/schemas/LlmAnalysisHostDeleted"
          description: List of hosts involved in the analysis.
        results:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/LlmAnalysisResult"
              - $ref: "#/components/schemas/LlmAnalysisResultDeleted"
            discriminator:
              propertyName: statis
              mapping:
                alert: "#/components/schemas/LlmAnalysisResult"
                error: "#/components/schemas/LlmAnalysisResult"
                pass: "#/components/schemas/LlmAnalysisResult"
                "[deleted]": "#/components/schemas/LlmAnalysisResultDeleted"
          description: List of results involved in the analysis, if any.
        artifacts:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/LlmAnalysisArtifact"
              - $ref: "#/components/schemas/LlmAnalysisArtifactDeleted"
          description: "List of artifacts the analysis covers: those it was requested on, and those of the results it was requested through. Empty for host analyses."
        userid:
          type: string
          description: User ID (Sandfly login) of the user who initiated the analysis.
        username:
          type: string
          description: Full name of the user who initiated the analysis.
        brief:
          type: string
          description: Brief one-sentence summary of LLM analysis, if available. Will be an empty string if the first response is not yet available, or if no brief was found.
        model:
          type: string
          description: Model name this analysis was started with.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the analysis was created.
        modified_at:
          type: string
          format: date-time
          description: Timestamp when the analysis was last modified.
      required:
        - id
        - state
        - mode
        - hosts
        - results
        - artifacts
        - userid
        - username
        - model
        - brief
        - created_at
        - modified_at
    LlmAnalysis:
      allOf:
        - $ref: "#/components/schemas/LlmAnalysisSummary"
        - type: object
          properties:
            chat_entries:
              type: array
              items:
                $ref: "#/components/schemas/LlmChatEntry"
              description: Chronological list of chat entries related to the analysis.
          required:
            - chat_entries
    LlmLoginInfo:
      type: object
      description: LLM configuration summary returned during login.
      required:
        - enabled
        - results_limit
        - triage_enabled
        - triage_automatic
        - triage_available
      properties:
        enabled:
          type: boolean
          description: LLM analysis is enabled.
        results_limit:
          type: integer
          description: Maximum number of artifacts allowed in an LLM analysis request. Results about the same artifact count once.
        triage_enabled:
          type: boolean
          description: An AI triage configuration is present.
        triage_automatic:
          type: boolean
          description: Hosts are submitted for AI triage without being asked for.
        triage_available:
          type: boolean
          description: "An operator can request an AI triage verdict at all. True when either AI triage or AI analysis is enabled: a request made by hand runs on the AI analysis connection when triage has no configuration of its own."
    LogSignal:
      type: string
      title: LogSignal
      description: Findings from login and session records.
      enum:
        - failed-login
        - invalid-record
        - clock-change
        - hostname-mismatch
        - forged-console-record
        - out-of-order
        - never-logged-in
        - live-session
      x-enumDescriptions:
        failed-login: A failed login attempt.
        invalid-record: The record could not be decoded, a sign of corruption or tampering.
        clock-change: The system clock was changed, which breaks the timeline of every other record.
        hostname-mismatch: The record has no hostname where a real network address was present.
        forged-console-record: A network address is recorded against a local console login, an impossible combination that means the record was forged.
        out-of-order: Records are out of sequence, a sign the log was edited.
        never-logged-in: The account has never logged in interactively. Normal for service accounts.
        live-session: A session that is active right now.
      x-enumSeverities:
        failed-login: 2
        invalid-record: 5
        clock-change: 5
        hostname-mismatch: 2
        forged-console-record: 5
        out-of-order: 5
        never-logged-in: 0
        live-session: 0
    LogSource:
      type: string
      title: LogSource
      description: Which login log a record came from.
      enum:
        - utmp
        - wtmp
        - btmp
        - lastlog
      x-enumDescriptions:
        utmp: A session live right now, read from /var/run/utmp.
        wtmp: Login history, read from /var/log/wtmp.
        btmp: A failed login attempt, read from /var/log/btmp.
        lastlog: The last login recorded for this user, read from /var/log/lastlog.
    ResponseActionsLoginInfo:
      type: object
      description: Response actions configuration summary returned during login.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Response actions are enabled on the server.
    NotificationSummaries:
      type: array
      description: Array of Notification Summaries.
      items:
        $ref: "#/components/schemas/NotificationSummary"
    NotificationSummary:
      type: object
      description: Event notification configuration summary.
      properties:
        id:
          type: integer
          readOnly: true
          description: ID of notification configuration.
        name:
          type: string
          description: Name of notification configuration.
        event:
          type: string
          description: Event type for which this notification will fire.
          enum:
            - host_alert_rollup
            - individual_alert
            - notification_delivery_error
        delivery:
          type: string
          description: Method used to deliver event notification.
          enum:
            - http_post
        hosts_tags_include:
          type: array
          nullable: true
          description: If present, only events that apply to the hosts that have the tag(s) will be sent by this notification.
          items:
            type: string
        hosts_tags_include_operator:
          type: string
          description: If there are more than one hosts_tags_include tags, this operator controls the matching logic.
          enum:
            - and
            - or
          default: and
        hosts_tags_exclude:
          type: array
          nullable: true
          description: If present, events will NOT be sent for any hosts that have these tag(s). Exclude tags have priority over include tags.
          items:
            type: string
        hosts_tags_exclude_operator:
          type: string
          description: If there are more than one hosts_tags_exclude tags, this operator controls the matching logic.
          enum:
            - and
            - or
          default: and
        paused:
          type: boolean
          description: Holds the active status of the notification.
          default: true
      required:
        - name
        - event
        - delivery
        - config
        - template
        - hosts_tags_include
        - hosts_tags_exclude
    Notification:
      type: object
      description: Event notification configuration.
      allOf:
        - $ref: "#/components/schemas/NotificationSummary"
      properties:
        config:
          oneOf:
            - $ref: "#/components/schemas/NotificationPostConfig"
          discriminator:
            propertyName: delivery
            mapping:
              http_post: "#/components/schemas/NotificationPostConfig"
        template:
          type: string
          description: The Go text/template template to format the notification content.
    NotificationPostConfig:
      type: object
      properties:
        url:
          type: string
          description: The URL to POST the notification to.
        content_type:
          type: string
          description: The HTTP Content-Type header value to use in the POST request.
        ignore_cert_errors:
          type: boolean
          description: If true, HTTP certificate errors will be ignored when connecting to the URL.
          default: false
    NotificationIDs:
      properties:
        notification_ids:
          description: List of notification_ids.
          items:
            type: integer
          type: array
      type: object
    SshKeyTypes:
      type: string
      description: OpenSSH key type identifiers
      enum:
        - ssh-ed25519
        - ssh-dss
        - ssh-rsa
        - ecdsa-sha2-nistp256
        - ecdsa-sha2-nistp384
        - ecdsa-sha2-nistp521
        - sk-ecdsa-sha2-nistp256@openssh.com
        - sk-ssh-ed25519@openssh.com
        - unknown
    SSHBulkTag:
      type: object
      required:
        - key_tags
        - key_ids
      properties:
        key_ids:
          description: List of key IDs to perform the bulk tagging operation on.
          items:
            type: integer
          type: array
        key_tags:
          description: List of tags to add to or remove from the keys.
          $ref: "#/components/schemas/SshKeyTags"
    SshKeyKeyData:
      type: object
      required:
        - id
        - friendly_name
        - key_type
        - hash
        - sha256_fingerprint
        - key_value
        - created_at
        - first_seen
        - last_seen
        - key_tags
        - key_bits
        - key_parse_error
      properties:
        id:
          type: integer
          description: Database-assigned SSH key ID.
        friendly_name:
          type: string
          description: Generated (but globally consistent for this key) friendly name for key.
        key_type:
          $ref: "#/components/schemas/SshKeyTypes"
        hash:
          type: object
          required:
            - md5
            - sha1
            - sha256
            - sha512
          properties:
            md5:
              type: string
              description: MD5 hash of the public key value.
            sha1:
              type: string
              description: SHA1 hash of the public key value.
            sha256:
              type: string
              description: SHA256 hash of the public key value.
            sha512:
              type: string
              description: SHA512 hash of the public key value.
        sha256_fingerprint:
          type: string
          description: Standard SHA256 fingerprint representation for this public key.
        key_value:
          type: string
          description: The public key.
        created_at:
          type: string
          format: date-time
          description: Time when this key record was created in the Sandfly database.
        first_seen:
          type: string
          format: date-time
          nullable: true
          description: Time when this key was first seen on a host during a scan. If a user directly added the key to Sandfly and it hasn't yet been found on any scanned host, the value will be null.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: Time when this key was most recently seen on a host during a scan. If a user directly added the key to Sandfly and it hasn't yet been found on any scanned host, the value will be null.
        key_tags:
          $ref: "#/components/schemas/SshKeyTags"
        key_bits:
          type: integer
          description: Number of bits in the key.
        key_parse_error:
          type: boolean
          description: Flag indicating that the key data was unable to be parsed as a valid SSH public key.
    SshKeyTags:
      type: array
      description: SSH key tags.
      items:
        anyOf:
          - $ref: "#/components/schemas/SshKeyTag"
          - $ref: "#/components/schemas/SshKeyTagReserved"
    SshKeyTag:
      description: SSH Key Tag
      type: string
      not:
        $ref: "#/components/schemas/SshKeyTagReserved"
    SshKeyHostTagSummary:
      type: object
      description: Aggregated host tag information for this key.
      required:
        - host_tags_common
        - host_tags_all
        - key_tags
      properties:
        host_tags_common:
          description: The list of host tags that appear on 100% of the hosts this key was found on.
          type: array
          items:
            type: string
        host_tags_all:
          description: The complete list of host tags that appear on hosts this key was found on.
          type: array
          items:
            type: string
        key_tags:
          description: The tags on the key.
          type: array
          items:
            type: string
    SshHostsAndTags:
      type: object
      description: Set of host IDs and their host tags
      additionalProperties:
        type: array
        description: List of host tags on this host
        items:
          type: string
          description: Host tag
    SshKeysAndTags:
      type: object
      description: Set of key IDs and their key tags
      additionalProperties:
        type: array
        description: List of key tags on this key
        items:
          type: string
          description: Key tag
    SshKeyTagReserved:
      description: Tags that hold special meaning and/or have special functionality
      type: string
      enum:
        - Banned
        - Protected
    SshKeySummary:
      type: object
      description: SSH key summary data.
      allOf:
        - $ref: "#/components/schemas/SshKeyKeyData"
      required:
        - num_hosts_with_alerts
        - num_hosts_current
        - num_users_current
        - num_hosts_total
        - num_users_total
        - hosts_deleted
        - has_duplicate_keys
        - host_tags_all
        - zone_violation_hosts
        - permitted_zones_count
        - permitted_zones_summary
      properties:
        num_hosts_with_alerts:
          type: integer
          description: Number of hosts with this key that have alerts.
        num_hosts_current:
          type: integer
          description: Number of hosts that currently have this key.
        num_users_current:
          type: integer
          description: Number of distinct usernames that currently have this key.
        num_hosts_total:
          type: integer
          description: Total number of hosts that have ever had this key.
        num_users_total:
          type: integer
          description: Total number of distinct usernames that have ever had this key.
        hosts_deleted:
          type: boolean
          description: The hosts that had this key are no longer in the Sandfly database.
        has_duplicate_keys:
          type: boolean
          description: One or more authorized_keys files with this key have duplicate entries for this key.
        host_tags_all:
          type: array
          items:
            type: string
          description: All tags that appear on any host this key is associated with.
        zone_violation_hosts:
          type: integer
          description: Number of hosts with this key that currently have an SSH Security Zone violation.
        permitted_zones_count:
          type: integer
          description: Number of SSH Security Zones that permit this key to appear on hosts.
        permitted_zones_summary:
          type: array
          items:
            $ref: "#/components/schemas/SshZoneRef"
          description: SSH Security Zones that permit this key to appear on hosts.
    SshZoneRef:
      type: object
      description: Reference to an SSH Security Zone by ID and name.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: SSH Security Zone ID.
        name:
          type: string
          description: SSH Security Zone name.
    SshKey:
      type: object
      required:
        - key_use_timeline
        - key_users
        - key_hosts
        - host_tags_common
        - key_zones
      allOf:
        - $ref: "#/components/schemas/SshKeySummary"
      properties:
        key_use_timeline:
          type: array
          items:
            $ref: "#/components/schemas/StandardTimeRangeDataPoint"
        key_users:
          type: array
          items:
            $ref: "#/components/schemas/SshKeyUserDataPoint"
        key_hosts:
          type: array
          items:
            $ref: "#/components/schemas/SshHostSummary"
        host_tags_common:
          type: array
          items:
            type: string
          description: Tags that appear on every host this key is associated with.
        key_zones:
          type: array
          description: The list of SSH security zones which permit this key to appear on hosts and zones that this key was found in.
          items:
            $ref: "#/components/schemas/SSHZoneSummaryWithPermittedFlag"
    SshKeyUserDataPoint:
      required:
        - username
        - hosts_with_key
        - has_duplicate_keys
        - banned_key_violation
      description: Information about a user's SSH keys.
      type: object
      properties:
        username:
          type: string
          description: Username.
        hosts_with_key:
          type: integer
          description: Number of hosts on which this user has the SSH key or keys.
        key_first_seen:
          type: string
          format: date-time
          description: First time the SSH key associated with this user was seen.
        key_last_seen:
          type: string
          format: date-time
          description: Most recent time the SSH key associated with this user was seen.
        has_duplicate_keys:
          type: boolean
          description: The SSH key associated with this user has duplicate entries in an authorized_keys file.
        banned_key_violation:
          type: boolean
          description: Indicates this user has a banned key.
        zone_violation_hosts:
          type: integer
          description: The number of hosts on which this user has a key in violation of security zone policy.
    SshUserSummary:
      type: object
      required:
        - username
        - keys_current
        - keys_total
        - hosts_current
        - hosts_total
        - first_seen
        - last_seen
        - has_duplicate_keys
        - banned_key_violation
        - zone_violation_hosts
      properties:
        username:
          type: string
          description: Username.
        keys_current:
          type: integer
          description: Number of keys this user currently has.
        keys_total:
          type: integer
          description: Total number of keys that have been seen for this user.
        hosts_current:
          type: integer
          description: Number of hosts on which this user currently has keys.
        hosts_total:
          type: integer
          description: Total number of hosts this user has had keys on.
        first_seen:
          type: string
          format: date-time
          description: First time keys associated with this user were seen.
        last_seen:
          type: string
          format: date-time
          description: Most recent time keys associated with this user were seen.
        has_duplicate_keys:
          type: boolean
          description: This user has duplicate key entries in an authorized_keys file.
        banned_key_violation:
          type: boolean
          description: Indicates this user has a banned SSH key.
        zone_violation_hosts:
          type: integer
          description: Number of hosts on which this user has a key in violation of the security zone policies covering the host.
    SshUser:
      type: object
      required:
        - hosts_timeline
        - hosts
        - username
        - keys_current
        - keys_total
        - hosts_current
        - hosts_total
        - first_seen
        - last_seen
        - has_duplicate_keys
        - banned_key_violation
        - zone_violation_hosts
      properties:
        username:
          type: string
          description: Username.
        keys_current:
          type: integer
          description: Number of keys this user currently has.
        keys_total:
          type: integer
          description: Total number of keys that have been seen for this user.
        hosts_current:
          type: integer
          description: Number of hosts on which this user currently has keys.
        hosts_total:
          type: integer
          description: Total number of hosts this user has had keys on.
        first_seen:
          type: string
          format: date-time
          description: First time keys associated with this user were seen.
        last_seen:
          type: string
          format: date-time
          description: Most recent time keys associated with this user were seen.
        has_duplicate_keys:
          type: boolean
          description: This user has duplicate key entries in an authorized_keys file.
        hosts_timeline:
          type: array
          description: Timeline over which this user was seen with keys on hosts.
          items:
            $ref: "#/components/schemas/StandardTimeRangeDataPoint"
        hosts:
          type: array
          description: Hosts on which this user has keys.
          items:
            type: object
            allOf:
              - $ref: "#/components/schemas/SshHostSummary"
            properties:
              key_entries:
                type: array
                items:
                  $ref: "#/components/schemas/SshKeyEntry"
        banned_key_violation:
          type: boolean
          description: Indicates this user has a banned SSH key.
        zone_violation_hosts:
          type: integer
          description: Number of hosts on which this user has keys that are in violation of an SSH security zone.
    SshGraphNodeType:
      type: string
      enum:
        - category
        - host
        - key
        - user
      description: Type of object this graph node represents.
    SshMode:
      enum:
        - key
        - host
        - user
      type: string
    SshGraphType:
      $ref: "#/components/schemas/SshMode"
    SshGraphNode:
      type: object
      required:
        - node_id
        - entity_id
        - type
        - name
        - key_first_seen
        - key_last_seen
        - has_duplicate_keys
        - banned_key_violation
        - zone_violation
      properties:
        node_id:
          type: string
          description: Graph node ID; only meaningful in the context of this single request.
        entity_id:
          type: string
          description: ID of the object this graph node represents
        type:
          $ref: "#/components/schemas/SshGraphNodeType"
        name:
          type: string
          description: Name of object this graph node represented.
        value:
          type: integer
          nullable: true
          description: Numeric information about this graph node's object.
        value_label:
          type: string
          nullable: true
          description: Display label to show with this node's value.
        value_help:
          type: string
          nullable: true
          description: Help text further explaining this node's value.
        key_first_seen:
          type: string
          format: date-time
          description: First time an SSH key associated with this object was seen.
        key_last_seen:
          type: string
          format: date-time
          description: Most recent time an SSH key associated with this object was seen.
        parent_id:
          type: string
          nullable: true
          description: Parent graph node ID.
        has_duplicate_keys:
          type: boolean
          description: The object associated with this graph node has duplicate key entries.
        banned_key_violation:
          type: boolean
          description: Indicates that this graph node, or one of its children, has a banned SSH key that is in use.
        zone_violation:
          type: boolean
          description: Indicates that this graph node, or one of its children, has an SSH key that is on a host in violation of an SSH security zone policy.
    SshHostSummary:
      type: object
      description: Host summary record.
      allOf:
        - $ref: "#/components/schemas/SshHostSummaryHostInfo"
        - $ref: "#/components/schemas/SshHostSummarySSHInfo"
    SshHostSummaryHostInfo:
      type: object
      description: Host attributes to provide context about the host on SSH response objects.
      required:
        - host_id
        - host_sequence_id
        - target_address
        - node_name
        - last_seen_ip_addr
        - date_first_seen
        - date_last_seen
        - os_info_arch
        - os_info_machine
        - os_info_os_release_name
        - os_info_os_release_pretty_name
        - os_info_release
        - tags
        - results_alert
        - results_error
        - results_pass
        - results_total
      properties:
        node_name:
          type: string
          description: Hostname of host.
          format: int32
        tags:
          type: array
          description: A list of tags for this host.
          items:
            type: string
        host_id:
          type: string
          description: Unique ID of the host this summary record is for.
        host_sequence_id:
          type: integer
          description: Host sequence ID.
        target_address:
          type: string
        date_first_seen:
          type: string
          description: Date and time this host was first seen.
          format: date-time
        date_last_seen:
          type: string
          description: Date and time this host was last seen.
          format: date-time
        last_seen_ip_addr:
          type: string
          description: IP address this host was last seen on.
        os_info_arch:
          type: string
          description: OS architecture.
        os_info_machine:
          type: string
          description: OS machine.
        os_info_os_release_name:
          type: string
          description: OS release name.
        os_info_os_release_pretty_name:
          type: string
          description: Human friendly OS release name.
        os_info_release:
          type: string
          description: OS release.
        results_alert:
          type: integer
          description: Number of current (not superseded) alert results on this host.
          minimum: 0
        results_error:
          type: integer
          description: Number of current (not superseded) error results on this host.
          minimum: 0
        results_pass:
          type: integer
          description: Number of current (not superseded) pass results on this host.
          minimum: 0
        results_total:
          type: integer
          description: Number of current (not superseded) results on this host.
          minimum: 0
    SshHostSummarySSHInfo:
      type: object
      description: SSH key attributes related to a host.
      required:
        - users_with_key
        - has_duplicate_keys
        - banned_key_violation
        - zone_violation_keys
      properties:
        users_with_key:
          type: integer
          description: Total users with this key.
          minimum: 0
          nullable: true
        key_first_seen:
          type: string
          format: date-time
          description: First time a key associated with this host was seen.
        key_last_seen:
          type: string
          format: date-time
          description: Most recent time a key associated with this host was seen.
        users_current:
          type: integer
          minimum: 0
          description: Number of users on this host that currently have an SSH key.
        users_total:
          type: integer
          minimum: 0
          description: Number of all-time users on this host that have, or in the past have had, an SSH key.
        keys_current:
          type: integer
          minimum: 0
          description: Current number of SSH keys on this host.
        keys_total:
          type: integer
          minimum: 0
          description: Total number of SSH keys this host has had.
        has_duplicate_keys:
          type: boolean
          description: Does this key appear more then once in the key file.
        banned_key_violation:
          type: boolean
          description: Indicates the presence of a banned SSH key on this host.
        zone_violation_keys:
          type: integer
          description: Number of keys on this host in violation of the SSH security zone policies covering this host.
    SshHostSummaryUsers:
      type: object
      required:
        - users_timeline
        - users
      properties:
        users_timeline:
          description: Timeline of users with keys on this host.
          type: array
          items:
            $ref: "#/components/schemas/StandardTimeRangeDataPoint"
        users:
          type: array
          items:
            type: object
            required:
              - username
              - first_seen
              - last_seen
              - has_duplicate_keys
              - zone_violation_hosts
              - banned_key_violation
              - key_entries
            properties:
              username:
                type: string
                description: Username.
              first_seen:
                type: string
                format: date-time
                description: Time this user was first seen with an SSH key.
              last_seen:
                type: string
                format: date-time
                description: Most recent time this user was seen with an SSH key.
              has_duplicate_keys:
                type: boolean
                description: This username has duplicate authorized_key entries for a key.
              zone_violation_hosts:
                type: integer
                description: Indicates the number of hosts on which the user has a key in violation of SSH security zones.
              banned_key_violation:
                type: boolean
                description: Indicates this user has a banned key.
              key_entries:
                type: array
                items:
                  $ref: "#/components/schemas/SshKeyEntry"
    SshHost:
      type: object
      description: Host summary record.
      allOf:
        - $ref: "#/components/schemas/SshHostSummary"
        - $ref: "#/components/schemas/SshHostSummaryUsers"
    SshHostKeyConfig:
      properties:
        host_key:
          type: string
        host_key_type:
          type: string
        warn_only:
          type: boolean
      required:
        - host_key_type
        - host_key
      type: object
    SshHostWithZones:
      type: object
      description: Host summary record with zone membership list.
      allOf:
        - $ref: "#/components/schemas/SshHost"
      required:
        - zones
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/SSHZoneSummary"
    SshKeysAdd:
      type: object
      required:
        - key_tags
        - keys
      properties:
        key_tags:
          type: array
          description: Tags to add to the new keys, or tags to append to existing keys if the key already exists.
          items:
            type: string
        keys:
          type: string
          description: "SSH public keys to add. This may be a multi-line, newline-separated list of keys. Each line may be a full authorized_keys entry, or it may just be the key itself. Blank lines and lines beginning with # are ignored, so existing authorized_key files may be easily used."
    SshKeyEntry:
      type: object
      required:
        - active
        - is_duplicate
        - entry_num
        - key_file
        - key_file_created
        - key_file_modified
        - options
        - comment
        - banned_key_violation
        - zone_violation
      allOf:
        - $ref: "#/components/schemas/SshKeyKeyData"
      properties:
        active:
          type: boolean
          description: This key is currently in an authorized_keys file.
        is_duplicate:
          type: boolean
          description: This key has duplicate entries.
        entry_num:
          type: integer
          description: Which position in the authorized_keys file this key appears in.
        key_file:
          type: string
          format: path
          description: File path of the authorized_keys file where this key appears.
        key_file_created:
          type: string
          format: date-time
          description: Create time of the file in which this key appears.
        key_file_modified:
          type: string
          format: date-time
          description: Modification time of the file in which this key appears.
        options:
          type: string
          description: Key options.
        comment:
          type: string
          description: Key comment.
        banned_key_violation:
          type: boolean
          description: Indicates this is a banned key.
        zone_violation:
          type: boolean
          description: This key entry is in violation of an SSH security zone covering the host that the key is found on.
    SSHZoneTagPolicies:
      type: array
      items:
        $ref: "#/components/schemas/SSHZoneTagPolicy"
    SSHZoneTagPolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
            - include
            - except
          description: "The type of tag list this is: include items with the tag(s), or exclude items with the tag(s)."
        tags:
          type: array
          items:
            type: string
          description: The tags that make up this policy.
      required:
        - mode
        - tags
    SSHZoneSummary:
      readOnly: true
      type: object
      allOf:
        - $ref: "#/components/schemas/SSHZoneMetadata"
      properties:
        name:
          type: string
          description: Name of this SSH zone.
        description:
          type: string
          description: Description for this SSH zone.
        hosts_count:
          type: integer
          description: Number of hosts in this zone.
        permitted_keys_count:
          type: integer
          description: The number of keys this zone allows on hosts.
        violation_host_count:
          type: integer
          description: The number of hosts in this zone that current have one or more keys in violation of zone policies.
        banned_keys_count:
          type: integer
          description: The number of banned key entries found on hosts in this zone.
      required:
        - name
        - description
        - hosts_count
        - permitted_keys_count
        - violation_host_count
        - banned_keys_count
    SSHZoneSummaryWithPermittedFlag:
      readOnly: true
      allOf:
        - $ref: "#/components/schemas/SSHZoneSummary"
      properties:
        key_permitted:
          type: boolean
          description: Indicates if this key is permitted in this zone. If a zone is listed where the key is NOT permitted, it means that this key was found on a host in the zone in violation of the zone's policy; this key is the cause of a zone violation in that zone.
    SSHZoneMetadata:
      readOnly: true
      type: object
      properties:
        id:
          type: integer
          description: Database-assigned ID of this SSH zone.
        create_date:
          type: string
          format: date-time
          description: Date this SSH zone was created.
        modification_date:
          type: string
          format: date-time
          description: Date this SSH zone was last modified.
      required:
        - id
        - create_date
        - modification_date
    SSHZone:
      type: object
      readOnly: true
      allOf:
        - $ref: "#/components/schemas/SSHZoneSummary"
      properties:
        host_policies:
          $ref: "#/components/schemas/SSHZoneTagPolicies"
        key_policies:
          $ref: "#/components/schemas/SSHZoneTagPolicies"
        included_hosts:
          type: array
