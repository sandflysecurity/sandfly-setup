    ServerConfigLLMTriage:
      description: |-
        Configuration for automated AI triage: analyze each host after a scan materially changes what is known about it.

        The model is configured separately from the one used for AI analysis so that continuous, unattended triage can run on a cheaper model while a better one stays available for the analyses an operator asks for by hand.
      type: object
      required:
        - enabled
        - automatic
        - inherit
        - provider
        - model
        - available_models
        - url
        - ca_cert
        - min_interval_hours
        - max_concurrent
        - daily_limit
        - max_payload_kb
        - submit_timeout_secs
        - exclude_host_tags
      properties:
        enabled:
          type: boolean
          description: |-
            Whether AI triage has a configuration of its own.

            This does not by itself mean anything is submitted; see `automatic`. Nor does turning it off make triage unavailable: an operator can still request a verdict for a single host or artifact, and it runs on the AI Analysis connection. What it turns off is triage's own provider settings, and with them the ability to run unattended at all.
        automatic:
          type: boolean
          description: |-
            Whether every host whose scan materially changed it is submitted without being asked for.

            This is the setting with the cost and the data egress attached, which is why it is separate from `enabled`: an installation can have triage configured and available to its operators while nothing runs automatically.

            Only consulted when `enabled` is true. Requests made by hand ignore it entirely -- making one is the operator choosing. Automatic submission never falls back to the AI Analysis connection: an installation that has not configured triage has not agreed to have every host submitted on a timer.

            Takes effect before the next host is taken off the queue, not when the current backlog clears. Automatic work already queued when this is turned off is not discarded: it waits, and runs when the setting is turned back on. Requests made by hand still run in the meantime.
        inherit:
          type: boolean
          description: Take the provider, API key, URL and CA certificate from the AI analysis configuration, leaving `model` the only field set here. Requires AI analysis to be enabled.
        provider:
          type: string
          description: AI API service to use. Ignored when `inherit` is true.
          enum:
            - Claude
            - custom
            - DigitalOcean
            - Gemini
            - OpenAI
            - xAI
        password:
          type: string
          nullable: true
          description: API key for the provider. Stored encrypted and never returned. Leave null when updating to keep the saved key. Ignored when `inherit` is true.
          writeOnly: true
        model:
          type: string
          description: |-
            The model AI triage submits to.

            With `inherit` true this is an override: leave it empty and triage uses whatever model AI analysis uses; set it and that wins. Setting it is the usual arrangement, since running a cheaper model is the common reason to configure triage separately -- but it is not required, and an installation with a single model available can simply inherit.

            With `inherit` false it may be left empty on first save, which is how the provider's model list is fetched and a default chosen.

            The one rejected combination is inheriting when AI analysis has no model either, because an empty model name reaches the provider as a request for a model that does not exist.
        available_models:
          type: array
          items:
            type: string
          readOnly: true
          description: The models the provider reports, refreshed when the configuration is saved with `enabled` true and `inherit` false.
          example: []
        url:
          type: string
          description: Base URL, required for and only allowed with the `custom` provider. Ignored when `inherit` is true.
        ca_cert:
          type: string
          description: PEM CA certificate for a provider using a private certificate authority. Ignored when `inherit` is true.
        min_interval_hours:
          type: integer
          description: The shortest time between two analyses for the same host, so a frequently scanned host is not repeatedly re-judged. A host that changes inside the interval is judged when the interval is up, not skipped. A verdict requested by hand ignores this.
          minimum: 0
        max_concurrent:
          type: integer
          description: How many triage submissions may be submitted to the LLM provider concurrently.
          minimum: 1
        daily_limit:
          type: integer
          description: |-
            The most documents automatic triage sends to the provider per UTC day; 0 for no limit. Every submission counts, including one that fails or returns an unusable answer. Verdicts synthesized for hosts with nothing alerting, and verdicts reused from another host, send nothing and are not counted. When the limit is reached, automatic work that would submit a document waits for the next day; work that sends nothing -- a verdict reused from another host, a host with nothing alerting -- goes on.

            Requests are not held by it. The limit bounds what runs unattended, and an operator asking for a host or an artifact is not that; what the request sends is still counted, so a day spent by hand leaves that much less for the automatic path.
          minimum: 0
        max_payload_kb:
          type: integer
          description: "The size budget for the document describing a host, in kilobytes. It is a target rather than a hard limit. The alerting artifacts are ranked worst first and the budget decides how many of them carry their full forensic detail and how much of the host context fits; whatever is left out is counted in the document so the model does not read a shortened list as a complete one. Two things are sent regardless of the budget: a summary line for every alerting artifact (alerts of the same kind beyond the first few are summarized together as a group), and full detail for the few worst alerts, because a document that could not afford detail on its worst finding would have lost the thing it exists to add. A host whose worst alerts carry very large forensic payloads can therefore produce a document above the budget."
          minimum: 16
        submit_timeout_secs:
          type: integer
          description: How long one submission to the model may take, in seconds, before it is abandoned and retried.
          minimum: 30
          maximum: 1800
        exclude_host_tags:
          type: array
          items:
            type: string
          description: Exclude hosts with any matching tag from automatic triage submission.
          example: []
