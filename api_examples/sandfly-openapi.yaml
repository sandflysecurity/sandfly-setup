          type: integer
        page:
          description: Optional number of the page to return based on the size.
          format: int32
          type: integer
          default: 1
        sort:
          description: List of sort criteria applied to the results. Each entry specifies a field and a direction. If omitted, results are ordered by "id" descending (most recently results first).
          type: array
          items:
            type: object
            required:
              - field
              - sort
            properties:
              field:
                description: The result field to sort by (for example, "data.end_time" or "host_id"). Must be a known, sortable result field; unknown fields are rejected with an error.
