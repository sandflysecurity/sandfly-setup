      enum:
        - whitelist
        - drift
        - both
    ProfileHashType:
      description: The type of hash, permissive or restrictive, to use to apply this result profile to the associated host(s)
      type: string
      enum:
        - permissive
        - restrictive
    ProfileAssociations:
