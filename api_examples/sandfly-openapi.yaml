    KernelTaintLetter:
      type: string
      title: KernelTaintLetter
      description: A kernel taint flag letter, as reported in /proc/sys/kernel/tainted.
      enum:
        - P
        - F
        - S
        - R
        - M
        - B
        - U
        - D
        - A
        - W
        - C
        - I
        - O
        - E
        - L
        - K
        - X
        - T
        - N
        - J
      x-enumDescriptions:
        P: A proprietary module was loaded.
        F: A module was force loaded.
        S: SMP kernel oops on an officially SMP-incapable processor.
        R: A module was force unloaded.
        M: The processor reported a Machine Check Exception.
        B: A bad page was referenced or unexpected page flags were seen.
        U: Taint requested by a userspace application.
        D: "The kernel died recently: an OOPS or BUG."
        A: An ACPI table was overridden by the user.
        W: The kernel issued a warning.
        C: A staging driver was loaded.
        I: A workaround for a platform firmware bug was applied.
        O: An externally built (out-of-tree) module was loaded. Normal on hosts with vendor drivers.
        E: An unsigned module was loaded. Normal on hosts with DKMS or vendor drivers.
        L: A soft lockup occurred.
        K: The kernel has been live patched.
        X: An auxiliary taint, defined for and used by distributions.
        T: The kernel was built with the struct randomization plugin.
        N: An unsupported or in-kernel test module (distribution-specific).
        J: Userspace used a mutating debug operation in fwctl.
      x-enumSeverities:
        P: 5
        F: 5
        S: 0
        R: 0
        M: 0
        B: 0
        U: 0
        D: 0
        A: 0
        W: 0
        C: 0
        I: 0
        O: 0
        E: 0
        L: 0
        K: 0
        X: 0
        T: 0
        N: 0
        J: 0
