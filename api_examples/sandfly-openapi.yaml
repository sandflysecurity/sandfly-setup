                          - entry
                          - path
                          - masked
                          - masked_salt
                          - masked_value
                          - marker
                          - hostnames
                          - cert_authority
                          - revoked
                          - type
                          - public_key
                          - key_parse_error
                          - sha256_fingerprint
                        properties:
                          entry_num:
                            type: integer
                          entry:
                            type: string
                          path:
                            type: string
                          masked:
                            type: boolean
