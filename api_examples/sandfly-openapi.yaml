              type: boolean
              description: Indicates if the existence of this user is inferred from a directory present under /home, but not found in the /etc/passwd file (e.g. if the user authenticated via LDAP integration and has a local home directory).
    UtmpTypeName:
      type: string
      title: UtmpTypeName
      description: The decoded record type of a utmp, wtmp or btmp entry.
      enum:
        - empty
        - runlevel
        - boottime
        - newtime
        - oldtime
        - init
        - login
        - user
        - dead
        - accounting
        - invalid
      x-enumDescriptions:
        empty: The record contains no valid information.
        runlevel: A change in system run level.
        boottime: The time of system boot.
        newtime: The time after a system clock change. Paired with an oldtime record when the clock was moved.
        oldtime: The time before a system clock change. Paired with a newtime record when the clock was moved.
        init: A process spawned by init.
        login: The session leader for a user login.
        user: "A normal user process: an active session."
        dead: "A terminated process: a logout."
        accounting: An accounting record. Not implemented on Linux.
        invalid: "An unrecognized record type: the record is corrupt or was tampered with."
      x-enumSeverities:
        empty: 0
        runlevel: 0
        boottime: 0
        newtime: 5
        oldtime: 5
        init: 0
        login: 0
        user: 0
        dead: 0
        accounting: 0
        invalid: 5
