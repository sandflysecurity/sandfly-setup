        - tags_exclude
        - tags_exclude_operator
        - tags_operator
        - priority
        - all_hosts_immediately
      allOf:
        - $ref: "#/components/schemas/ScheduleConfigCommon"
        - $ref: "#/components/schemas/ScheduleAddCommon"
      properties:
        all_hosts_immediately:
          description: If true, immediately start scan on all hosts covered by this schedule. If false, scans will be spread out across hosts over the scan schedule interval.
          type: boolean
        priority:
          description: (scan schedule) Nice compatible priority of scan on target hosts.
          format: int32
          type: integer
        sandfly_selection_percent:
          description: (scan schedule) A number between 5-100 that is a random percentage to select from the sandfly list to run.
          format: int32
          type: integer
        sandfly_type:
          description: (scan schedule) List of sandfly types to include in this scan.
          items:
            $ref: "#/components/schemas/SandflyTypeGeneral"
          type: array
        sandfly_tags:
          description: (scan schedule) List of sandfly tags to include in this scan. If sandfly_types is also populated, these sandfly tags will act as a filter on the sandflies selected by type. If no sandfly_type list is present, then all active sandflies with the requested tags will be candidates for this scan.
          type: array
          items:
            type: string
        sandfly_tags_operator:
          description: "(scan schedule) How to interpret the sandfly_tags field: 'and' if all tags must be present on the sandfly to qualify for this scan, or 'or' if any tag qualifies the sandfly."
          $ref: "#/components/schemas/ScanTagOperators"
        sandfly_tags_exclude:
          description: (scan schedule) List of sandfly tags to exclude in this scan. These take precendent over inclusion based on the 'sandfly_type' and 'sandfly_tag' fields.
          type: array
          items:
            type: string
        sandfly_tags_exclude_operator:
          description: "(scan schedule) How to interpret the sandfly_tags_exclude field: 'and' if all tags must be present on the sandfly to exclude for this scan, or 'or' if any tag excludes the sandfly."
          $ref: "#/components/schemas/ScanTagOperators"
        sandfly_ids:
          description: (scan schedule) Names (IDs) of specific sandflies to always include in this scan. These sandflies will be included even if they are inactive, and this list is not filtered by the include/exclude type or tag criteria configured for this scan. Furthermore, these sandflies are guaranteed to always run and are not part of the sandfly_selection_percent amount.
          type: array
          items:
            type: string
            description: Sandfly name.
        tags:
          description: (scan schedule) Host tags to include in this scan.
          items:
            type: string
          type: array
        tags_exclude:
          description: (scan schedule) Host tags to exclude from this scan. These take precedent over inclusion based on the 'tags' field.
          items:
            type: string
          type: array
        tags_exclude_operator:
          description: "(scan schedule) How to interpret the tags_exclude field: 'and' if all tags must be present on the host to it from this scan, or 'or' if any tag excludes the host."
          $ref: "#/components/schemas/ScanTagOperators"
        tags_operator:
          description: "(scan schedule) How to interpret the tags field: 'and' if all tags must be present on the host to qualify for this scan, or 'or' if any tag qualifies the host."
          $ref: "#/components/schemas/ScanTagOperators"
      type: object
    ScanTagOperators:
      type: string
      enum:
