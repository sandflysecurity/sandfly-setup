          format: int32
          type: integer
          minimum: 1
          maximum: 3
        max_disk_load:
          description: The amount of relative disk intensity this sandfly needs (1 - low, 3 - high)
          format: int32
          type: integer
          minimum: 1
          maximum: 3
        max_timeout:
          description: What is the longest we should wait for this sandfly to return data in seconds?
          format: int32
          type: integer
          minimum: 1
          maximum: 3600
        name:
          description: Sandfly name.
          type: string
          not:
            enum:
              - backup
              - reload_all
              - response
        old_name:
          description: "Write-only rename request: the name of an existing sandfly this one replaces. When a sandfly with this name exists (and may be modified by this call), it is renamed, so results, whitelist rules, schedule membership, and drift profile coverage carry over; when no sandfly has this name, the property is ignored and the sandfly is saved as usual. Renaming onto a name that is already in use is refused with a 409 and saves nothing. It is never stored on the saved sandfly."
          type: string
          writeOnly: true
        options:
          required:
            - rules
            - engines
            - explanation
          type: object
          properties:
            rules:
              description: The sandfly's expr rules. Together with its OS exclusion rules, match hash extras and the expressions substituted into its explanation, they may be at most 1048576 bytes (1 MiB) long, and none may use the repeat builtin.
              type: array
              items:
                type: string
            engines:
              description: Sandfly engine used to obtain results. Currently only supports a single sandfly.
              type: array
              maxLength: 1
              minLength: 1
              items:
                $ref: "#/components/schemas/SandflyEngineType"
            rule_op:
              $ref: "#/components/schemas/SandflyRuleOperator"
            always_pass:
              type: boolean
              default: false
            exclude_containers:
              description: Restrict this sandfly to the base host. The engines that can look inside containers (file, directory, cron, at jobs, and process) will not search container filesystems or evaluate containerized processes for this sandfly, and any result describing something inside a container is not reported.
              type: boolean
              default: false
            explanation:
              type: string
            os_exclude:
              type: object
              description: expr rules that may use the os.* data to exclude this sandfly due to OS/distro incompatability. If the rule set evaluates to true, this sandfly will not run on the target host.
              properties:
                rule_op:
                  $ref: "#/components/schemas/SandflyRuleOperator"
                rules:
                  type: array
                  items:
                    type: string
            response:
              type: object
              properties:
                process:
                  type: object
                  properties:
                    kill:
                      type: boolean
                      description: Whether to kill the process or not.
                    suspend:
                      type: boolean
                      description: Whether to suspend the process or not.
            match_hash_extras:
              type: object
              description: Extra options to include in match hash values for results from this sandfly.
              properties:
                values:
                  description: List of expr expressions that produce strings which will be appended, in the order of this array, to the selected match hash types.
                  type: array
                  items:
                    type: string
                    description: An expr expression that returns a string. This value will be appended to the hash input for the selected match hash types.
                apply_permissive:
                  type: boolean
                  description: Apply this value to the permissive match hash.
                apply_moderate:
                  type: boolean
                  description: Apply this value to the moderate match hash.
                apply_strict:
                  type: boolean
                  description: Apply this value to the strict (deduplication) match hash.
            additionalProperties:
              type: object
        severity:
          $ref: "#/components/schemas/SandflySeverity"
        tags:
          description: Tags for this sandfly.
          items:
            oneOf:
              - $ref: "#/components/schemas/SandflyTypeGeneral"
              - type: string
          type: array
        version:
          description: Version of this Sandfly.
          type: string
      required:
