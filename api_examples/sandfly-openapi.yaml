            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Whitelist activated
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
