      x-enumDescriptions:
        network-server: Accepts incoming network connections.
        network-client: Makes outbound network connections.
        network-bidirectional: Both accepts incoming connections and makes outbound ones.
        daemon: Runs in the background, detached from any terminal.
        packet-capture: Reads traffic off the wire, not just its own connections.
        bpf-filtering: Appears to watch network traffic for particular packets.
        raw-socket-recv: Receives data on a network socket. Ordinary in most network software.
