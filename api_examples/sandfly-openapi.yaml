    FileEngineResponse:
      type: object
      required:
        - file
      properties:
        file:
          type: object
          required:
            - date
            - mode
            - nlink
            - uid
            - username
            - gid
            - groupname
            - size
            - size_mismatch
            - path
            - path_root
            - name
            - flags_list
            - entropy
            - hash
            - magic_num
            - container
            - mount
          properties:
            date:
              type: object
              description: File timestamps from stat(2)
              required:
                - created
                - created_minutes
                - modified
                - modified_minutes
                - accessed
                - accessed_minutes
              properties:
                created:
                  type: string
                  description: File creation time (ctime) as formatted string
                created_minutes:
                  type: integer
                  description: Minutes since file creation
                modified:
                  type: string
                  description: File modification time (mtime) as formatted string
                modified_minutes:
                  type: integer
                  description: Minutes since file modification
                accessed:
                  type: string
                  description: File access time (atime) as formatted string
                accessed_minutes:
                  type: integer
                  description: Minutes since file access
            mode:
              type: string
              description: File permission mode as octal string (e.g. 0755)
            nlink:
              type: integer
              description: Number of hard links to the file from stat(2)
            uid:
              type: integer
              description: Numeric user ID of file owner
            username:
              type: string
              description: Username of file owner
            gid:
              type: integer
              description: Numeric group ID of file owner
            groupname:
              type: string
              description: Group name of file owner
            selinux_context:
              type: string
              description: SELinux security context label of the file
            capabilities:
              type: object
              description: libcap capabilties stored in the file's security.capability xattr.
              properties:
                permitted:
                  description: Decoded list of permitted capabilities
                  type: array
                  items:
                    $ref: "#/components/schemas/LinuxCapability"
                inheritable:
                  description: Decoded list of inheritable capabilities
                  type: array
                  items:
                    $ref: "#/components/schemas/LinuxCapability"
                effective:
                  description: Decoded list of effective capabilities
                  type: array
                  items:
                    $ref: "#/components/schemas/LinuxCapability"
            size:
              type: integer
              description: File size in bytes from stat(2)
            size_byte_count:
              type: integer
              description: Actual byte count read from the file
            size_byte_count_status:
              type: string
              description: Explanation of why the raw byte count could not be calculated (e.g. not a regular file). Only present when the count failed.
            size_mismatch:
              type: boolean
              description: True if stat size differs from actual bytes read (possible tampering or race)
            path:
              type: string
              description: Full filesystem path to the file
            path_root:
              type: string
              description: Root path prefix (e.g. container overlay root or chroot path)
            path_link:
              type: string
              description: Symlink target path if the file is a symbolic link
            true_path:
              type: string
              description: Resolved absolute path after following symlinks
            name:
              type: string
              description: Base filename without directory path
            extension:
              type: string
              description: File extension (e.g. .so, .sh, .conf)
            flags_list:
              type: array
              items:
                $ref: "#/components/schemas/FileFlag"
            entropy:
              type: number
              description: Shannon entropy of file contents (0.0-8.0 bits per byte). High values suggest encryption or compression.
            hash:
              type: object
              description: Cryptographic hashes of the file contents
              required:
                - md5
                - sha1
                - sha256
                - sha512
              properties:
                md5:
                  type: string
                  description: MD5 hash (hex-encoded)
                sha1:
                  type: string
                  description: SHA-1 hash (hex-encoded)
                sha256:
                  type: string
                  description: SHA-256 hash (hex-encoded)
                sha512:
                  type: string
                  description: SHA-512 hash (hex-encoded)
            magic_num:
              type: object
              description: File type identification from magic number (first bytes of file)
              required:
                - hex
                - text
                - type
                - class
                - expected_extensions
              properties:
                hex:
                  type: string
                  description: Raw magic bytes as hex string
                text:
                  type: string
                  description: Magic bytes as printable text
                type:
                  type: string
                  description: 'Detected file type (e.g. elf, script, gzip). An open vocabulary: an unencrypted private key reports "<key type>-unencrypted".'
                class:
                  $ref: "#/components/schemas/MagicClass"
                public_key:
                  type: string
                  description: If the file is an unencrypted private key, the corresponding public key value. Absent if not computable.
                expected_extensions:
                  type: array
                  description: File extensions normally associated with this file type
                  items:
                    type: string
            data:
              type: array
              nullable: true
              items:
                type: string
              description: Extracted file content lines for small or text-based files (e.g. scripts, configs). Null for binary files.
            container:
              type: object
              description: Container information if the file resides inside a container
              properties:
                id:
                  type: string
                  description: Full container ID
                id_short:
                  type: string
                  description: Short (12-character) container ID
                rootdir:
                  type: string
                  description: Container root filesystem path on the host
              required:
                - id
                - id_short
                - rootdir
            mount:
              type: object
              description: Mount point information for the filesystem containing this file
              required:
                - mountpoint
                - device
                - fs_type
              properties:
                mountpoint:
                  type: string
                  description: Mount point path
                device:
                  type: string
                  description: Block device or source
                fs_type:
                  type: string
                  description: Filesystem type (e.g. ext4, xfs, overlay)
            analysis:
              $ref: "#/components/schemas/Analysis"
              title: File.analysis
