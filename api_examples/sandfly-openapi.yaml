    LlmAnalysisAdd:
      description: Request to begin a new LLM analysis of a host or results.
      type: object
      properties:
        mode:
          description: The analysis mode. Determines which other fields are required.
          $ref: "#/components/schemas/LlmAnalysisMode"
        host_sequence_id:
          type: integer
          description: The host sequence ID. Required if mode is 'host', ignored otherwise.
        result_ids:
          deprecated: true
          type: array
          items:
            type: integer
            format: int64
          description: Deprecated in favor of artifact_ids. A list of result IDs. At least one result ID or artifact ID is required if mode is 'results', ignored otherwise. Each result is analyzed as the artifact it is about, together with the verdicts of every other sandfly currently reporting on that artifact. Results about the same artifact are analyzed together.
        artifact_ids:
          type: array
          items:
            type: integer
            format: int64
          description: A list of artifact IDs, as the artifact API reports them. At least one result ID or artifact ID is required if mode is 'results', ignored otherwise. Each artifact is analyzed together with the verdicts of every sandfly currently reporting on it. An artifact is analyzed once even if it is also named through one of the result_ids. For each artifact named here but not through a result, the analysis lists one of the artifact's results among its results.
      required:
        - mode
    LlmAnalysisChatAdd:
      description: Chat message to add to an existing LLM analysis.
      type: object
      properties:
        text:
          type: string
