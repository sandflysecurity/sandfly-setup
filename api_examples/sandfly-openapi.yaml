    ResultsSearch:
      description: Search criteria for retrieving results. The `result_ids`, `filter`, and `time_since` properties are mutually exclusive; provide only one of them per request.
      properties:
        result_ids:
          description: A list of result IDs. Mutually exclusive with `filter` and `time_since`.
          items:
            type: string
          type: array
        filter:
          description: Filter value from UI to pass into search. Mutually exclusive with `result_ids` and `time_since`.
          type: object
          required:
            - items
            - logicOperator
          properties:
            items:
              $ref: "#/components/schemas/ResultSearchFilterItem"
