    ServerConfigTLS:
      type: object
      description: TLS certificate management configuration.
      required:
        - mode
        - acme_email
        - acme_directory
        - user_tls_active
      properties:
        mode:
          type: string
          enum:
            - self_signed
            - acme
            - none
          description: TLS certificate management mode. 'self_signed' generates certificates automatically, 'acme' uses Let's Encrypt or another ACME provider, 'none' runs plain HTTP only (for use behind a TLS-terminating proxy). User-provided certificate files (via SF_TLS_CERT_PATH / SF_TLS_KEY_PATH env vars) are detected automatically and override the configured mode.
        acme_email:
          type: string
          description: Email address for ACME account registration.
        acme_directory:
          type: string
          description: ACME provider directory URL. Defaults to Let's Encrypt production.
        user_tls_active:
          type: boolean
          readOnly: true
          description: Indicates that user-provided TLS certificate files were detected and are being used, overriding the configured mode. This field is read-only and determined at server startup.
    ServerConfigCommon:
      required:
        - config_revision
      type: object
      properties:
        config_revision:
          format: int64
          type: integer
          description: Configuration revision number. Must be echoed back to the server. Provides optimistic concurrency control to prevent two users from altering configuration simultaneously.
    ServerConfigGeneral:
      type: object
      required:
        - data_retention_days
        - pass_retention_days
        - file_retention_days
        - shared_url_keep_days
        - scan_log_retention_days
        - maintenance_hour
      properties:
        data_retention_days:
          format: int64
          type: integer
          description: Number of days to keep alert results and other data.
          default: 30
          minimum: 1
          maximum: 31
        pass_retention_days:
          format: int64
          type: integer
          description: Number of days to keep pass results.
          default: 3
          minimum: 1
          maximum: 31
        file_retention_days:
          format: int64
          type: integer
          description: Number of days to keep blobs (process binaries or files retrieved by response actions) in the database.
          default: 3
          minimum: 1
          maximum: 31
        shared_url_keep_days:
          format: int64
          type: integer
          description: Number of days to keep "share" URL links generated in the UI.
          default: 90
          minimum: 1
          maximum: 9999
        scan_log_retention_days:
          format: int64
          type: integer
          description: Number of days to retain scan_log entries for the scan performance report, enter 0 to retain forever.
          default: 120
          minimum: 0
          maximum: 9999
        maintenance_hour:
          format: int64
          type: integer
          description: Hour of the day, on the 24-hour UTC clock, to perform daily system maintenance tasks.
          default: 0
          minimum: 0
          maximum: 24
        server_hostname:
          type: string
          description: The hostname of the Sandfly server, used for SAML ACS URLs, notification links, and other features that need to reference the server's public URL. Once set, this value cannot be changed back to empty.
        login_banner:
          type: string
          description: Optional warning or notice message displayed on the login page. Leave empty to show no message. Must be no more than 5000 characters.
          default: ""
          maxLength: 5000
        server_log_level:
          type: string
          enum:
            - debug
            - info
          description: Server log verbosity level. Changes take effect immediately unless the SF_LOG_LEVEL environment variable is set, in which case the environment variable takes precedence for the lifetime of the server.
          default: info
    ServerConfigSessionTimeouts:
      type: object
      required:
        - access_token_minutes
        - refresh_token_minutes
        - ui_session_timeout_minutes
        - ui_session_expiration_minutes
      properties:
        access_token_minutes:
          format: int64
          type: integer
          description: Length of time (in minutes) that API access tokens are valid.
          default: 30
          minimum: 5
          maximum: 1440
        refresh_token_minutes:
          format: int64
          type: integer
          description: Length of time (in minutes) that API refresh tokens are valid.
          default: 1440
          minimum: 5
          maximum: 44640
        ui_session_timeout_minutes:
          format: int64
          type: integer
          description: Length of time (in minutes) a UI session can be idle before requiring re-authentication.
          default: 60
          minimum: 5
          maximum: 1440
        ui_session_expiration_minutes:
          format: int64
          type: integer
          description: Maximum time (in minutes) from initial login that a UI session can remain valid, regardless of activity.
          default: 1440
          minimum: 5
          maximum: 44640
    ServerConfigScanningBinary:
      type: object
      required:
        - agent_names
        - agent_reverse_dns_lookup
        - home_dir_base_paths
      properties:
        agent_names:
          format: string
          type: string
          description: Comma-separated list of names to use for the Sandfly binary that is sent to target hosts.
          default: sandfly
        agent_reverse_dns_lookup:
          type: boolean
          description: Configure node to perform a Reverse DNS lookup on IP addresses
        home_dir_base_paths:
          type: string
          description: Comma-separated list of directories to search for inferred user home directories during scans.
          default: /home
    ServerConfigLLM:
      type: object
      required:
        - enabled
        - provider
        - model
        - available_models
        - url
        - ca_cert
        - results_limit
      properties:
        enabled:
          type: boolean
          description: Indicates of LLM analysis integration is enabled or not.
        provider:
          type: string
          description: LLM API service to use.
          enum:
            - Claude
            - custom
            - DigitalOcean
            - Gemini
            - OpenAI
            - xAI
        password:
          type: string
          nullable: true
          description: API key for the LLM provider. Will be stored encrypted in the Sandfly database and not returned in getconfig calls. Leave as null when updating configuration to not replace the existing saved password.
        model:
          type: string
          description: Model name to use.
        available_models:
          type: array
          items:
            type: string
          readOnly: true
          description: After saving the configuration with enabled=true, the server will make an API call to the selected provider to get the list of available models. The next time the config is retrieved, this array will have the updated list of available models.
        url:
          type: string
          description: URL of the custom API. Only allowed to be present when provider = custom
        ca_cert:
          type: string
          description: Optional trusted CA certificate, in PEM format, to use with the custom API. Ignored when provider is not custom
        results_limit:
          type: integer
          description: Maximum number of artifacts a user is allowed to select for a single analysis. Results about the same artifact count once.
        include_user_header:
          type: boolean
          default: false
          description: "Send the username of the Sandfly user who requested an AI request to the provider in an X-Sandfly-Username HTTP header. Applies to every request a user asks for: AI analysis, and AI triage requested manually (including when AI triage has its own provider configuration). Automatic AI triage requests are not made on behalf of a user and never include the header."
    ServerConfigElastic:
      required:
        - enabled
        - url
        - ca_cert
        - username
        - summary_results
        - duplicate_alerts
        - duplicate_summary
      description: ElasticSearch replication settings.
      type: object
      properties:
        ca_cert:
          format: string
          type: string
          description: Trusted CA certificate when connecting to HTTPS Elastic endpoint, in PEM format.
        enabled:
          type: boolean
          description: Whether or not ElasticSearch replication is enabled.
        password:
          format: string
          type: string
          nullable: true
          description: Login password for ElasticSearch. Will be stored encrypted in the Sandfly database and not returned in getconfig API calls. When updating configuration, leave null to not replace existing saved password.
        url:
          format: string
          type: string
          description: ElasticSearch HTTP/HTTPS URL.
        username:
          format: string
          type: string
          description: ElasticSearch login username.
        summary_results:
          description: Include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        duplicate_alerts:
          description: Send a duplicate alert when the alert is updated with new information.
          type: boolean
          default: false
        duplicate_summary:
          description: When sending duplicate alerts, include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
    ServerConfigPostgres:
      type: object
      required:
        - enabled
        - username
        - database
        - host
        - extra_options
      description: PostgreSQL replication settings.
      properties:
        enabled:
          type: boolean
          description: Indicates if PostgreSQL replication is enabled or not.
        database:
          format: string
          type: string
          description: Database name on the target PostgreSQL server.
        extra_options:
          format: string
          type: string
          description: Extra options to include in the connection string to PostgreSQL. Must be in the 'option=value option2=value2 ...' format.
        host:
          format: string
          type: string
          description: PostgreSQL hostname or IP address.
        password:
          format: string
          type: string
          nullable: true
          description: PostrgeSQL login password. Will be stored encrypted in the Sandfly database and not returned in getconfig calls. Leave as null when updating configuration to not replace the existing saved password.
        username:
          format: string
          type: string
          description: PostgreSQL login username.
    ServerConfigSentinel:
      type: object
      required:
        - enabled
        - ssh_enabled
        - host_enabled
        - tenant_id
        - client_id
        - ingest_url
        - dcr_id
        - stream_name
        - ssh_stream_name
        - host_stream_name
        - alerts_only
        - summary_results
        - duplicate_alerts
        - duplicate_summary
        - auth_method
        - auth_certificate
      description: Microsoft Sentinel replication settings.
      properties:
        enabled:
          type: boolean
          description: Indicates if Sentinel replication is enabled or not.
        ssh_enabled:
          type: boolean
          description: Indicates if Sentinel SSH Key replication is enabled or not.
        host_enabled:
          type: boolean
          description: Indicates if Sentinel Hosts replication is enabled or not.
        tenant_id:
          format: string
          type: string
          description: Microsoft Azure Tenant ID GUID.
        client_id:
          format: string
          type: string
          description: Microsoft Azure Application Client ID GUID.
        ingest_url:
          format: string
          type: string
          description: Sentinel Data collection endpoint logs ingestion base URL.
        dcr_id:
          format: string
          type: string
          description: Sentinel Data collection rule immutable ID.
        stream_name:
          format: string
          type: string
          description: Sentinel Data collection rule Results custom table stream name.
        ssh_stream_name:
          format: string
          type: string
          description: Sentinel Data collection rule SSH Key custom table stream name.
        host_stream_name:
          format: string
          type: string
          description: Sentinel Data collection rule Hosts custom table stream name.
        alerts_only:
          type: boolean
          description: Indicates type of results to send to Sentinel. True sends only alert and error results, false sends all results. Either way, a result already sent is sent again when its alert is resolved, because it was whitelisted to a pass or a later scan superseded it. A superseded alert is sent with SandflyStatus pass, and SandflyData.Superseded true.
        summary_results:
          description: Include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        duplicate_alerts:
          description: Send a duplicate alert when the alert is updated with new information.
          type: boolean
          default: false
        duplicate_summary:
          description: When sending duplicate alerts, include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        auth_method:
          type: string
          description: Whether to use a client secret or certificate credentials for authentication.
          enum:
            - client_secret
            - certificate_credentials
        auth_certificate:
          type: string
          description: Only used when auth_method is certificate_credentials. x509 certificate, in PEM format, that matches a certificate in the Azure app registration for Sandfly to authenticate with Azure. Azure requires that the certificate use RSA keys.
        password:
          format: string
          type: string
          nullable: true
          description: When auth_method is client_secret, this is the Client Secret value to log in to Azure with. When auth_method is certificate_credentials, this is an unencrypted private key in PEM format associated with auth_certificate. In both cases, will be stored encrypted in the Sandfly database and not returned in getconfig calls. Leave as null when updating configuration to not replace the existing saved secret value.
    ServerConfigSSO:
      type: object
      description: SSO configuration options.
      required:
        - saml_enabled
        - idp_entity_id
        - idp_certificate
        - idp_sso_binding
        - request_signature_method
        - sp_entity_id
        - sp_certificate
        - sp_private_key
      properties:
        idp_certificate:
          format: string
          type: string
          description: IDP certificate (IDP X509 Certificate provided in the IDP's SAML metadata).
        idp_entity_id:
          format: string
          type: string
          description: IDP entity ID (entityID attribute on the EntityDescriptor element of the IDP's SAML metadata).
        idp_sso_binding:
          format: string
          type: string
          description: IDP SSO binding URL.
        request_signature_method:
          $ref: "#/components/schemas/RequestSignatureMethod"
        sp_certificate:
          format: string
          type: string
          description: If request signing is used, this Sandfly system's certificate.
        sp_entity_id:
          format: string
          type: string
          description: This Sandfly system's client entity ID.
        sp_private_key:
          format: string
          type: string
          description: If request signing is used, this Sandfly system's private key.
        saml_enabled:
          type: boolean
          description: Is SAML SSO enabled for this Sandfly instance.
    ServerConfigAdvanced:
      type: object
      description: Advanced performance tuning configuration. If the Postgres server allows fewer connections than the configured pool sizes require, the server starts with smaller pools and logs an error.
      required:
        - db_pool_size
        - db_pool_size_nodes
        - result_workers
        - disable_nightly_maintenance
        - disable_strict_tls_policy
        - sso_redirect_prefix
        - esrepl_batch_size
        - sentinel_batch_size
      properties:
        db_pool_size:
          type: integer
          format: int64
          minimum: 20
          maximum: 100
          description: Database connection pool size for general operations.
          default: 50
        db_pool_size_nodes:
          type: integer
          format: int64
          minimum: 20
          maximum: 100
          description: Database connection pool size dedicated to node result ingestion, AI triage, and some other background activity.
          default: 30
        result_workers:
          type: integer
          format: int64
          minimum: 5
          maximum: 100
          description: Number of concurrent workers for processing scan results.
          default: 20
        disable_nightly_maintenance:
          type: boolean
          description: Disable nightly database maintenance tasks. When true, relies on PostgreSQL autovacuum for maintenance.
          default: false
        disable_strict_tls_policy:
          type: boolean
          description: Disable strict TLS policy for the server. When true, uses Go's default TLS configuration. When false (default), enforces TLS 1.2+ with a limited set of strong cipher suites. Changes require a server restart to take effect.
          default: false
        sso_redirect_prefix:
          type: string
          description: Optional URL prefix for SSO redirect after successful SAML authentication. If set, the SSO redirect will use this prefix instead of the root path.
        esrepl_batch_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 500
          description: Elasticsearch result replication batch size.
          default: 250
        sentinel_batch_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 500
          description: Sentinel result replication batch size.
          default: 250
    ServerConfigAdvancedEdit:
      type: object
      description: Advanced performance tuning configuration. Changes require a server restart to take effect. If the Postgres server allows fewer connections than the configured pool sizes require, the server starts with smaller pools and logs an error.
      properties:
        db_pool_size:
          type: integer
          format: int64
          nullable: true
          minimum: 20
          maximum: 100
          description: Database connection pool size for general operations.
          default: 50
        db_pool_size_nodes:
          type: integer
          format: int64
          nullable: true
          minimum: 20
          maximum: 100
          description: Database connection pool size dedicated to node result ingestion, AI triage, and some other background activity.
          default: 30
        result_workers:
          type: integer
          format: int64
          nullable: true
          minimum: 5
          maximum: 100
          description: Number of concurrent workers for processing scan results.
          default: 20
        disable_nightly_maintenance:
          type: boolean
          nullable: true
          description: Disable nightly database maintenance tasks. When true, relies on PostgreSQL autovacuum for maintenance.
          default: false
        disable_strict_tls_policy:
          type: boolean
          nullable: true
          description: Disable strict TLS policy for the server. When true, uses Go's default TLS configuration. When false (default), enforces TLS 1.2+ with a limited set of strong cipher suites. Changes require a server restart to take effect.
          default: false
        sso_redirect_prefix:
          type: string
          nullable: true
          description: Optional URL prefix for SSO redirect after successful SAML authentication. If set, the SSO redirect will use this prefix instead of the root path.
        esrepl_batch_size:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 500
          description: Elasticsearch result replication batch size.
          default: 250
        sentinel_batch_size:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 500
          description: Sentinel result replication batch size.
          default: 250
    RequestSignatureMethod:
      type: string
      enum:
        - none
        - sha1
        - sha256
        - sha512
      description: Request signing method. Typically 'none'.
    ResponseActionOrder:
      description: A single scan order dispatched (or short-circuited) by a response action request. A result response action always produces one order; SSH key actions produce one per affected host.
      properties:
        action_ids:
          description: Action IDs created for this order. Process and file orders contain one; SSH key orders contain one per affected user.
          type: array
          items:
            type: integer
            format: int64
        run_id:
          description: Run ID of the scan order that will execute the action(s). Empty when the action was fulfilled immediately from a previously cached retrieval and no scan was dispatched.
          type: string
        target_address:
          description: Sandfly's host target address (hostname or IP) for the host at request time.
          type: string
        node_name:
          description: OS-reported hostname of the target host.
          type: string
        host_id:
          description: " ID of the target host."
          type: string
        host_sequence_id:
          description: Sequence ID of the target host.
          type: integer
        pid:
          description: Process ID targeted by the action (process actions only).
          type: integer
        path:
          description: File path targeted by the action (file_retrieve only).
          type: string
        users:
          description: Usernames targeted on this host (SSH key actions only). Parallel to action_ids.
          type: array
          items:
            type: string
        data_hash:
          description: SHA-512 (hex) content hash of a previously retrieved blob that fulfilled this action without dispatching a scan. Pair with GET /responseaction/data/{hash} to download.
          type: string
      required:
        - action_ids
        - run_id
        - target_address
        - node_name
        - host_id
        - host_sequence_id
      type: object
    ResponseActionResponse:
      description: |-
        Response envelope for /responseaction/result/..., /responseaction/artifact/..., and /responseaction/sshpubkey/... POST endpoints.

        For retrieve actions (process_retrieve, file_retrieve), if a blob with the same SHA-512 hash has already been retrieved (from this or any other host) the server returns HTTP 200 and the single order carries data_hash with an empty run_id (no scan dispatched, action already logged as successful). Otherwise HTTP 202 is returned and the order carries the run_id of the dispatched scan.
      properties:
        status:
          description: HTTP status code.
          format: int32
          type: integer
          example: 202
        detail:
          description: Status message.
          type: string
          example: response action queued
        action:
          $ref: "#/components/schemas/ResponseActionType"
        key_id:
          description: SSH public key ID the action targets (SSH key actions only).
          type: integer
        orders:
          description: Orders created for this request, one per target host.
          type: array
          items:
            $ref: "#/components/schemas/ResponseActionOrder"
      required:
        - status
        - detail
        - action
        - orders
      type: object
    ResponseActionType:
      description: The type of action that was performed.
      oneOf:
        - $ref: "#/components/schemas/ResponseActionTypeResult"
        - $ref: "#/components/schemas/ResponseActionTypeSsh"
    ResponseActionTypeResult:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionTypeProcessNonCached"
        - $ref: "#/components/schemas/ResponseActionTypeProcessCached"
        - $ref: "#/components/schemas/ResponseActionTypeFileCached"
    ResponseActionTypeSsh:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionTypeSshNonCached"
    ResponseActionTypeNonCached:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionTypeProcessNonCached"
        - $ref: "#/components/schemas/ResponseActionTypeSshNonCached"
    ResponseActionTypeCached:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionTypeProcessCached"
        - $ref: "#/components/schemas/ResponseActionTypeFileCached"
    ResponseActionTypeProcessNonCached:
      type: string
      enum:
        - process_kill
        - process_suspend
        - process_resume
    ResponseActionTypeProcessCached:
      type: string
      enum:
        - process_retrieve
    ResponseActionTypeFileCached:
      type: string
      enum:
        - file_retrieve
    ResponseActionTypeSshNonCached:
      description: The type of action that was performed.
      type: string
      enum:
        - sshkey_remove
        - sshkey_dedup
    ResponseActionStatus:
      description: Current status of the action.
      anyOf:
        - $ref: "#/components/schemas/ResponseActionStatusSuccess"
        - $ref: "#/components/schemas/ResponseActionStatusFailure"
        - $ref: "#/components/schemas/ResponseActionStatusInFlight"
    ResponseActionStatusInFlight:
      type: string
      enum:
        - pending
    ResponseActionStatusFailure:
      type: string
      enum:
        - verification_failed
        - failed
        - skipped
        - node_denied
    ResponseActionStatusSuccess:
      type: string
      enum:
        - success
    ResponseActionLogSummary:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionLogSummaryNonCached"
        - $ref: "#/components/schemas/ResponseActionLogSummaryNonCached"
    ResponseActionLogCommon:
      properties:
        action_id:
          description: Numeric identifier for this response action
          type: integer
          format: int64
        correlation_id:
          description: Internal identifier sent in the order during response execution.
          type: string
        run_id:
          description: Run ID of the scan order that executed this action. Empty if the action was fulfilled from cached data.
          type: string
        status:
          $ref: "#/components/schemas/ResponseActionStatus"
        message:
          description: Human-readable detail about the action outcome.
          type: string
        requested_by:
          description: Username of the user who initiated the action.
          type: string
        requested_at:
          description: Timestamp when the action was requested.
          type: string
          format: date-time
        completed_at:
          description: Timestamp when the action result was received. Null while pending.
          type: string
          format: date-time
        host_id:
          description: Host ID of the target host.
          type: string
        host_sequence_id:
          description: Numeric sequence ID of the target host at the time the action was requested.
          type: integer
        target_address:
          description: Target address (hostname or IP) for the host at the time the action was requested.
          type: string
        node_name:
          description: OS-reported hostname of the target host at the time the action was requested.
          type: string
        last_seen_ip_addr:
          description: Last-seen IP address of the target host at the time the action was requested.
          type: string
        source_artifact_id:
          description: Numeric artifact ID the action was taken against. Null for actions that do not target an artifact (e.g. SSH key removal by key ID).
          type: integer
          format: int64
        source_result_id:
          deprecated: true
          description: "Deprecated: use source_artifact_id. Numeric result ID the action was requested through, when it was requested with POST /responseaction/result/{id}/{action}. For actions requested on the artifact directly, one of the artifact's results chosen to represent it: a current result in preference to a superseded one, then an alert in preference to an error or pass. Null for actions not initiated from an artifact or result (e.g. SSH key removal by key ID). The action itself was taken against the artifact in source_artifact_id."
          type: integer
          format: int64
        data_hash:
          description: SHA-512 content hash of an associated binary blob (retrieved process binary or file). Use GET /responseaction/data/{hash} to download. Empty if no data was retrieved.
          type: string
        key_data:
          description: "Most-relevant string identifier for the action's target: file path for file_retrieve, process name for process actions, SSH key friendly name for SSH key actions. Empty if the action target had no identifier available."
          type: string
        hash:
          description: Cryptographic hashes of the action's target item (process binary, file, or SSH key). Individual fields are empty if the corresponding hash was not collected.
          type: object
          required:
            - md5
            - sha1
            - sha256
            - sha512
          properties:
            md5:
              type: string
              description: MD5 hash of the target item.
            sha1:
              type: string
              description: SHA-1 hash of the target item.
            sha256:
              type: string
              description: SHA-256 hash of the target item.
            sha512:
              type: string
              description: SHA-512 hash of the target item.
        host_exists:
          description: True if the original target host record still exists in Sandfly and has not been deleted. When false, GET /hosts/{host_id} will return 404.
          type: boolean
        source_artifact_exists:
          description: True if the artifact the action was taken against still exists and can be retrieved with GET /artifacts/{source_artifact_id}. When false, that request will return 404, for example because the artifact or its host has been deleted. Always false when source_artifact_id is null.
          type: boolean
        source_result_exists:
          deprecated: true
          description: "Deprecated: use source_artifact_exists. True if the original source result still exists in the results table. When false, GET /results/{source_result_id} will return 404. Always false when source_result_id is null."
          type: boolean
      required:
        - action_id
        - correlation_id
        - run_id
        - status
        - requested_by
        - requested_at
        - host_id
        - host_sequence_id
        - target_address
        - node_name
        - last_seen_ip_addr
        - key_data
        - hash
        - host_exists
        - source_artifact_exists
        - source_result_exists
      type: object
    ResponseActionLogSummaryNonCached:
      required:
        - action_type
      allOf:
        - $ref: "#/components/schemas/ResponseActionLogCommon"
      properties:
        action_type:
          $ref: "#/components/schemas/ResponseActionTypeNonCached"
        source_result_id:
          deprecated: true
          description: "Deprecated: use source_artifact_id. Numeric result ID the action was requested through, when it was requested with POST /responseaction/result/{id}/{action}. For actions requested on the artifact directly, one of the artifact's results chosen to represent it: a current result in preference to a superseded one, then an alert in preference to an error or pass. Null for actions not initiated from an artifact or result (e.g. SSH key removal by key ID). The action itself was taken against the artifact in source_artifact_id."
          type: integer
          format: int64
      type: object
    ResponseActionLogSummaryCached:
      required:
        - action_type
      allOf:
        - $ref: "#/components/schemas/ResponseActionLogCommon"
      properties:
        action_type:
          $ref: "#/components/schemas/ResponseActionTypeCached"
        source_result_id:
          deprecated: true
          description: "Deprecated: use source_artifact_id. Numeric result ID the action was requested through, when it was requested with POST /responseaction/result/{id}/{action}. For actions requested on the artifact directly, one of the artifact's results chosen to represent it: a current result in preference to a superseded one, then an alert in preference to an error or pass. Null for actions not initiated from an artifact or result (e.g. SSH key removal by key ID). The action itself was taken against the artifact in source_artifact_id."
          type: integer
          format: int64
        data_hash:
          description: SHA-512 content hash of an associated binary blob (retrieved process binary or file). Use GET /responseaction/data/{hash} to download. Empty if no data was retrieved.
          type: string
      type: object
    ResponseActionLogList:
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResponseActionLogSummary"
        more_results:
          type: boolean
          description: True if additional pages of results are available.
      required:
        - data
        - more_results
      type: object
    ResponseActionLogEntry:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionLogEntrySSH"
        - $ref: "#/components/schemas/ResponseActionLogEntryResult"
    ResponseActionLogEntrySSH:
      allOf:
        - $ref: "#/components/schemas/ResponseActionLogCommon"
      required:
        - action_type
      properties:
        action_type:
          allOf:
            - $ref: "#/components/schemas/ResponseActionTypeProcessNonCached"
            - $ref: "#/components/schemas/ResponseActionTypeProcessCached"
            - $ref: "#/components/schemas/ResponseActionTypeSshNonCached"
        source_result_json:
          $ref: "#/components/schemas/SshKeySummary"
          nullable: true
          description: Copy of the source result JSON at the time the action was requested.
        action_result_json:
          $ref: "#/components/schemas/ResponseActionReceiptSsh"
      type: object
    ResponseActionLogEntryResult:
      allOf:
        - $ref: "#/components/schemas/ResponseActionLogCommon"
      required:
        - action_type
      properties:
        action_type:
          allOf:
            - $ref: "#/components/schemas/ResponseActionTypeResult"
        source_artifact_json:
          allOf:
            - $ref: "#/components/schemas/ArtifactDetail"
          nullable: true
          description: Copy of the artifact the action was taken against, as GET /artifacts/{id} reported it at the time the action was requested.
        source_result_json:
          allOf:
            - $ref: "#/components/schemas/Result"
          nullable: true
          deprecated: true
          description: "Deprecated: use source_artifact_json. Copy of the result named by source_result_id at the time the action was requested. source_artifact_json is the record of what the action was taken against."
        action_result_json:
          $ref: "#/components/schemas/ResponseActionReceiptResult"
      type: object
    ResponseActionReceipt:
      oneOf:
        - $ref: "#/components/schemas/ResponseActionReceiptSsh"
        - $ref: "#/components/schemas/ResponseActionReceiptResult"
    ResponseActionReceiptCommon:
      readOnly: true
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ResponseActionStatus"
        message:
          description: Human-readable detail about the action outcome.
          type: string
        verified:
          type: boolean
    ResponseActionReceiptSsh:
      readOnly: true
      type: object
      allOf:
        - $ref: "#/components/schemas/ResponseActionReceiptCommon"
      properties:
        type:
          $ref: "#/components/schemas/ResponseActionTypeSshNonCached"
        sshkey_files:
          type: array
          items:
            $ref: "#/components/schemas/ResponseActionReceiptSshKeyFile"
    ResponseActionReceiptSshKeyFile:
      readOnly: true
      type: object
      properties:
        path:
          type: string
        keys_found:
          type: number
        backup_path:
          type: string
        keys_removed:
          type: number
        keys_remaining:
          type: number
    ResponseActionReceiptResult:
      readOnly: true
      type: object
      allOf:
        - $ref: "#/components/schemas/ResponseActionReceiptCommon"
      required:
        - type
      properties:
        type:
          oneOf:
            - $ref: "#/components/schemas/ResponseActionTypeResult"
        actual_path:
          type: string
        data_size:
          type: number
        actual_hash_sha512:
          type: string
    SSHKeyActionRequest:
      description: Optional JSON body for an SSH key response action request. An empty body is equivalent to setting the allow_last_key_removal property to false.
      properties:
        allow_last_key_removal:
          description: When true, override the last-key protection safety check. Without this flag set, a 'sshkey_remove' action that would leave any affected host with zero SSH keys known to Sandfly is denied with HTTP 409. Has no effect for the 'sshkey_dedup' action.
          type: boolean
      type: object
    SSHKeyLastKeyProtectionResponse:
      description: Returned with HTTP 409 when a 'remove' action is denied because it would remove the last SSH key Sandfly knows about on one or more hosts. Set allow_last_key_removal=true in the request body to override.
      properties:
        status:
          description: HTTP status code.
          format: int32
          type: integer
          example: 409
        title:
          description: Short description of status.
          type: string
          example: Last SSH Key Protection
        detail:
          description: Extended explanation of status.
          type: string
        data:
          description: Data describing which hosts (and which users on those hosts) would be left with no known SSH keys.
          type: object
          properties:
            hosts:
              type: array
              items:
                type: object
                properties:
                  host_sequence_id:
                    description: Sequence ID of the host that would be left with no known SSH keys.
                    format: int32
                    type: integer
                  hostname:
                    description: Hostname of the affected host.
                    type: string
                  users:
                    description: Usernames on the host that would lose the last known SSH key.
                    type: array
                    items:
                      type: string
                required:
                  - host_sequence_id
                  - hostname
                  - users
          required:
            - hosts
      required:
        - status
        - title
        - detail
        - data
      type: object
    StandardResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponseStatus"
      properties:
        data:
          description: Data that can go along with the status.
          type: string
      required:
        - data
      type: object
    StandardResponseStatus:
      properties:
        detail:
          description: Extended explanation of status.
          type: string
        formattedDetail:
          description: Optional additional details about the status (typically an error) that, if present and not an empty string, should be displayed as pre-formatted, monospaced text.
          type: string
        status:
          description: HTTP status code.
          format: int32
          maximum: 599
          minimum: 100
          type: integer
        title:
          description: Short description of status.
          type: string
      required:
        - status
        - title
        - detail
      type: object
    StatusNodes:
      required:
