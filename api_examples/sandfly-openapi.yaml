        - user_password_disabled
        - user_password_empty
        - user_password_present
        - user_password_type
        - user_ssh_authorized_keys_count
        - user_ssh_authorized_keys_duplicates
      properties:
        user_id:
          type: integer
          description: The UID of the user.
        user_name:
          type: string
          description: The username of the user.
        group_id:
          type: integer
          description: The primary GID of the user.
        group_name:
          type: string
          description: The name of the primary group of the user.
        group_membership:
          type: array
          items:
            type: string
          description: A list of additional group memberships for the user.
        user_home_dir:
          type: string
          description: The home directory of the user.
        user_gecos:
          type: string
          description: The GECOS field associated with the user.
        user_password_locked:
          type: boolean
          example: false
          description: Indicates if the user's password is locked.
        user_password_disabled:
          type: boolean
          example: false
          description: Indicates if the user's password is disabled.
        user_password_empty:
          type: boolean
          example: false
          description: Indicates if the user's password is empty.
        user_password_present:
          type: boolean
          example: true
          description: Indicates if the user's password is present.
        user_password_type:
          type: string
          description: The hash algorithm used for the user's password.
        user_ssh_authorized_keys_count:
          type: integer
          description: The number of SSH authorized keys for the user.
        user_ssh_authorized_keys_duplicates:
          type: boolean
          description: Indicates if there are duplicate SSH authorized keys for the user.
    HostBrief:
      type: object
      required:
        - host_id
        - host_sequence_id
        - hostname
        - os_info_node
        - tags
        - os_info_os_release_pretty_name
        - date_last_scan
      properties:
        host_id:
          type: string
          description: Unique ID of the host.
        host_sequence_id:
          type: integer
          description: Alternative integer ID assigned to this host.
        hostname:
          type: string
          description: Hostname of host.
        os_info_node:
          type: string
          description: OS node name.
        tags:
          type: array
          description: A list of tags for this host. Empty when the host has no tags.
          items:
            type: string
        os_info_os_release_pretty_name:
          type: string
          description: Human friendly OS distribution name and version.
        date_last_scan:
          type: string
          description: Date and time a node last connected to this host. Null when no node has ever connected to it.
          format: date-time
          nullable: true
    HostRollup:
      type: object
      required:
        - host
        - ssh_summary
        - whitelists_count
        - result_profiles_count
        - recon_status
        - triage
        - severity
      properties:
        host:
          $ref: "#/components/schemas/Host"
        ssh_summary:
          type: object
          allOf:
            - $ref: "#/components/schemas/SshHostSummarySSHInfo"
            - $ref: "#/components/schemas/SshHostSummaryUsers"
          properties:
            zones:
              type: array
              items:
                $ref: "#/components/schemas/SSHZoneSummary"
        whitelists_count:
          type: integer
          description: Number of whitelists applied to this host.
        result_profiles_count:
          type: integer
          description: Number of result profiles applied to this host.
        recon_status:
          type: object
          description: "Status of the recon sandflies that contribute to host information displayed in the UI. Each property is a sandfly name. 'ok' means the sandfly is active and has run against this host with its results still stored, including the case where it ran and found nothing to report. 'missing_results' means that even though the sandfly is active, it has no data for this host: it has never run against the host, or the results its last run recorded are no longer in the database (deleted, or expired under the data retention settings). 'sandfly_inactive' means the sandfly is inactive."
          additionalProperties:
            $ref: "#/components/schemas/SandflyStatus"
        alerting_artifacts:
          type: array
          description: "The host's current alerting artifacts, highest severity first and, within a severity, most recently seen first. Superseded artifacts are not included. Present only when the request set `artifacts=true`: absent means the caller did not ask for them, while an empty array means the host has none. The list is capped at 50 artifacts; more_alerting_artifacts says whether the host has more of them, which POST /artifacts filtered on this host will list. Every entry carries host_counts, so the caller can tell an alert peculiar to this host from one that more hosts share without asking about each artifact separately, and summarizes the sandflies matching it in sandflies, worst result first."
          items:
            $ref: "#/components/schemas/Artifact"
        more_alerting_artifacts:
          type: boolean
          description: True when the host has more alerting artifacts than alerting_artifacts holds. Reported only alongside alerting_artifacts, and only when true; absent reads as false.
        triage:
          $ref: "#/components/schemas/HostTriage"
          nullable: true
          description: The host's cached AI triage verdict. Null when the host has never been triaged and is not waiting to be; a host queued for its first verdict carries it in the `queued` or `running` state, with its queue position.
        severity:
          type: integer
          description: The host's severity, 0-5. When AI triage has analyzed the host, the analysis sets the severity. Otherwise it's the highest severity among the host's alerting artifacts or 0 when nothing is alerting. A host with an artifact in error is at least severity 2 either way, since an error means part of the host could not be scanned.
          minimum: 0
          maximum: 5
    HostSummary:
