  "/responseaction/result/{id}/{action}":
    post:
      deprecated: true
      description: |-
        Deprecated: use POST /responseaction/artifact/{id}/{action}, passing the result's artifact_id. Initiates a response action from an existing result. The action is taken against the artifact the result is about, exactly as POST /responseaction/artifact/{id}/{action} would, and the action log records both the artifact and the result it was requested through. For process actions (process_kill, process_suspend, process_resume, process_retrieve), the result must contain process data with a SHA-512 hash. For file_retrieve, the result must contain a file path (from file, cron, or at job engines). Requires the responder role. Can be disabled server-wide with SF_DISABLE_RESPONSES and at the node level with SF_NODE_DISABLE_RESPONSES.

        Returns a ResponseActionResponse in both the queued (HTTP 202) and cached-fulfillment (HTTP 200, retrieve actions only) cases.
      operationId: dispatchResultAction
      parameters:
        - description: Numeric result ID to act on.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Action to perform. Process actions require a process result; file_retrieve requires a result with a file path.
          in: path
          name: action
          required: true
          schema:
            oneOf:
              - $ref: "#/components/schemas/ResponseActionTypeResult"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Retrieve action fulfilled immediately from a previously cached blob (matched by SHA-512 hash). No scan was dispatched; an action log entry was recorded as successful and references the existing blob via the order's data_hash field.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Action queued for execution.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid action type, result does not contain the required data (process or file path), host is inactive, or host no longer exists.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: User does not have the responder role, or response actions are disabled on the server (SF_DISABLE_RESPONSES=true).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Result ID does not exist.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Perform response action on a process result
      tags:
        - Response Actions
  "/responseaction/artifact/{id}/{action}":
    post:
      description: |-
        Initiates a response action against an existing artifact. For process actions (process_kill, process_suspend, process_resume, process_retrieve), the artifact must contain process data with a SHA-512 hash. For file_retrieve, the artifact must contain a file path (from file, cron, or at job engines). Requires the responder role. Can be disabled server-wide with SF_DISABLE_RESPONSES and at the node level with SF_NODE_DISABLE_RESPONSES.

        Returns a ResponseActionResponse in both the queued (HTTP 202) and cached-fulfillment (HTTP 200, retrieve actions only) cases.
      operationId: dispatchArtifactAction
      parameters:
        - description: Numeric artifact ID to act on.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Action to perform. Process actions require a process artifact; file_retrieve requires an artifact with a file path.
          in: path
          name: action
          required: true
          schema:
            oneOf:
              - $ref: "#/components/schemas/ResponseActionTypeResult"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Retrieve action fulfilled immediately from a previously cached blob (matched by SHA-512 hash). No scan was dispatched; an action log entry was recorded as successful and references the existing blob via the order's data_hash field.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Action queued for execution.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid action type, artifact does not contain the required data (process or file path), host is inactive, or host no longer exists.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: User does not have the responder role, or response actions are disabled on the server (SF_DISABLE_RESPONSES=true).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Artifact ID does not exist.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Perform response action on an artifact
      tags:
        - Response Actions
  "/responseaction/sshpubkey/{keyid}/{action}":
    post:
      description: Performs an SSH key response action (remove or deduplicate) across all hosts and users where the key is deployed. Requires the responder role. Creates one order per affected host, each containing one action per affected user. Can be disabled server-wide with SF_DISABLE_RESPONSES and at the node level with SF_NODE_DISABLE_RESPONSES. For 'remove' actions, a last-key protection safety check denies the request with HTTP 409 if any affected host would be left with zero SSH keys known to Sandfly; set allow_last_key_removal=true in the request body to override.
      operationId: dispatchSshKeyAction
      parameters:
        - description: SSH public key ID (integer) from SSH Hunter.
          in: path
          name: keyid
          required: true
          schema:
            format: int32
            type: integer
        - description: "Action to perform: 'sshkey_remove' deletes all copies, 'sshkey_dedup' removes duplicates leaving one copy."
          in: path
          name: action
          required: true
          schema:
            $ref: "#/components/schemas/ResponseActionTypeSshNonCached"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHKeyActionRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseActionResponse"
          description: Action queued for execution across all affected hosts.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Key has no stored value, no active hosts available, or no active placements found.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: User does not have the responder role, or response actions are disabled on the server.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: SSH public key ID does not exist, or no active placements found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyLastKeyProtectionResponse"
          description: "Last-key protection: the remove action would leave one or more hosts with no SSH keys known to Sandfly. The response body identifies the affected hosts and users. Set allow_last_key_removal=true in the request body to override."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Remove or deduplicate an SSH key across all hosts
      tags:
        - Response Actions
  "/responseaction/sshpubkey/{keyid}/{action}/host/{host_sequence_id}":
    post:
      description: Performs an SSH key response action on a specific host for all users that have the key. Requires the responder role. For 'remove' actions, a last-key protection safety check denies the request with HTTP 409 if the host would be left with zero SSH keys known to Sandfly; set allow_last_key_removal=true in the request body to override.
      operationId: dispatchSshKeyHostAction
