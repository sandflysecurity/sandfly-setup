          description: Has this task been assigned to a node?
          type: boolean
      type: object
    SyslogAdd:
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/SyslogUpdate"
      properties:
        name:
          description: A readable name for this syslog entry.
          type: string
      type: object
    SyslogUpdate:
      required:
        - hostname
        - udp_port
        - pass_facility
        - alert_facility
        - audit_facility
        - error_facility
        - transport
        - use_tls
        - summary_results
        - duplicate_alerts
        - duplicate_summary
        - full_json_result
        - ignore_certs
        - ca_cert_b64
      properties:
        hostname:
          description: hostname or IP address used with this syslog entry.
          type: string
          format: uri
        pass_facility:
          description: Integer Syslog Facility code for Pass Results
          type: integer
          default: -1
          minimum: -1
          maximum: 23
        alert_facility:
          description: Integer Syslog Facility code for Alert Results
          type: integer
          default: -1
          minimum: -1
          maximum: 23
        audit_facility:
          description: Integer Syslog Facility code for Audit Logs
          type: integer
          default: -1
          minimum: -1
          maximum: 23
        error_facility:
          description: Integer Syslog Facility code for Scan Error Logs
          type: integer
          default: -1
          minimum: -1
          maximum: 23
        udp_port:
          description: Port number to use to send syslog data (despite 'udp' in the property name, this is also used for TCP connections).
          format: int32
          type: integer
          default: 514
        transport:
          $ref: "#/components/schemas/SyslogTransport"
        use_tls:
          description: When using TCP transport, use TLS. This property has no effect if transport is 'udp'.
          type: boolean
          default: false
        summary_results:
          description: Include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        duplicate_alerts:
          description: Send a duplicate alert when the alert is updated with new information.
          type: boolean
          default: false
        duplicate_summary:
          description: When sending duplicate alerts, include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        full_json_result:
          description: Send the complete result document (the same JSON the API returns for the result) in the syslog message with no message size limit. The result_summary and host structured data elements are omitted since the document already contains that metadata. Takes precedence over summary_results and duplicate_summary. Full results may exceed the size of a single UDP datagram, so TCP transport is recommended.
          type: boolean
          default: false
        ignore_certs:
          description: When using TLS, set this property to true to disable certificate validation. This property has no effect unless transport=tcp and use_tls=true.
          type: boolean
          default: false
        ca_cert_b64:
          description: Optional base64-encoded PEM-format certificate to append to the system certificate pool to use for syslog TLS server certificate validation. This property has no effect unless transport=tcp, use_tls=true, and ignore_certs=false.
          type: string
      type: object
    SystemdActiveState:
      type: string
      title: SystemdActiveState
      description: The running state of a systemd unit.
      enum:
        - active
        - reloading
        - inactive
        - failed
        - activating
        - deactivating
        - maintenance
      x-enumDescriptions:
        active: Running or in use.
        reloading: Reloading its configuration.
        inactive: Not running.
        failed: Entered a failure state.
        activating: Starting up.
        deactivating: Shutting down.
        maintenance: In maintenance.
      x-enumSeverities:
        active: 0
        reloading: 0
        inactive: 0
        failed: 2
        activating: 0
        deactivating: 0
        maintenance: 0
    SystemdLoadState:
      type: string
      title: SystemdLoadState
      description: Whether systemd could load a unit's configuration.
      enum:
        - loaded
        - not-found
        - error
        - masked
        - bad-setting
        - merged
        - stub
      x-enumDescriptions:
        loaded: The unit file was found and parsed.
        not-found: "No unit file exists: a stale or removed unit still referenced."
        error: The unit file exists but could not be loaded.
        masked: The unit is masked and cannot start. Masking a security service is a way to disable it.
        bad-setting: The unit file has an invalid setting.
        merged: The unit was merged into another.
        stub: A placeholder with no backing file.
      x-enumSeverities:
        loaded: 0
        not-found: 2
        error: 2
        masked: 5
        bad-setting: 2
        merged: 0
        stub: 0
    SystemdSessionSignal:
      type: string
      title: SystemdSessionSignal
      description: Findings from a user's systemd session.
      enum:
        - linger
        - lingering-service-account
      x-enumDescriptions:
        linger: The user's services keep running after they log out. Routine for an administrator.
        lingering-service-account: A service account that never logs in is set to keep services running, which it has no reason to do.
      x-enumSeverities:
        linger: 2
        lingering-service-account: 5
    SystemdSignal:
      type: string
      title: SystemdSignal
      description: Findings from a systemd unit.
      enum:
        - masked-unit
        - unit-failed
        - stale-unit
        - ld-preload
        - user-scope-unit
      x-enumDescriptions:
        masked-unit: The unit is masked and cannot start. Masking a security service is a way to disable it.
        unit-failed: The unit entered a failure state.
        stale-unit: The unit is still referenced but its configuration file is gone.
        ld-preload: The unit preloads a library that can intercept everything the service does.
        user-scope-unit: A unit belonging to a single user rather than the system.
      x-enumSeverities:
        masked-unit: 5
        unit-failed: 2
        stale-unit: 2
        ld-preload: 5
        user-scope-unit: 2
    SyslogAlert:
      type: object
      required:
        - id
        - name
        - hostname
        - udp_port
        - pass_facility
        - alert_facility
        - audit_facility
        - error_facility
        - transport
        - use_tls
        - summary_results
        - duplicate_alerts
        - duplicate_summary
        - full_json_result
        - ignore_certs
        - ca_cert_b64
      properties:
        id:
          description: Alias for name.
          type: string
          deprecated: false
        name:
          description: A unique, readable name for this syslog entry.
          type: string
        hostname:
          description: hostname or IP address used with this syslog entry.
          type: string
          format: uri
        udp_port:
          description: UDP port number to use to send syslog data (despite 'udp' in the property name, this is also used for TCP connections).
          type: integer
          default: 514
        pass_facility:
          description: Integer Syslog Facility code for Pass Results
          type: integer
          default: -1
        alert_facility:
          description: Integer Syslog Facility code for Alert Results
          type: integer
          default: -1
        audit_facility:
          description: Integer Syslog Facility code for Audit Logs
          type: integer
          default: -1
        error_facility:
          description: Integer Syslog Facility code for Scan Error Logs
          type: integer
          default: -1
        transport:
          $ref: "#/components/schemas/SyslogTransport"
        use_tls:
          description: When using TCP transport, use TLS. This property has no effect if transport is 'udp'.
          type: boolean
          default: false
        summary_results:
          description: Include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        duplicate_alerts:
          description: Send a duplicate alert when the alert is updated with new information.
          type: boolean
          default: false
        duplicate_summary:
          description: When sending duplicate alerts, include the summary result JSON rather than the full size result JSON.
          type: boolean
          default: false
        full_json_result:
          description: Send the complete result document (the same JSON the API returns for the result) in the syslog message with no message size limit. The result_summary and host structured data elements are omitted since the document already contains that metadata. Takes precedence over summary_results and duplicate_summary. Full results may exceed the size of a single UDP datagram, so TCP transport is recommended.
          type: boolean
          default: false
        ignore_certs:
          description: When using TLS, set this property to true to disable certificate validation. This property has no effect unless transport=tcp and use_tls=true.
          type: boolean
          default: false
        ca_cert_b64:
          description: Optional base64-encoded PEM-format certificate to append to the system certificate pool to use for syslog TLS server certificate validation. This property has no effect unless transport=tcp, use_tls=true, and ignore_certs=false.
          type: string
