  /llmanalysis:
    get:
      summary: Get LLM analyses
      description: Get list of all LLM analyses. The returned list will be in reverse chronological order of modification date. If a hostid, resultid, or artifactid query parameter is supplied, the list will be limited to analyses involving that host, result, or artifact. If more than one is provided, an analysis must match all of them.
      operationId: getLlmAnalyses
      tags:
        - LLM Analysis
      parameters:
        - description: number of analyses per page
          in: query
          name: size
          required: false
          schema:
            type: integer
            default: 100
        - description: page number of analyses to retrieve
          in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - description: Host sequence ID to limit list to
          in: query
          name: hostid
          required: false
          schema:
            type: integer
        - description: Result ID to limit list to. Matches analyses requested through the result, and analyses of the artifact the result is about.
          in: query
          name: resultid
          required: false
          schema:
            type: integer
        - description: Artifact ID to limit list to. Matches analyses of the artifact, whether requested on the artifact directly or through one of its results.
          in: query
          name: artifactid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScrollingResponse"
                properties:
                  data:
                    description: List of LLM analyses
                    items:
                      $ref: "#/components/schemas/LlmAnalysisSummary"
                    type: array
                required:
                  - data
                type: object
          description: LLM analyses retrieved.
        "400":
          description: A page, size, hostid, resultid, or artifactid query parameter is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
    post:
      summary: Begin LLM analysis
      description: Begin a new LLM analysis for a host, or for results and/or artifacts.
      operationId: beginLlmAnalysis
      tags:
        - LLM Analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmAnalysisAdd"
      responses:
        "201":
          description: LLM analysis created.
          content:
            application/json:
              schema:
                type: integer
                description: ID of the newly created LLM analysis.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid request body.
        "403":
          description: LLM integration is not enabled in the server configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The host ID, a result ID, or an artifact ID was not found, or an artifact has no results to analyze.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
