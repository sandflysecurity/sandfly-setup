  /artifacts:
    post:
      description: |-
        Search the aggregated artifact list: one entry per scanned artifact (process, file, user, ...) regardless of how many sandflies matched it, with the list of matching sandfly names denormalized onto each entry. The per-(sandfly, artifact) view of the same data remains available at POST /results.

        Set `host_counts` to have each entry report how many hosts share the artifact; that form is limited to pages of 200 artifacts and its counts are capped per hash.
      operationId: searchArtifacts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: Filter in the same shape as the result search filter. See `ArtifactSearchFilterItemField` for the fields this endpoint exposes.
                  properties:
                    items:
                      $ref: "#/components/schemas/ArtifactSearchFilterItem"
                    logicOperator:
                      $ref: "#/components/schemas/ResultSearchFilterOperator"
                    quickFilterValues:
                      description: "Free-text terms matched case-insensitively against the columns that identify an artifact: exactly against id, external_id, host_id and the three base match hashes, and as a substring against status, hostname, node_name, ip_addr, host tags, key_data, engine, key_type and the matched sandfly names. This cannot use an index, so pre-filter with `items` where possible."
                      type: array
                      items:
                        type: string
                    quickFilterLogicOperator:
                      type: string
                      enum:
                        - and
                        - or
                    sort:
                      description: Sort criteria. Any field in `ArtifactSearchFilterItemField` may be used except the sandfly membership tests, which are not columns. A tiebreak on artifact id is appended so paging is stable. Defaults to last_seen descending.
                      type: array
                      items:
                        type: object
                        required:
                          - field
                          - sort
                        properties:
                          field:
                            type: string
                          sort:
                            type: string
                            enum:
                              - asc
                              - desc
                size:
                  type: integer
                  description: Maximum entries per page (default 100, max 10000).
                page:
                  type: integer
                  description: 1-based page number.
                host_counts:
                  type: boolean
                  description: "Include `host_counts` on every artifact returned: how many hosts share it, by each match hash. Opt-in because it is the one part of the search whose cost grows with how widespread the artifacts are, and capped per hash so a widespread artifact reports a floor rather than an exact number (see ArtifactHostCounts). Only available for pages of up to 200 artifacts; a larger `size` with this set is rejected. The artifact detail endpoint always reports these counts, and without a cap."
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
                  more_results:
                    type: boolean
          description: Artifacts retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid filter.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Search artifacts
      tags:
        - Results
    delete:
      description: |-
        Deletes artifacts in bulk, each with all of its per-sandfly results. Artifacts are selected by a filter, by a time, or by an explicit list of IDs; exactly one of the three may be used.

        This deletes whole artifacts: an artifact selected because one of the sandflies that matched it satisfies the filter is removed along with the rest of its per-sandfly results. Use DELETE /results when the intent is to remove one sandfly's finding and leave the artifact in place for the others.

        A filter or time_since delete runs in the background and returns as soon as the filter is known to be valid, so a 200 means the deletion was scheduled, not that it has finished. Deleting by artifact_ids is synchronous and reports how many of the requested artifacts existed.

        A filter with no items deletes every artifact. A filter whose conditions all have empty values narrows nothing, so it is rejected with a 400 rather than treated as a request to delete everything.
      operationId: deleteArtifacts
      requestBody:
        content:
          application/json:
            schema:
