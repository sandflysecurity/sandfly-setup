    OsSignal:
      type: string
      title: OsSignal
      description: Findings about the host's overall configuration.
      enum:
        - selinux-downgraded-at-runtime
        - no-mac-reported
        - clock-skew
        - security-relevant-taint
        - tmpfs-without-nosuid-nodev
        - mount-unreadable
      x-enumDescriptions:
        selinux-downgraded-at-runtime: SELinux was switched out of enforcing mode after boot, a common way to disable protection.
        no-mac-reported: Neither SELinux nor AppArmor is in use, so the host has no mandatory access control.
        clock-skew: The host clock is out of step, so timestamps from this host cannot be trusted.
        security-relevant-taint: A proprietary or force-loaded module has tainted the kernel.
        tmpfs-without-nosuid-nodev: A temporary filesystem allows privileged programs and device files.
        mount-unreadable: This mount could not be read, so its capacity is unknown rather than zero.
      x-enumSeverities:
        selinux-downgraded-at-runtime: 5
        no-mac-reported: 2
        clock-skew: 5
        security-relevant-taint: 5
        tmpfs-without-nosuid-nodev: 2
        mount-unreadable: 0
    PaginatedData:
      properties:
        data:
          type: object
        more_results:
          description: Indicates there are more pages of data for this query.
          type: boolean
      type: object
    ProcessLiveStateSignal:
      type: string
      title: ProcessLiveStateSignal
      description: Findings about what a running process is doing right now.
      enum:
        - listening-socket
        - established-connection
        - hidden-connection
        - pty-descriptor
        - daemonized
        - full-capabilities
        - rootless-full-capabilities
        - cgroup-unit
      x-enumDescriptions:
        listening-socket: The process is listening for incoming network connections.
        established-connection: The process has a live network connection to a remote host.
        hidden-connection: The process has a network connection that does not appear in the system's connection list.
        pty-descriptor: An interactive terminal is attached to the process.
        daemonized: The process detached itself to run as a background service.
        full-capabilities: The process holds every privilege, as any root process does.
        rootless-full-capabilities: A non-root process holds every privilege, giving it root's reach without being root.
        cgroup-unit: The systemd unit the process runs under.
      x-enumSeverities:
        listening-socket: 2
        established-connection: 2
        hidden-connection: 5
        pty-descriptor: 2
        daemonized: 0
        full-capabilities: 0
        rootless-full-capabilities: 5
        cgroup-unit: 0
    ProcessNetworkProtocol:
      type: string
      title: ProcessNetworkProtocol
      description: Network protocols a process can be using.
      enum:
        - tcp
        - tcp6
        - udp
        - udp6
        - icmp
        - icmp6
        - raw
        - raw6
        - sctp
      x-enumDescriptions:
        tcp: TCP over IPv4.
        tcp6: TCP over IPv6.
        udp: UDP over IPv4.
        udp6: UDP over IPv6.
        icmp: ICMP over IPv4.
        icmp6: ICMP over IPv6.
        raw: Raw IPv4 sockets, used to craft or capture network packets.
        raw6: Raw IPv6 sockets, used to craft or capture network packets.
        sctp: SCTP, a protocol used mainly in telecom networks.
      x-enumSeverities:
        tcp: 0
        tcp6: 0
        udp: 0
        udp6: 0
        icmp: 0
        icmp6: 0
        raw: 5
        raw6: 5
        sctp: 5
    ProcessSignal:
      type: string
      title: ProcessSignal
      description: Findings from a running process.
      enum:
        - hidden-socket
        - sniffer
        - ld-preload
        - ptraced
        - setuid-transition
        - hidden-descriptor
        - raw-packet-socket
        - packet-socket
        - fileless-descriptor
        - ebpf-descriptor
      x-enumDescriptions:
        hidden-socket: The process holds a network connection hidden from the system's connection list, a strong rootkit signal.
        sniffer: The process is capturing network traffic off the wire.
        ld-preload: A preloaded library can intercept everything the process does.
        ptraced: A debugger is attached to the process.
        setuid-transition: The process is running with different privileges than the user who started it.
        hidden-descriptor: The process holds an open file that is hidden from normal listings.
        raw-packet-socket: The process can capture all network traffic on the host.
        packet-socket: The process holds a socket capable of capturing network traffic.
        fileless-descriptor: The process is running from a deleted or in-memory file, leaving nothing on disk.
        ebpf-descriptor: The process holds an eBPF object. Common for security and monitoring tools.
      x-enumSeverities:
        hidden-socket: 5
        sniffer: 5
        ld-preload: 5
        ptraced: 2
        setuid-transition: 2
        hidden-descriptor: 5
        raw-packet-socket: 5
        packet-socket: 3
        fileless-descriptor: 5
        ebpf-descriptor: 0
    ProcessState:
      type: string
      title: ProcessState
      description: The state a process is in, as reported by the kernel.
      enum:
        - R
        - S
        - D
        - Z
        - T
        - t
        - X
        - x
        - I
        - K
        - W
        - P
      x-enum-varnames:
        - RUNNING
        - SLEEPING
        - DISK_SLEEP
        - ZOMBIE
        - STOPPED
        - TRACING_STOP
        - DEAD
        - DEAD_LOWER
        - IDLE
        - WAKEKILL
        - WAKING
        - PARKED
      x-enumDescriptions:
        R: Running or ready to run.
        S: Sleeping, and can be woken.
        D: Sleeping on disk or device activity, and cannot be interrupted.
        Z: Finished, but not yet cleaned up by its parent.
        T: Stopped by a signal.
        t: Stopped by a debugger.
        X: Dead.
        x: Dead.
        I: An idle kernel thread.
        K: Waiting, and can be woken by a kill.
        W: Waking or paging.
        P: A parked kernel thread.
    SandflyStatus:
      type: string
      enum:
        - ok
        - sandfly_inactive
        - missing_results
    Result:
      title: Result
      description: Data returned from a sandfly.
      type: object
      allOf:
        - $ref: "#/components/schemas/ResultCommon"
        - $ref: "#/components/schemas/ResultVariants"
    ResultDetail:
      title: ResultDetail
      description: Extended result view that includes the full result JSON along with mutable status data such as the response action log.
      type: object
      properties:
        id:
          description: ID of the result.
          type: integer
          format: uint64
        result:
          description: The full result JSON.
          $ref: "#/components/schemas/Result"
        response_action_log:
          description: Response actions that have been performed against the artifact this result is about, ordered by most recent first. This includes actions requested through the artifact's other results and on the artifact directly. Empty array if none.
          type: array
          items:
            $ref: "#/components/schemas/ResponseActionLogSummary"
      required:
        - sequence_id
        - result
        - response_action_log
    TriageState:
      description: |-
        Status of the AI triage analysis.
        - `none`: nothing has judged this subject and nothing is queued to. The state every host and artifact starts in.
        - `queued`: waiting for its first verdict; `queue_position` and `queue_length` say where.
        - `running`: its first verdict is being formed now.
        - `ready`: a verdict is available.
        - `error`: the attempt failed; see `error_message`.
        - `skipped`: deliberately not judged automatically, because the host is excluded by the configured host tags. `brief` says why. A host that had a verdict before it was excluded loses it when a scan next brings it up; a verdict an operator asked for is kept. An excluded host can still be triaged on request, and an artifact on one can still be classified, so this is a state automatic work leaves behind rather than one a request produces. See the `exclude_host_tags` setting.

        `queued` and `running` are only reported for a subject with no record. A subject that has one and is queued again keeps its stored state and reports `queue_position` and `queue_length` beside it.
      type: string
      enum:
        - none
        - queued
        - running
        - ready
        - error
        - skipped
    TriageVerdict:
      description: |-
        The model's judgement, from least to most alarming.
        - `clean`: nothing of concern. Also what a host with no alerting artifacts is recorded as, without a model being consulted.
        - `likely_false_positive`: the alerts fired on things that are legitimate on this host, and nothing needs to change.
        - `needs_attention`: a real weakness that should be fixed, such as a weak or default password on an account, with no sign that anyone has used it.
        - `suspicious`: warrants a look.
        - `likely_malicious`: the evidence points at an intrusion.
        - `likely_compromised`: the host should be treated as compromised.

        This is advisory. It never changes an artifact's alert status.
      type: string
      enum:
        - clean
        - likely_false_positive
        - needs_attention
        - suspicious
        - likely_malicious
        - likely_compromised
    TriageConfidence:
      description: How sure the model says it is. Reported with every verdict, because a low-confidence `clean` and a high-confidence one warrant different amounts of attention.
      type: string
      enum:
        - low
        - medium
        - high
    TriageFinding:
      description: The model's judgement on one group of related artifacts within a host verdict. Alerts that belong to one incident are grouped into one finding rather than reported separately.
      type: object
      required:
        - artifact_ids
        - assessment
        - confidence
      properties:
        artifact_ids:
          type: array
          description: The artifacts this finding is about.
          items:
            type: integer
            format: int64
        artifact_keys:
          type: array
          description: "The same artifacts by their cross-host identity. It is what lets a verdict be reused on another host: the ids above are specific to one host, these are not. Set by the server, not by the model."
          items:
            type: string
        assessment:
          type: string
          description: What these artifacts are, and why the model thinks so.
        confidence:
          $ref: "#/components/schemas/TriageConfidence"
        suggested_severity:
          description: The severity the model gave these artifacts, 0-5, which is applied to them on this host. Absent where it offered no opinion, in which case the artifacts keep the severity their sandflies give them; note that 0 is a real severity and does not mean "no opinion". A new verdict for the host takes back what the previous one set before applying its own. An artifact carrying a classification of its own is neither steered by a finding nor taken back.
          $ref: "#/components/schemas/SandflySeverity"
        reason:
          type: string
          description: Why that severity rather than the one the artifacts have.
        recommended_action:
          type: string
          description: What the operator should do about it.
    HostTriage:
      description: |-
        The cached AI triage verdict for one host.

        Verdicts are formed automatically after a scan materially changes what is known about a host, and can also be requested. A verdict sets the severity of the host and of the artifacts it judged on that host, which is what reorders an operator's queue; it never changes an artifact's alert status, and everything it sets is reversible per artifact or per host.

        A host arriving in the identical situation to one already judged -- the same set of alerting findings on the same distribution family, with the rarest of them in the same range of cross-host spread -- reuses that host's verdict rather than being submitted; see `alert_fingerprint`, `spread_bucket` and `reused_from_host`. A situation has one current answer: when a model forms a fresh verdict for it, every host holding an older verdict for that situation takes up the new one without a submission, so a verdict can change without the host having changed.
      type: object
      required:
        - host_sequence_id
        - state
        - stale
        - manual
        - brief
        - report
        - tags
        - skipped_scans
        - created_at
        - modified_at
      properties:
        host_sequence_id:
          type: integer
          description: The host this verdict is about.
        state:
          $ref: "#/components/schemas/TriageState"
        verdict:
          $ref: "#/components/schemas/TriageVerdict"
        confidence:
          $ref: "#/components/schemas/TriageConfidence"
        severity:
          type: integer
          description: |-
            The model's rating for the host as a whole, 0-5, where 0 is no risk and 5 is near-certain compromise.

            Absent when no verdict has set one, which is not the same as 0: absent means "not judged", and a client that ranks hosts should fall back to its own ranking for those rather than treating them as clean.
          minimum: 0
          maximum: 5
        severity_withdrawn:
          type: boolean
          description: "Whether an operator has reverted the AI severities on this host, or on one of its artifacts, since this verdict was formed. `severity` is still what the model said, but the host's own severity no longer uses it: the host reports the severity of what is alerting until a new verdict is formed, which clears this. Absent when false."
        stale:
          type: boolean
          description: "Whether what is alerting on the host has changed since this verdict was formed, with no fresh verdict yet: an alert appeared, or one was whitelisted, deleted or resolved, and the model has not looked again. The verdict is still the last opinion formed and is reported as such; this says its words describe the host as it was. The host's own severity stops using the verdict's rating at the same moment, for the same reason, and the host list carries the same flag as `triage_stale`. Always present; false for a record with no verdict and for the `queued` and `none` shapes. Not set by an operator's revert, which `severity_withdrawn` reports."
        brief:
          type: string
          description: One sentence, for a list. Also carries the reason when `state` is `skipped`.
        report:
          type: string
          description: The written assessment, in Markdown.
        tags:
          type: array
          description: Short labels for what kind of thing this is, e.g. `cryptominer`, `persistence`, `package-manager`.
          items:
            type: string
        findings:
          type: array
          description: Per-incident judgements. Absent where the model grouped nothing.
          items:
            $ref: "#/components/schemas/TriageFinding"
        model:
          type: string
          description: |-
            The model that produced the verdict.

            Absent for a synthesized verdict: a host with no alerting artifacts is recorded as `clean` without a model being consulted, and the absence is how that is told apart from a model that looked and agreed.
        manual:
          type: boolean
          description: |-
            Whether an operator asked for this verdict rather than a scan producing it. Always present.

            It matters on a host that `exclude_host_tags` keeps out of automatic triage: such a host can still be triaged on request, and the verdict that comes back is left in place afterwards, where a verdict formed before the host was excluded is taken back the next time the host comes up. A verdict borrowed from another host is not the borrower's own request, so it reads false there whatever it read on the host it came from.
        payload_bytes:
          type: integer
          description: The size of the document the model was given, in bytes. It can exceed the configured budget when the few worst alerts carry very large forensic payloads; see `max_payload_kb`.
        truncated:
          type: boolean
          description: "Whether the document was abridged to fit its size budget: alerts left out, alerts reduced to a summary line, or host context shortened. A truncated document always tells the model what it is not being shown."
        error_message:
          type: string
          description: Why the attempt failed, when `state` is `error`.
        scan_run_id:
          type: string
          description: The run id of the scan that queued the host for this verdict. Absent for a verdict requested by hand.
        skipped_scans:
          type: integer
          description: |-
            How many chances to re-judge this host have been declined since this verdict was formed.

            A host scanned every hour whose verdict is a week old should show a large number here: it means the gates that keep the feature affordable are working. Reset to 0 whenever a verdict is written.

            Use it with `last_checked_at`, which moves on every declined chance, and `last_analyzed_at`, which moves only when a model was actually asked.
        last_skip_reason:
          type: string
          description: |-
            Why the most recent chance was declined. Absent when no chance has been declined since the verdict was written.

            A host declined for `minimum interval not elapsed` or `daily limit reached` stays queued and is judged when the interval is up or the next UTC day begins, so the change that queued it is not lost. Both hold automatic work only; a request is judged when it reaches the front of the queue.

            Also reported on the `queued` shape of a host with no record whose first verdict is being held, for the same reasons, so a host that is queued but not moving can say why.
          enum:
            - no material change
            - payload unchanged
            - minimum interval not elapsed
            - daily limit reached
            - excluded by host tag
        alert_fingerprint:
          type: string
          description: |-
            Identifies the situation this verdict answers for: a digest of the set of alerting findings plus the distribution family. Two hosts sharing it have the identical executables alerting in the identical places for the identical reasons, on the same kind of platform, so the second reuses this verdict rather than being judged again.

            The family is the distribution without its version, so Debian 12 and Debian 13 are one platform while Debian and Red Hat are two. What it separates is the cases where the same finding warrants different advice because packaging and ownership conventions differ, and those follow the distribution rather than its point release.

            Absent for a host that cannot be fingerprinted -- one with an alerting artifact that has no cross-host identity, or with more alerts than the ranking pass reads. Such hosts are always judged on their own and never share.
        reused_from_host:
          type: integer
          description: |-
            The host this verdict was originally formed on, when a model was not asked about this one. Absent for a verdict produced for this host.

            The verdict is otherwise the same in every respect, except that its findings name this host's artifacts rather than the original host's, and the severities those findings carry have been applied to this host's artifacts. It always points at wherever a model actually looked, even when the verdict has been passed along several hosts.

            A borrowed verdict is not final. When a model forms a fresh verdict for the same situation -- a host arriving in a higher spread range, an operator re-judging a host by hand, a changed document -- every host holding an older verdict for that situation takes up the new one, without a submission, and this field then names the host the new verdict was formed on.
        formed_at:
          type: string
          format: date-time
          description: When a model produced this verdict, on whichever host it was produced. It travels unchanged when the verdict is reused on another host, where `last_analyzed_at` is when this host got its answer, so the two differ on a borrowed verdict. It is what decides whether another host's verdict for the same situation is newer than the one this host holds. Absent for a synthesized verdict.
        spread_bucket:
          type: integer
          description: "How widespread the rarest alerting artifact was when the verdict was formed, as the lower bound of a coarse range of hosts: 1, 2, 10 or 100. Hosts share a verdict only within a range, because how widespread an artifact is across hosts is the strongest false-positive signal the model reads: a verdict formed when a rollout had reached three hosts is not the verdict for the same rollout at three hundred. The first host to arrive in a higher range is judged afresh, and its verdict then replaces the earlier one on every host in the situation. Absent where no alerting artifact had a host count."
          enum:
            - 1
            - 2
            - 10
            - 100
        last_checked_at:
          type: string
          description: When the host's evidence was last assembled and compared. This moves even when nothing was submitted, because an unchanged host is not re-judged.
          format: date-time
        last_analyzed_at:
          type: string
          description: When a model was last actually asked. The gap between this and `last_checked_at` is what the unchanged-input check saved.
          format: date-time
        created_at:
          type: string
          format: date-time
          description: When the record was created. With `state` `none` there is no record, and this is the zero time, `0001-01-01T00:00:00Z`.
        modified_at:
          type: string
          format: date-time
          description: When the record was last written. With `state` `none` there is no record, and this is the zero time, `0001-01-01T00:00:00Z`.
        queue_position:
          type: integer
          description: Position in the triage queue, 1 being next. Present whenever the subject is on the triage queue, whatever `state` is. With `state` `queued` or `running` the subject has no record yet and its first verdict is on its way; with any other state a re-run is pending, and the record shown is the current one until it lands. Items held by a retry backoff, the minimum interval or the daily limit -- all of which hold automatic work only -- are not counted ahead of any item that can start now, because they will not be taken before their time; they take the positions after every such item, the one whose hold ends soonest first, so no two items share a position.
        queue_length:
          type: integer
          description: How many subjects are in the triage queue. Present whenever the subject is on the triage queue, whatever `state` is. Automatic work left waiting while automatic submission is off is counted.
    ArtifactTriage:
      description: |-
        What AI triage has concluded about this artifact, on the host it was found on.

        Two shapes of record come back here. A record that fell out of the **host** verdict carries `confidence`, `brief` (the finding's assessment), `suggested_severity` and `reason`, with `verdict` absent and `report` and `tags` present but empty: a host verdict rates each of its findings without giving each one its own five-way judgement. Classifying the artifact directly, on request, fills all three. A client should therefore render from `brief` and treat `verdict` as optional, since the host-verdict shape is by far the more common one.

        Where an artifact has been classified directly, that is what it keeps: a later host verdict neither overwrites the record nor re-rates the artifact, because the classification is the more specific judgement and the one somebody asked for.

        Nothing is carried between artifacts. The same finding on another host is judged when that host is, or when it reuses this host's whole verdict because it is in the identical situation. The record lives exactly as long as the artifact it is about.
      type: object
      required:
        - artifact_id
        - state
        - brief
        - report
        - tags
        - created_at
        - modified_at
      properties:
        artifact_id:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/TriageState"
        verdict:
          $ref: "#/components/schemas/TriageVerdict"
        confidence:
          $ref: "#/components/schemas/TriageConfidence"
        brief:
          type: string
          description: One sentence, for a list.
        report:
          type: string
          description: The written assessment, in Markdown.
        tags:
          type: array
          description: Short labels for what kind of thing this is.
          items:
            type: string
        suggested_severity:
          type: integer
          description: "The severity the model gave this artifact, 0-5, which is also what the artifact now reports unless `severity_withdrawn` is set. Absent where the model offered no opinion, in which case the artifact reports the severity its sandflies give it: a classification that rates the artifact applies its severity, and one that does not takes any earlier AI severity off, so an absent `suggested_severity` always means no AI severity is in force. A present one is in force unless `severity_withdrawn` says an operator took it back."
          minimum: 0
          maximum: 5
        severity_withdrawn:
          type: boolean
          description: Whether an operator has reverted the AI severity off this artifact, alone or with the rest of its host's, since this record was written. `suggested_severity` is still what the model said, and may be shown as such, but the artifact reports what its sandflies rate it. Cleared when a new finding or classification rates the artifact. Absent when false.
        last_skip_reason:
          type: string
          description: Reported on the `queued` shape of an artifact with no record whose classification is being held, so a panel can say why the request is not moving. An artifact classification is only ever requested, and neither the daily limit nor the host tag exclusion holds a request, so in practice nothing holds one and this is absent.
          enum:
            - daily limit reached
        reason:
          type: string
          description: Why that severity rather than the one the artifact has.
        model:
          type: string
          description: The model that produced the classification.
        error_message:
          type: string
          description: Why the attempt failed, when `state` is `error`.
        last_analyzed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          description: When the record was created. With `state` `none` there is no record, and this is the zero time, `0001-01-01T00:00:00Z`.
        modified_at:
          type: string
          format: date-time
          description: When the record was last written. With `state` `none` there is no record, and this is the zero time, `0001-01-01T00:00:00Z`.
        queue_position:
          type: integer
          description: Position in the triage queue, 1 being next. Present whenever the subject is on the triage queue, whatever `state` is. With `state` `queued` or `running` the subject has no record yet and its first verdict is on its way; with any other state a re-run is pending, and the record shown is the current one until it lands. Items held by a retry backoff, the minimum interval or the daily limit -- all of which hold automatic work only -- are not counted ahead of any item that can start now, because they will not be taken before their time; they take the positions after every such item, the one whose hold ends soonest first, so no two items share a position.
        queue_length:
          type: integer
          description: How many subjects are in the triage queue. Present whenever the subject is on the triage queue, whatever `state` is. Automatic work left waiting while automatic submission is off is counted.
    TriageBulkRequest:
      description: The hosts to queue for AI triage.
      type: object
      required:
        - host_sequence_ids
      properties:
        host_sequence_ids:
          type: array
          description: The hosts to triage.
          items:
            type: integer
    TriageQueued:
      description: What a triage request queued.
      type: object
      required:
        - queued
        - queue_length
      properties:
        queued:
          type: integer
          description: "How many subjects were queued. May be lower than the number asked for: hosts that do not exist are left out rather than failing the request, and a host named more than once counts once."
        queue_length:
          type: integer
          description: How many subjects are in the triage queue after this request, so a caller can show progress without a second request.
    TriageDocument:
      description: An AI triage submission for a host, built but not sent.
      type: object
      required:
        - host_sequence_id
        - system_instruction
        - document
        - prompt
        - document_bytes
        - max_payload_kb
        - truncated
        - alerting_artifacts
      properties:
        host_sequence_id:
          type: integer
          description: Host the submission describes.
        system_instruction:
          type: string
          description: The system instruction, sent first.
        document:
          type: object
          description: The JSON document describing the host, sent second. Its structure is internal to AI triage and may change between releases.
        prompt:
          type: string
          description: The question asked about the document, sent last.
        document_bytes:
          type: integer
          description: Size of the document as sent, in bytes.
        max_payload_kb:
          type: integer
          description: Size budget the document was built to, in KB.
        truncated:
          type: boolean
          description: Whether the document had to leave out alerts, alert detail or host context to fit the budget.
        alerting_artifacts:
          type: integer
          description: How many alerting artifacts the host has. Zero means triage would record the host as clean without submitting it.
    TriageReverted:
      description: How many artifacts had their AI severity removed.
      type: object
      required:
        - reverted
      properties:
        reverted:
          type: integer
          description: How many of the host's artifacts had an AI severity to remove. Zero where none was steered; the host's own AI rating is withdrawn either way.
    TriageQueue:
      description: One page of the AI triage queue, in the order it is worked.
      allOf:
        - $ref: "#/components/schemas/ScrollingResponse"
      type: object
      required:
        - data
        - queue_length
        - available
        - automatic
        - paused_until
      properties:
        data:
          type: array
          description: The items on this page.
          items:
            $ref: "#/components/schemas/TriageQueueEntry"
        queue_length:
          type: integer
          description: How many items are on the queue, on every page. Held items are counted.
        available:
          type: boolean
          description: Whether there is an AI configuration to run queued work on. AI triage's own configuration counts, and so does AI analysis's, which runs requests made by hand when AI triage is not configured. While this is false, nothing on the queue runs.
        automatic:
          type: boolean
          description: Whether automatic work is being taken off the queue. While this is false, items that are neither requests made by hand nor `refresh` items wait for automatic triage to be switched back on.
        paused_until:
          type: string
          format: date-time
          nullable: true
          description: When the queue is worked again after the AI provider refused a submission for exceeding its rate limit, or null when it is not paused. No item is started before then, whatever its own state.
    TriageQueueEntry:
      description: One item on the AI triage queue.
      type: object
      required:
        - id
        - kind
        - host_sequence_id
        - hostname
        - artifact_id
        - position
        - state
        - held_until
        - manual
        - refresh
        - attempts
        - last_error
        - run_again
        - removed
        - requested_by
        - requested_by_name
        - scan_run_id
        - enqueued_at
        - claimed_at
      properties:
        id:
          type: integer
          format: int64
          description: The queue item's ID, for removing it or running it now. An item keeps its ID while it is retried, held or run again, and a host or artifact queued again after its item has left the queue gets a new one.
        kind:
          type: string
          enum:
            - host
            - artifact
          description: Whether the item is a host triage or an artifact classification.
        host_sequence_id:
          type: integer
          description: "The host the item is about: the host being triaged, or the host the artifact belongs to."
        hostname:
          type: string
          description: The host's name.
        artifact_id:
          type: integer
          format: int64
          nullable: true
          description: The artifact being classified, or null for a host triage.
        position:
          type: integer
          description: The item's place on the queue, as `getHostTriage` and `getArtifactTriage` report it, where 1 is next. No two items share a position. Items that are running or can start now come first, in the order they are worked; held items follow them, the one whose hold ends soonest first.
        state:
          $ref: "#/components/schemas/HostTriageQueueState"
        held_until:
          type: string
          format: date-time
          nullable: true
          description: When a held item can next be started, or null for an item that is not held.
        manual:
          type: boolean
          description: Whether the item is a request made by hand. Requests are worked first, and the automatic checks -- the minimum interval, the daily limit, the host tag exclusion, the reuse of another host's verdict and the unchanged-input check -- do not apply to them. Artifact classifications are always requests.
        refresh:
          type: boolean
          description: Whether the item only takes up a newer verdict formed for another host in the same situation. It never sends anything to the AI provider.
        attempts:
          type: integer
          description: How many times the item has been started since its attempt count last started again. A request made by hand starts it again; a hold that is not a failure does not count.
        last_error:
          type: string
          description: The error the item's most recent failed submission returned, including a rate-limit refusal, or an empty string. It is kept while the item is retried or held, and cleared when its attempt count starts again. A failure that ends the item's attempts is recorded on the host's or artifact's triage instead, and the item leaves the queue.
        run_again:
          type: boolean
          description: Whether a running item was asked for again while it ran, by a scan that changed the host or by a request, and will go back on the queue when it finishes. A request made while it ran makes the re-run a request made by hand.
        removed:
          type: boolean
          description: Whether a running item has been removed from the queue. It finishes the run in progress and then leaves the queue, without being retried, held or run again.
        requested_by:
          type: string
          description: The username of the user who asked for the item, or an empty string for automatic work.
        requested_by_name:
          type: string
          description: The full name of the user who asked for the item. This is their username when they have no full name or the user no longer exists, and an empty string for automatic work.
        scan_run_id:
          type: string
          description: The scan that queued a host triage, or an empty string for an item no scan queued.
        enqueued_at:
          type: string
          format: date-time
          description: When the item was queued.
        claimed_at:
          type: string
          format: date-time
          nullable: true
          description: When the running item was submitted to the LLM API, or null for an item that is not running.
    TriageQueueRemoveRequest:
      description: The AI triage queue items to remove.
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The queue items' IDs.
          items:
            type: integer
            format: int64
    TriageQueueRemoved:
      description: What a removal took off the AI triage queue.
      type: object
      required:
        - removed
        - running
      properties:
        removed:
          type: integer
          description: How many items were taken off the queue, including those still running.
        running:
          type: integer
          description: How many of the removed items are running. They finish the run in progress, and stay on the queue with `removed` set until they do.
    ArtifactBase:
      title: ArtifactBase
      description: "One scanned artifact (process, file, user, ...) and its rolled-up state, without the sandflies that matched it: the artifact list describes those as a summary (Artifact) and the artifact detail as full per-sandfly results (ArtifactDetail). The artifact's status is the worst status among its non-superseded sandfly results."
      type: object
      required:
        - id
        - external_id
        - host_id
        - hostname
        - node_name
        - host_sequence_id
        - host_tags
        - engine
        - key_type
        - key_data
        - base_permissive_hash
        - base_moderate_hash
        - base_strict_hash
        - status
        - superseded
        - severity
        - containerized
        - first_seen
        - last_seen
        - last_run_id
        - revision
      properties:
        id:
          type: integer
          format: int64
          description: Artifact ID.
        external_id:
          type: string
        host_id:
          type: string
        hostname:
          type: string
        node_name:
          type: string
        host_sequence_id:
          type: integer
        host_tags:
          type: array
          items:
            type: string
        engine:
          $ref: "#/components/schemas/SandflyEngineType"
        key_type:
          $ref: "#/components/schemas/ArtifactKeyType"
        key_data:
          type: string
          description: The most recognizable piece of artifact data (process name, file path, username, ...). For an error artifact with no other data, the start of its error message, cut at 128 characters.
        base_permissive_hash:
          type: string
          description: The artifact's permissive identity hash, as computed by the engine before any sandfly's match hash supplement was folded in. Two hosts carrying the same artifact report the same value, so an exact filter on base_permissive_hash allows cross-host searches. Omitted for an artifact with no hash identity (an operating system, an error, anything keyed only by its key_data).
        base_moderate_hash:
          type: string
          description: The artifact's moderate identity hash, on the same terms as base_permissive_hash, and filterable in the same way.
        host_counts:
          allOf:
            - $ref: "#/components/schemas/ArtifactHostCounts"
          description: How common the artifact is across hosts. Always present on the artifact detail (GET /artifacts/{artifact_id}) and on the host rollup's alerting_artifacts entries; on a POST /artifacts entry only when the search set `host_counts`. Omitted in every case for an artifact with no permissive or moderate hash, which has nothing to be counted across hosts by.
        base_strict_hash:
          type: string
          description: "The artifact's strict identity hash. Reported for completeness but not a filter field: it has no index, and for a hash-keyed artifact it is the artifact key. A strict hash also includes host-varying detail, so it rarely matches across hosts. Use the permissive or moderate hash for that."
        hash_version:
          type: integer
          description: The scheme the three hashes above were computed under. Reported with them because a hash means nothing without knowing what went into it, and because two artifacts are only the same thing if their hashes agree and were computed the same way. Omitted alongside the hashes for an artifact that has none.
        status:
          $ref: "#/components/schemas/ResultStatus"
        superseded:
          type: boolean
          description: True when every sandfly result on this artifact has been superseded.
        severity:
          type: integer
          description: |-
            The artifact's severity: normally the highest among the non-superseded alerting sandflies, and whatever AI triage rated it once a verdict has judged it. This is what the artifact list sorts on and what the `severity` filter field compares against.

            An artifact in error -- one or more sandflies on it in error and none alerting -- is always severity 2, whatever its sandflies are configured at, so that a host that could not be fully scanned never reads as clean. A passing artifact -- every sandfly on it passing, or its alerts whitelisted -- is 0, whatever its sandflies are configured at and whatever AI triage rated it while it was alerting.
        containerized:
          type: boolean
        threat_score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: "Machine learning threat score (0-100) of the artifact's binary, taken from the binary analysis in its result data: a file artifact's own ELF, the executable behind a process artifact, or the ExecStart program of a systemd unit. Higher is more likely to be malicious. `null` for every artifact the score does not apply to."
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_run_id:
          type: string
        revision:
          type: integer
          description: Monotonically increasing change marker; advances on any material change to the artifact or its sandfly results.
    ArtifactKeyType:
      type: string
      enum:
        - hash
        - os
        - error
        - key_data
      description: How the artifact's identity key was derived.
    Artifact:
      type: object
      required:
        - sandflies
      title: Artifact
      description: One scanned artifact with a summary of the sandflies that currently match it. This is the artifact as the artifact list and the host rollup report it; the artifact detail reports the same sandflies in full as sandfly_results.
      allOf:
        - $ref: "#/components/schemas/ArtifactBase"
      properties:
        sandflies:
          type: array
          description: The sandflies that currently match this artifact (those with a non-superseded result on it) ordered worst result first (alert, then error, then pass) and alphabetically within each group, so the sandfly the artifact is being reported for comes first.
          items:
            $ref: "#/components/schemas/ArtifactSandfly"
        triage:
          allOf:
            - $ref: "#/components/schemas/ArtifactTriageSummary"
          description: What AI triage has concluded about this artifact. Omitted for an artifact with no triage record.
    ArtifactTriageSummary:
      title: ArtifactTriageSummary
      description: |-
        An artifact's AI triage record as the artifact list summarises it. The full record, with the written report, is returned by GET /artifacts/{artifact_id}/triage.

        As with ArtifactTriage, a record that came from a **host** verdict carries `confidence` and `brief` but no `verdict`; only classifying the artifact directly gives it a verdict of its own. Render from `brief` and treat `verdict` as optional.
      type: object
      required:
        - state
        - brief
      properties:
        state:
          $ref: "#/components/schemas/TriageState"
        verdict:
          $ref: "#/components/schemas/TriageVerdict"
        confidence:
          $ref: "#/components/schemas/TriageConfidence"
        brief:
          type: string
          description: One sentence, for a list.
        suggested_severity:
          type: integer
          description: The severity the model gave this artifact, 0-5, on the same terms as ArtifactTriage's `suggested_severity`.
          minimum: 0
          maximum: 5
        severity_withdrawn:
          type: boolean
          description: Whether an operator has reverted the AI severity off this artifact. Absent when false.
        last_analyzed_at:
          type: string
          format: date-time
    ArtifactSandfly:
      title: ArtifactSandfly
      description: One sandfly that currently matches an artifact, summarised for a list. The artifact detail reports these same sandflies as ArtifactSandflyResult, with the whole result rather than a summary of it; the fields the two have in common are named the same way in both.
      type: object
      required:
        - sandfly
        - type
        - status
        - severity
        - drift_result
        - tags
      properties:
        sandfly:
          type: string
          description: Name of the sandfly.
        type:
          allOf:
            - $ref: "#/components/schemas/SandflyType"
          description: What kind of sandfly matched. The artifact list can be filtered by it (the sandfly_type field), so a list can show what it was filtered by.
        status:
          allOf:
            - $ref: "#/components/schemas/ResultStatus"
          description: "This sandfly's result on the artifact, which is what the summary is ordered by. It is not always the artifact's own status: the artifact reports the worst result against it, so a passing sandfly appears in the summary of an alerting artifact."
        severity:
          type: integer
          description: The sandfly's own severity. It is not always the artifact's severity, which is the highest severity among the sandflies alerting on it.
        drift_result:
          type: boolean
          description: "True when this sandfly alerted because the artifact is absent from the result profiles assigned to the host, rather than because the sandfly matched something it looks for. It describes this sandfly's result, not the artifact: one sandfly can be reporting drift on an artifact another alerted on outright."
        tags:
          $ref: "#/components/schemas/SandflyTags"
    ArtifactSandflyResult:
      title: ArtifactSandflyResult
      description: One sandfly's result on an artifact. The id is the same public result ID used by the backward-compatibility /results endpoints.
      type: object
      properties:
        id:
          type: string
        sandfly:
          type: string
        type:
          $ref: "#/components/schemas/SandflyType"
        severity:
          $ref: "#/components/schemas/SandflySeverity"
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ResultStatus"
        status_msg:
          type: string
        explanation:
          type: string
          description: This sandfly's explanation of its match on the artifact.
        whitelisted:
          type: boolean
        drift_result:
          type: boolean
        superseded:
          type: boolean
        seen_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_run_id:
          type: string
    ArtifactDetail:
      title: ArtifactDetail
      description: "Full artifact view: the artifact, the shared artifact data payload, and every per-sandfly result. It carries no sandflies summary: sandfly_results already names every one of those sandflies and reports far more about each."
      allOf:
        - $ref: "#/components/schemas/ArtifactBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/ArtifactData"
              description: "The shared artifact data payload (same shape as data.results on a /results entry), minus the per-sandfly fields explanation, whitelisted, and drift_result: those describe one sandfly's verdict rather than the artifact, and each entry in sandfly_results carries its own."
            sandfly_results:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactSandflyResult"
    ArtifactDetailResponse:
      title: ArtifactDetailResponse
      description: "The GET /artifacts/{id} response: the full artifact view plus the response actions taken against the artifact and the AI analyses of it."
      allOf:
        - $ref: "#/components/schemas/ArtifactDetail"
        - type: object
          properties:
            response_action_log:
              description: Response actions that have been performed against this artifact, whether requested on the artifact directly or through one of its results, ordered by most recent first. Empty array if none.
              type: array
              items:
                $ref: "#/components/schemas/ResponseActionLogSummary"
            llm_analyses:
              description: AI analyses of this artifact, whether requested on the artifact directly or through one of its results, ordered by most recently modified first. Empty array if none.
              type: array
              items:
                $ref: "#/components/schemas/LlmAnalysisSummary"
          required:
            - response_action_log
            - llm_analyses
    ArtifactData:
      title: ArtifactData
      description: "The shared artifact data payload: the engine's scan of the artifact (one of the engine response shapes, keyed by artifact kind) plus the members common to every payload. This is the same JSON stored on the artifact's results, so its fields match the data.results fields on POST /results, minus the per-sandfly explanation."
      allOf:
        - $ref: "#/components/schemas/ArtifactDataCommon"
        - $ref: "#/components/schemas/ArtifactDataVariants"
    ArtifactDataCommon:
      title: ArtifactDataCommon
      description: The members present on every artifact data payload regardless of engine.
      type: object
      required:
        - containerized
        - match_hashes
      properties:
        containerized:
          type: boolean
          description: True when the scanned artifact resides inside a container.
        response:
          type: object
          description: Response actions taken against the detected artifact. Only present when a response was attempted.
          properties:
            process:
              type: object
              description: Response taken against a detected process.
              required:
                - killed
                - suspended
                - error
              properties:
                killed:
                  type: boolean
                  description: Whether the PID was killed.
                suspended:
                  type: boolean
                  description: Whether the PID was suspended.
                error:
                  type: boolean
                  description: True if an error happened during the response.
        match_hashes:
          type: object
          properties:
            version:
              type: integer
            strict:
              type: string
            moderate:
              type: string
            permissive:
              type: string
    ArtifactDataVariants:
      description: The engine-specific portion of an artifact data payload, one shape per engine family. The shapes are the same engine responses the /results variants wrap; which one applies follows from the artifact's engine.
      anyOf:
        - $ref: "#/components/schemas/AtJobEngineResponse"
        - $ref: "#/components/schemas/CloakedDirentryEngineResponse"
        - $ref: "#/components/schemas/CronEngineResponse"
        - $ref: "#/components/schemas/DirEngineResponse"
        - $ref: "#/components/schemas/ErrorEngineResponse"
        - $ref: "#/components/schemas/FileEngineResponse"
        - $ref: "#/components/schemas/KmodulesEngineResponse"
        - $ref: "#/components/schemas/LastlogEngineResponse"
        - $ref: "#/components/schemas/Os"
        - $ref: "#/components/schemas/ProcessEngineResponse"
        - $ref: "#/components/schemas/SystemdSessionEngineResponse"
        - $ref: "#/components/schemas/SystemdEngineResponse"
        - $ref: "#/components/schemas/UserEngineEngineResponse"
        - type: object
          required:
            - log
          description: "A login accounting artifact: one utmp, wtmp, or btmp record."
          properties:
            log:
              type: object
              properties:
                utmp:
                  $ref: "#/components/schemas/UtmpEngineResponse"
                wtmp:
                  $ref: "#/components/schemas/UtmpEngineResponse"
                btmp:
                  $ref: "#/components/schemas/UtmpEngineResponse"
    ArtifactHostCounts:
      title: ArtifactHostCounts
      description: How many hosts have this same artifact, counted by each of the artifact's two match hashes, with the alerting subset of each. On the artifact detail the counts are exact. In an artifact search, and in the host rollup's alerting artifact list, they are capped per hash.
      type: object
      required:
        - permissive
        - moderate
        - alert_permissive
        - alert_moderate
      properties:
        permissive:
          type: integer
          description: Hosts carrying an artifact with this artifact's base permissive hash, whatever its status there.
        moderate:
          type: integer
          description: Hosts carrying an artifact with this artifact's base moderate hash, whatever its status there.
        alert_permissive:
          type: integer
          description: The subset of `permissive` matches where that artifact's status is alert.
        alert_moderate:
          type: integer
          description: The subset of `moderate` matches where that artifact's status is alert.
        permissive_capped:
          type: boolean
          description: The permissive count stopped at the search's per-hash scan cap, so the artifact is on **at least** `permissive` hosts. Absent (false) when the count is exact, which it always is on the artifact detail. Alerting hosts are counted first, so `alert_permissive` stays exact until the alerting hosts alone exceed the cap.
        moderate_capped:
          type: boolean
          description: The same for the moderate count and `alert_moderate`.
    ArtifactSearchFilterItemField:
      description: |-
        The artifact field to filter on. This is a fixed set (see `enum`); filtering on any other field is rejected.
        - `sandfly`, `sandfly_type` and `sandfly_tags` are **membership tests** against the artifact's non-superseded per-sandfly results: they match an artifact when ANY of its matching sandflies satisfies the comparison, and a negated operator (`notEquals`, `notContains`, ...) means NO matching sandfly does. They cannot be used in `sort`.
        - An exact `host_id` match is resolved to `host_sequence_id` internally, so filtering on either performs the same.
        - `base_permissive_hash` and `base_moderate_hash` are the artifact's own identity hashes, taken before any per-sandfly supplement, so an exact match on one finds the same artifact on every other host that has it. They are NOT the same values as the result endpoint's `match_hashes.*`, which are the supplemented per-sandfly hashes. The third base hash, `base_strict_hash`, is reported but not filterable: it has no index, and for a hash-keyed artifact it holds the same value as the artifact key.
        - The `data.results...` fields search the stored result JSON, and are the same fields, with the same names and operators, that POST /results accepts; see GET /results/indexes for their build state. The JSON payload belongs to the artifact, so these mean the same thing on either endpoint.
        - **Result JSON date fields** (`data.results.file.date.modified`, `data.results.file.date.created`) are stored as RFC3339 UTC strings and support range/date operators (see `operator`).
        - `threat_score` is the artifact's machine learning threat score, and is the one filter field that can be null: use `isEmpty` / `isNotEmpty` to select artifacts with no score. As in SQL, a null score satisfies no comparison, so `threat_score != 0` does NOT return the artifacts that have no score. Sorting by it puts the unscored artifacts last in both directions.
      type: string
      enum:
        - id
        - external_id
        - revision
        - host_id
        - host_sequence_id
        - hostname
        - node_name
        - ip_addr
        - queue_name
        - host_tags
        - run_id
        - manual_scan
        - engine
        - key_type
        - key_data
        - base_permissive_hash
        - base_moderate_hash
        - status
        - superseded
        - containerized
        - severity
        - threat_score
        - first_seen
        - last_seen
        - created_at
        - sandfly
        - sandfly_type
        - sandfly_tags
        - data.results.process.hash.md5
        - data.results.process.hash.sha1
        - data.results.process.hash.sha256
        - data.results.process.hash.sha512
        - data.results.process.name
        - data.results.process.path
        - data.results.process.true_path
        - data.results.process.cwd
        - data.results.process.username
        - data.results.process.uid
        - data.results.process.gid
        - data.results.process.pid
        - data.results.process.ppid
        - data.results.process.parent_process.name
        - data.results.process.parent_process.path
