          description: JWT ID.
          type: string
        nbf:
          description: Not before time of the token.
          format: int64
          type: integer
        sub:
          description: Subject of the token.
          type: string
        type:
          description: Type of the token.
          type: string
      type: object
    KernelModuleSignal:
      type: string
      title: KernelModuleSignal
      description: Findings from a loaded kernel module.
      enum:
        - hidden-module
        - vmalloc-inference
        - no-file-on-disk
        - taint-bit-missing
        - mid-transition
        - unknown-taint
      x-enumDescriptions:
        hidden-module: The module is loaded but hides itself from the system's module list, the defining behavior of a kernel rootkit.
        vmalloc-inference: A possible module seen only indirectly in kernel memory. Weaker evidence than a hidden module.
        no-file-on-disk: The module is loaded but no file for it exists on disk.
        taint-bit-missing: The kernel is not recording this module the way it should, which can mean the kernel itself was altered.
        mid-transition: The module was loading or unloading during the scan.
        unknown-taint: The module carries an unrecognized kernel taint flag.
      x-enumSeverities:
        hidden-module: 5
        vmalloc-inference: 2
        no-file-on-disk: 5
        taint-bit-missing: 5
        mid-transition: 2
        unknown-taint: 5
    License:
