    AnomalyTag:
      type: string
      title: AnomalyTag
      description: Binary anomalies and features.
      enum:
        - appended-data
        - no-build-id
        - no-compiler-info
        - no-section-headers
        - entry-point-outside-text
        - no-interpreter
        - no-nx
        - no-relro
        - no-symbols
        - packed
        - packed-upx
        - packed-vmprotect
        - packed-themida
        - packed-petite
        - packed-aspack
        - packed-nsp
        - packed-mpress
        - packed-perplex
        - packed-unknown
        - oversized-section
        - encrypted-section
        - encrypted-overlay
        - section-headers-removed
        - high-entropy
        - writable-executable-segment
        - corrupted-headers
      x-enumDescriptions:
        appended-data: Extra data is attached past the end of the program itself.
        no-build-id: No build identifier is present.
        no-compiler-info: No compiler version string is present.
        no-section-headers: The file has no sections at all.
        entry-point-outside-text: Execution begins outside the normal code section.
        no-interpreter: A dynamically linked program that names no loader.
        no-nx: The stack is executable.
        no-relro: No RELRO protection.
        no-symbols: The file contains no symbols at all.
        packed: Compressed or packed, hiding the program's contents from inspection.
        packed-upx: Packed with UPX, hiding the program's contents from inspection.
        packed-vmprotect: Packed with VMProtect, hiding the program's contents from inspection.
        packed-themida: Packed with Themida, hiding the program's contents from inspection.
        packed-petite: Packed with Petite, hiding the program's contents from inspection.
        packed-aspack: Packed with ASPack, hiding the program's contents from inspection.
        packed-nsp: Packed with NsPack, hiding the program's contents from inspection.
        packed-mpress: Packed with MPRESS, hiding the program's contents from inspection.
        packed-perplex: Packed with PerpleX, hiding the program's contents from inspection.
        packed-unknown: Packed with an unrecognized or custom packer, hiding the program's contents from inspection.
        oversized-section: Contains an unusually large block of embedded data.
        encrypted-section: A large section whose contents look encrypted or compressed, hiding the program's contents from inspection.
        encrypted-overlay: Carries an encrypted or compressed payload appended to the file, hiding the program's contents from inspection.
        section-headers-removed: The section table has been stripped, leaving the code readable but removing the map to it.
        high-entropy: The file is compressed, encrypted or packed, hiding the program's contents from inspection.
        writable-executable-segment: Memory that is both writable and executable, so the program can rewrite its own code.
        corrupted-headers: The file's internal structure is damaged or deliberately malformed.
      x-enumSeverities:
