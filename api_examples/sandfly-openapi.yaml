    PasswordHashType:
      type: string
      title: PasswordHashType
      description: The state of an account password, or the hashing algorithm of a usable password hash. The hash itself is never reported.
      enum:
        - locked
        - disabled
        - empty
        - md5crypt
        - bcrypt
        - smb-cifs
        - sha256crypt
        - sha512crypt
        - scrypt
        - yescrypt
        - yescrypt-gost
        - sha1
        - md5-sun
        - bsdicrypt
        - descrypt
        - unknown
      x-enumDescriptions:
        locked: 'Password login is locked: the hash field begins with "!".'
        disabled: 'No password login: the hash field is "*".'
        empty: "The hash field is empty: the account can be used without a password."
        md5crypt: "MD5-crypt ($1$): a legacy algorithm that is fast to crack."
        bcrypt: "bcrypt ($2a$, $2b$, $2x$, $2y$): unusual in /etc/shadow on Linux."
        smb-cifs: "SMB/CIFS NT hash ($3$): unsalted and trivially cracked."
        sha256crypt: "SHA-256-crypt ($5$): acceptable, but weaker than its successors."
        sha512crypt: "SHA-512-crypt ($6$): the common modern default."
        scrypt: "scrypt ($7$): a memory-hard algorithm."
        yescrypt: "yescrypt ($y$): the current default on recent distributions."
        yescrypt-gost: "yescrypt with GOST ($gy$): unusual outside Russian builds."
        sha1: "SHA-1-crypt ($sha1$): a legacy algorithm."
        md5-sun: "Sun MD5 ($md5): a legacy algorithm."
        bsdicrypt: "BSDi extended DES (leading underscore): a legacy algorithm."
        descrypt: "Classic 13-character DES: trivially crackable."
        unknown: An unrecognized password hash format.
      x-enumSeverities:
        locked: 0
        disabled: 0
        empty: 5
        md5crypt: 5
        bcrypt: 5
        smb-cifs: 5
        sha256crypt: 2
        sha512crypt: 0
        scrypt: 0
        yescrypt: 0
        yescrypt-gost: 3
        sha1: 5
        md5-sun: 5
        bsdicrypt: 5
        descrypt: 5
        unknown: 5
