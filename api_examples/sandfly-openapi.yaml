            - total_tasks
          properties:
            queues:
              description: List of queues available.
              items:
                $ref: "#/components/schemas/StatusQueue"
              type: array
            total_tasks:
              description: Total number of tasks.
              type: integer
          type: object
      type: object
    StatusQueue:
      required:
