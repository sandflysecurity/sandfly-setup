  /whitelistrules/autowhitelist:
    post:
      operationId: autoWhitelistArtifacts
      summary: Whitelist alerting artifacts automatically
      description: |-
        Create whitelist rules from alerting artifacts, and set the alerts those rules cover to pass.

        The caller names the artifacts being accepted: individually in `artifact_ids`, by a result about them in `result_ids`, or as every artifact currently alerting on the hosts in `host_sequence_ids` (any combination of the three). A result ID is resolved to the artifact it is about and then treated exactly as if that artifact had been given in `artifact_ids`, which means the rule built from it covers every sandfly alerting on that artifact rather than only the sandfly whose result was named. One whitelist rule is created per distinct artifact: two artifacts that are the same thing at the chosen strictness -- the same process binary on two hosts, say -- share one rule. Each rule is written as ordinary expr rules over the artifact's properties. The properties are the ones the artifact's match hash is computed from: `strictness` picks the permissive set (a process's name and path, for example) or the moderate set (adding its binary hash and ownership).

        Every rule created gets the host scope in `whitelist_scope`. With `all_sandflies` false a rule covers the sandflies currently alerting on the artifacts it was built from; with it true the rule covers every sandfly. Every existing result the new rules cover is changed to a whitelisted pass. Note that the source artifact's own host is not implicitly in scope: a host scope that leaves it out leaves its alert standing.

        A source artifact that no rule can be built from is reported in `skipped_artifacts` with the reason, and the rest of the request proceeds. That covers an artifact that is not currently alerting, one superseded by a newer scan, one of a type with no whitelist properties (an operating system or an error, for instance), and one no sandfly is alerting on when `all_sandflies` is false. A request that ends up creating no rules -- hosts with nothing alerting on them, for instance -- succeeds with an empty `whitelist_rules` list.

        Rules are not merged into existing whitelist rules, so whitelisting the same artifact twice creates two rules.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoWhitelistRequest"
        description: The artifacts to whitelist, how far the rules should reach, and how strictly they should match.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoWhitelistResponse"
          description: "The request was valid but there was nothing to whitelist: no source artifact was alerting, or none could have a rule built from it. No whitelist rules were created and no results were changed. `skipped_artifacts` says why for each artifact the request named."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoWhitelistResponse"
          description: Whitelist rules created and the results they cover set to pass. The response lists the rules, the source artifacts no rule was built from, and how many results were changed.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid request. The JSON could not be parsed; `strictness` is not `permissive` or `moderate`; `source_artifacts` names no artifact, result or host; `whitelist_scope` covers no hosts (`all_hosts` is false and no `host_sequence_ids` or `host_tags` are given); or the request would create more whitelist rules than one request may (1000). The response message says which.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Not authorized.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: An artifact in `artifact_ids`, a result in `result_ids`, or a host in either `host_sequence_ids` list, does not exist. The response message names it.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      tags:
        - Whitelist
