    SuspiciousTag:
      type: string
      title: SuspiciousTag
      description: Behavior patterns that warrant a closer look. Not on their own a verdict.
      enum:
        - bind-shell-pattern
        - reverse-shell-pattern
        - packet-exec-pattern
        - bpf-backdoor-pattern
        - pty-exec-pattern
        - bpf-sniffer-pattern
        - ptrace-pattern
        - telecom-protocol
        - no-observable-code
        - sstrip-no-observable
        - no-fileops
        - tiny-network-binary
        - ultra-tiny-binary
        - raw-shellcode
        - go-obfuscated
        - go-suspicious-library
        - dense-network-shell
        - fileless-network-loader
        - hardcoded-ip-url
        - encoded-strings-xor
      x-enumDescriptions:
        bind-shell-pattern: Elements of a potential bind shell that waits for an incoming connection and hands the caller a command shell.
        reverse-shell-pattern: Elements of a potential reverse shell that calls out to a remote host and hands it a command shell, needing no open port.
        packet-exec-pattern: Receives network data and can run commands or other programs. A broad pattern; weigh it with the other tags.
        bpf-backdoor-pattern: Elements that capture network traffic, wait for a trigger, and run a shell.
        pty-exec-pattern: Elements that open a terminal to run an interactive shell with hands-on-keyboard access.
        bpf-sniffer-pattern: Appears to watch network traffic for a trigger and act on it.
        ptrace-pattern: Uses process tracing (ptrace) together with packet capture, which can hinder debugging or inspect other processes.
        telecom-protocol: Uses carrier-network signalling (GTP, Diameter, SS7) or SCTP, the transport it runs on. SCTP alone also appears in some ordinary network tools.
        no-observable-code: No readable code. The program is heavily stripped or obfuscated so the real behavior is hidden.
        sstrip-no-observable: A heavily stripped binary that can make static analysis more difficult and hide behavior.
        no-fileops: A bind or reverse shell with none of the file activity of a real service, indicating it may be a backdoor and not a legitimate server.
        tiny-network-binary: A very small program whose only real capability is network access and nothing else.
        ultra-tiny-binary: An extremely small self-contained binary, far below the size of a normally compiled program. Commonly a bindshell implant.
        raw-shellcode: A bare ELF wrapping raw shellcode, often a backdoor dropper.
        go-obfuscated: A Go program with its names garbled to defeat inspection and analysis.
        go-suspicious-library: Built with third-party Go code associated with malware.
        dense-network-shell: Built almost entirely to open a network connection and run a shell with no other function.
        fileless-network-loader: Built mainly to fetch a program over the network and run it from memory without writing it to disk.
        hardcoded-ip-url: A URL aimed at a bare IP address rather than a hostname to avoid using network resolvers.
        encoded-strings-xor: Hides several known strings, such as file paths, web requests or shell commands, behind a simple XOR key so that string scans cannot read them.
      x-enumSeverities:
        bind-shell-pattern: 2
        reverse-shell-pattern: 2
        packet-exec-pattern: 2
