      properties:
        results_date:
          type: string
          format: date-time
          description: The date as of which the data is current. When data is present this is the most recent scan date among the results returned; when the list is empty it is the oldest last-run time of the source sandflies, so an empty list still says when the host was last looked at. Null only when none of the source sandflies have run against this host.
          nullable: true
        source_sandflies:
          type: array
          description: The list of sandflies that this data is derived from.
          items:
            type: string
            description: data source sandfly name
        status:
          type: string
          description: "Status of the data source. 'ok' indicates the necessary sandflies are active and have run against this host with their results still stored, so the response is complete -- including when a sandfly ran and found nothing to report. 'missing_results' means that even though the necessary sandflies are active, at least one of them has no data for this host: it has never run against the host, or the results its last run recorded are no longer in the database (deleted, or expired under the data retention settings). It is a hint about why a list may be empty; scan the host to fill the gap. 'sandfly_inactive' means one or more sandflies that provide data for this API call are inactive."
          enum:
            - ok
            - missing_results
            - sandfly_inactive
