                $ref: "#/components/schemas/StandardResponse"
          description: Whitelist rule deleted.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Error deleting whitelist rule.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Delete Whitelist Rule
      tags:
        - Whitelist
  /whitelistrules/activate/:
