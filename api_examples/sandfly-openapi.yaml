    AtJobSignal:
      type: string
      title: AtJobSignal
      description: Findings from a one-off job queued to run later with at.
      enum:
        - running
        - batch-queue
        - past-due-still-queued
        - delayed-activation
      x-enumDescriptions:
        running: The job is running right now rather than waiting to run.
        batch-queue: The job sits on a batch queue, which is rarely used legitimately.
        past-due-still-queued: The job's scheduled time has passed but it is still waiting to run.
        delayed-activation: The job was queued far ahead of when it runs, leaving it dormant until then.
      x-enumSeverities:
        running: 2
        batch-queue: 2
        past-due-still-queued: 2
        delayed-activation: 2
    ArtifactSearchFilterItem:
      type: array
      items:
        type: object
        required:
          - field
          - operator
        properties:
          field:
            $ref: "#/components/schemas/ArtifactSearchFilterItemField"
          operator:
            description: |-
              The comparison operator to apply. The set of valid operators depends on the data type of the chosen field:

              - **String** fields and **tag** fields (`host_tags`, `sandfly_tags`): `contains`, `equals`, `startsWith`, `endsWith`, `notContains`, `notEquals`, `notStartsWith`, `notEndsWith`, `is`, `not`, `isEmpty`, `isNotEmpty`, `isAnyOf`
              - **Integer** fields (`id`, `severity`, `revision`, `host_sequence_id`): `equals`, `=`, `!=`, `<`, `<=`, `>`, `>=`, `isEmpty`, `isNotEmpty`, `isAnyOf`
              - **Date** fields (`first_seen`, `last_seen`, `created_at`): `is`, `not`, `after`, `onOrAfter`, `before`, `onOrBefore`
              - **Boolean** fields (`superseded`, `containerized`, `manual_scan`): `is`
              - `status` and `key_type` are enumerations, so `isEmpty`/`isNotEmpty` are rejected for them.
              - **Result JSON string** fields: `equals`, `=`, `is`, `isAnyOf`
              - **Result JSON integer** fields: `equals`, `=`, `is`, `!=`, `<`, `<=`, `>`, `>=`, `isAnyOf`
              - **Result JSON date** fields: `is`, `not`, `after`, `onOrAfter`, `before`, `onOrBefore`, and the raw `=`, `!=`, `<`, `<=`, `>`, `>=`

              `isAnyOf` matches when the field equals any member of `value`, which must be a non-empty array: of non-empty strings for a string or tag field, of integers (or numeric strings) for an integer field. Each member matches as `equals` does for that field, so a tag field matches when any one tag equals any member, case-insensitively. On a result JSON string field each member may be at most 500 characters. An empty array, a non-array value, or a bad member is rejected with a 400; an `isAnyOf` item is never dropped as a no-op. Use one `isAnyOf` item per field and combine items with `logicOperator` as usual; on a membership test it matches an artifact when ANY of its matching sandflies has any of the listed values.
            type: string
          value:
            description: "The value to compare against: a string or an integer, or for `isAnyOf` a non-empty array of them."
            oneOf:
              - type: string
              - type: integer
              - type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/ResultSearchFilterScalarValue"
    ArtifactsDelete:
      description: Selects the artifacts to delete. Exactly one of `filter`, `time_since`, or `artifact_ids` must be given.
      type: object
      properties:
        filter:
          type: object
          description: Delete every artifact matching this filter, in the same shape as the artifact search filter. See `ArtifactSearchFilterItemField` for the fields this endpoint exposes; `sort` is accepted but ignored, since a delete has no order.
          properties:
            items:
              $ref: "#/components/schemas/ArtifactSearchFilterItem"
            logicOperator:
              $ref: "#/components/schemas/ResultSearchFilterOperator"
            quickFilterValues:
              description: Free-text terms, matched as they are for artifact search.
              type: array
              items:
                type: string
            quickFilterLogicOperator:
              type: string
              enum:
                - and
                - or
        time_since:
          description: Delete every artifact first stored at or after this time.
          format: date-time
          type: string
        artifact_ids:
          description: List of artifact IDs to delete.
          type: array
          items:
            type: integer
            format: int64
