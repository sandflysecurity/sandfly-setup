    WhitelistRuleSummary:
      type: object
      required:
        - id
        - sandfly
        - sandflies
        - all_sandflies
        - active
        - all_hosts
        - host_ids
        - exclude_sandfly
        - rule_op
        - rules
        - comment
        - hosts_covered
      properties:
        id:
          type: integer
          description: The ID of the whitelist rule.
        sandfly:
          type: string
          description: The single sandfly associated with this rule, reported only for a rule that applies to exactly one. A rule that applies to several sandflies, or to all of them, reports an empty string here because no one name describes it; read `sandflies` and `all_sandflies` instead.
          deprecated: true
        sandflies:
          type: array
          description: The sandflies this rule applies to. Empty for a rule that applies to all sandflies without naming any.
          items:
            type: string
        all_sandflies:
          type: boolean
          description: Whether the rule applies to every sandfly rather than to the named ones.
        active:
          type: boolean
          description: If true, the whitelist rule is enabled. If false, the whitelist will not be applied to results.
        all_hosts:
          type: boolean
          description: Whether the whitelist rule applies to all hosts or not.
        host_ids:
          type: array
          items:
            type: string
            description: The IDs of the hosts that will have this whitelist rule applied.
        host_tags:
          description: Host that match any of these tags will have this whitelist rule applied.
          $ref: "#/components/schemas/HostTags"
        exclude_sandfly:
          type: boolean
          description: If true, this sandfly will not run on configured hosts and disregard any rules.
        rule_op:
          $ref: "#/components/schemas/WhitelistRuleOperator"
        rules:
          type: array
          items:
            type: string
            description: The rules that qualify a match with a result from this sandfly.
            format: Expr
            example: process.name == 'oldproc' && process.date.created_minutes > 1440
        comment:
          type: string
          description: A comment about this whitelist rule.
        hosts_covered:
          type: integer
          description: Number of hosts in total covered by rule.
    WhitelistRule:
      type: object
      required:
        - host_info
      allOf:
        - $ref: "#/components/schemas/WhitelistRuleSummary"
      properties:
        host_info:
          type: object
          description: Dictionary of hosts by ID
          additionalProperties:
            $ref: "#/components/schemas/HostBriefInfo"
    WhitelistRuleOperator:
      type: string
      enum:
        - and
        - or
    WhitelistRulesDelete:
      type: object
      required:
        - whitelist_ids
      properties:
        whitelist_ids:
          type: array
          description: Array of whitelist IDs for deletion
          items:
            type: integer
            description: Whitelist IDs
    WhitelistRuleConfig:
      description: "A rule must say which sandflies it applies to, in one of three ways. `all_sandflies` is used if set; otherwise `sandflies` is used if it is not empty; otherwise the deprecated single `sandfly` is used. A request that gives none of the three is rejected. If both `sandfly` and a non-empty `sandflies` are given, `sandfly` must be one of the names in `sandflies`, or the request is rejected: a client that changes `sandfly` while sending back the `sandflies` it read would otherwise have its change silently ignored."
      type: object
      properties:
        sandfly:
          type: string
          description: Name of the single sandfly this rule relates to. Superseded by `sandflies`, and used only when neither `sandflies` nor `all_sandflies` is given. When sent together with a non-empty `sandflies`, it must be one of the names listed there. To change which sandflies a rule applies to, set `sandflies` and leave this property out.
          deprecated: true
        sandflies:
          type: array
          description: Names of the sandflies this rule applies to.
          items:
            type: string
          default: []
        all_sandflies:
          type: boolean
          description: Apply this rule to every sandfly. Any names in `sandflies` are kept but not used while this is set, so clearing it restores them. Cannot be combined with `exclude_sandfly`, which together would stop every check from running on the matching hosts.
          default: false
        all_hosts:
          type: boolean
          description: Does this rule apply to all hosts. If true, host_ids and host_tags will be ignored.
          default: false
        host_ids:
          type: array
          description: A list of host IDs that will have this rule applied.
          items:
            type: string
          default: []
        host_tags:
          type: array
          description: A list of host tags. If a host matches any tag, it will have this rule applied.
          items:
            type: string
          default: []
        rule_op:
          $ref: "#/components/schemas/WhitelistRuleOperator"
          default: and
        rules:
          type: array
          description: "At least one rule is required if this isn't a sandfly exclusion whitelist. Rules are checked when the whitelist is saved: together they may be at most 1048576 bytes (1 MiB) long, and none may use the repeat builtin. A rule that reads data a particular result does not carry -- process fields on a result with no process data, for instance -- does not match that result."
          items:
            type: string
            description: The rules that qualify a match with a result from this sandfly.
            format: Expr
            example: process.name == 'oldproc' && process.date.created_minutes > 1440
          default: []
        exclude_sandfly:
          type: boolean
          description: If true, this sandfly will not run on configured hosts and disregard any rules.
          default: false
        active:
          type: boolean
          description: If true, the whitelist rule is enabled. If false, the whitelist will not be applied to results.
          default: true
        comment:
          type: string
          description: A descriptive comment about this whitelist rule.
          default: ""
    AutoWhitelistRequest:
      type: object
      required:
        - source_artifacts
        - whitelist_scope
        - strictness
      properties:
        source_artifacts:
          $ref: "#/components/schemas/AutoWhitelistSourceArtifacts"
        whitelist_scope:
          $ref: "#/components/schemas/AutoWhitelistScope"
        strictness:
          type: string
          enum:
            - permissive
            - moderate
          description: How strict of a match is required for the whitelist to apply. Permissive is a looser set of requirements (such as just the process name and file path), whereas moderate requires more properties to match (such as the actual hash of the process so replacement binaries or new versions won't match).
    AutoWhitelistSourceArtifacts:
      type: object
      description: The artifacts being whitelisted. At least one of the three lists must be given; any combination may be.
      properties:
        artifact_ids:
          type: array
          description: Artifacts to whitelist, by artifact ID as the /artifacts endpoints report it. Every ID must exist. An artifact that is not currently alerting is skipped and reported in the response rather than whitelisted.
          items:
            type: integer
            format: int64
          default: []
        result_ids:
          type: array
          description: "Artifacts to whitelist, identified by an individual sandfly result: each ID is a result ID as the /results endpoints report it, and the artifact that result is associated with is what gets whitelisted. Every ID must exist. Once resolved these are treated exactly as if the artifact had been given in `artifact_ids`, so the rule built from one covers every sandfly alerting on that artifact and not only the sandfly whose result ID was provided. Several results about the same artifact are one source artifact, and the response reports the artifact ID rather than the results."
          items:
            type: string
          default: []
        host_sequence_ids:
          type: array
          description: Hosts whose every currently alerting artifact is to be whitelisted, by host sequence ID. Every ID must exist. A host with nothing alerting contributes nothing.
          items:
            type: integer
          default: []
    AutoWhitelistScope:
      type: object
      description: How far the created rules reach. Every rule the request creates gets this host scope. The sandflies a rule covers are decided per rule.
      properties:
        all_sandflies:
          type: boolean
          description: If true, each rule applies to every sandfly. If false, each rule applies to the sandflies currently alerting on the artifacts it was built from, so a rule built from a process two sandflies flagged covers those two sandflies and no other.
          default: false
        all_hosts:
          type: boolean
          description: If true, the rules apply to all hosts, and `host_sequence_ids` and `host_tags` are ignored. If false, at least one of them must be given.
          default: false
        host_tags:
          description: Hosts with any of these tags will have the rules applied. Tags match without regard to case.
          $ref: "#/components/schemas/HostTags"
        host_sequence_ids:
          type: array
          description: Hosts that will have the rules applied, by host sequence ID. Every ID must exist.
          items:
            type: integer
          default: []
    AutoWhitelistResponse:
      type: object
      required:
        - whitelist_rules
        - skipped_artifacts
        - results_updated
        - artifacts_passed
        - hosts_updated
      properties:
        whitelist_rules:
          type: array
          description: The whitelist rules created, one per distinct source artifact. Empty when nothing could be whitelisted.
          items:
            $ref: "#/components/schemas/AutoWhitelistCreatedRule"
        skipped_artifacts:
          type: array
          description: Source artifacts no rule was built from, each with the reason. Empty when every source artifact was covered.
          items:
            $ref: "#/components/schemas/AutoWhitelistSkippedArtifact"
        results_updated:
          type: integer
          description: How many per-sandfly results were changed from alert to a whitelisted pass, across all hosts in scope.
        artifacts_passed:
          type: integer
          description: How many artifacts, across all hosts in scope, no longer have any sandfly alerting on them as a result. An artifact another sandfly outside the rules' scope is still alerting on stays alerting and is not counted.
        hosts_updated:
          type: integer
          description: How many hosts had at least one result changed.
    AutoWhitelistCreatedRule:
      type: object
      description: One whitelist rule the request created. Its host scope is the request's `whitelist_scope` and is not repeated here; GET /whitelistrules/{whitelist_id} reports the rule in full.
      required:
        - id
        - sandflies
        - all_sandflies
        - rule_op
        - rules
        - comment
        - artifact_ids
      properties:
        id:
          type: integer
          description: The ID of the new whitelist rule.
        sandflies:
          type: array
          description: "The sandflies the rule applies to: those that were alerting on the rule's source artifacts. Empty when `all_sandflies` is true."
          items:
            type: string
        all_sandflies:
          type: boolean
          description: Whether the rule applies to every sandfly.
        rule_op:
          $ref: "#/components/schemas/WhitelistRuleOperator"
        rules:
          type: array
          description: The rule's expr expressions, one per artifact property, each matching the property of the source artifact(s).
          items:
            type: string
            format: Expr
            example: process.path == `/usr/sbin/nginx`
        comment:
          type: string
          description: A generated comment recording which artifact the rule was built from, on which host, at which strictness.
        artifact_ids:
          type: array
          description: "The source artifacts the rule was built from: the artifacts the request named that share this rule's identity at the chosen strictness."
          items:
            type: integer
            format: int64
    AutoWhitelistSkippedArtifact:
      type: object
      required:
        - artifact_id
        - reason
      properties:
        artifact_id:
          type: integer
          format: int64
          description: The source artifact no rule was built from.
        reason:
          type: string
          description: "Why: the artifact is not alerting, has been superseded, is of a type with no whitelist properties, has no match hash at the chosen strictness, has no sandfly alerting on it, or its stored data could not be read."
    HostBriefInfo:
      type: object
      required:
        - id
        - host_sequence_id
        - hostname
        - node_name
        - date_last_seen
        - last_seen_ip_addr
        - active
      properties:
        id:
          type: string
          description: The ID of the host.
        host_sequence_id:
          type: integer
          description: Sequence ID of the host.
        hostname:
          type: string
          description: The hostname of the host.
        node_name:
          type: string
          description: The node name of the host.
        date_last_seen:
          type: string
          description: The date the host was last seen.
        last_seen_ip_addr:
          type: string
          description: The last seen IP address of the host.
        active:
          type: boolean
          description: Whether the host is active or not. Maintained by Sandfly as hosts are scanned; it is not user-settable.
    WhitelistRuleIds:
      properties:
        whitelist_ids:
          description: List of whitelist_ids.
          items:
            type: integer
          type: array
      type: object
    ProfileType:
      type: string
      readOnly: true
      enum:
        - legacy_profile
        - autodrift_profile
      description: Legacy or autodrift profile.
    ProfileMeta:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ProfileType"
        id:
          type: integer
          readOnly: true
          description: Unique ID assigned by the server for this result profile.
        state:
          $ref: "#/components/schemas/ProfileState"
        paused:
          type: boolean
          default: false
          description: Indicates if this profile is paused. When paused, no drift alerts will be generated on the associated hosts, nor will results be whitelisted.
        scan_schedule:
          type: boolean
          readOnly: true
          description: Indicates if this is a drift profile that is configured to have an associated drift scan schedule.
        create_date:
          type: string
          readOnly: true
          description: Date this result profile was created.
        hosts_covered_whitelist:
          type: integer
          description: The number of distinct hosts, either directly or via tags, that this result profile applies to in 'whitelist' mode.
        hosts_covered_drift:
          type: integer
          description: The number of distinct hosts, either directly or via tags, that this result profile applies to in 'drift' mode.
        total_sandflies:
          type: integer
          description: The number of distinct sandflies that this result profile includes results for.
      required:
        - id
        - state
        - paused
        - create_date
        - type
    ProfileState:
      type: string
      readOnly: true
      description: Whether this profile is in gather or enforce mode.
      enum:
        - gather
        - enforce
    ProfileCommon:
      type: object
      properties:
        name:
          type: string
          description: Display name of this result profile.
        description:
          type: string
          description: Description of this result profile.
      required:
        - name
    HostLink:
      oneOf:
        - type: object
          required:
            - host_id
          properties:
            host_id:
              type: string
              description: Host ID. If host_sequence_id is populated, this cannot be populated.
        - type: object
          required:
            - host_sequence_id
          properties:
            host_sequence_id:
              type: integer
              description: Host sequence_id. If host_id is populated, this cannot be populated.
    ProfileAppendRequest:
      oneOf:
        - $ref: "#/components/schemas/ProfileAppendHostsResults"
        - $ref: "#/components/schemas/ProfileAppendResults"
        - $ref: "#/components/schemas/ProfileAppendArtifacts"
        - $ref: "#/components/schemas/ProfileAppendHostsSandflies"
    ProfileAppendHostsResults:
      type: object
      required:
        - hosts
        - user_note
      properties:
        hosts:
          description: List of Host IDs to take a results snapshot of for this result profile.
          type: array
          items:
            $ref: "#/components/schemas/HostLink"
        user_note:
          description: User-provided descriptive note explaining the results that are being added.
          type: string
    ProfileAppendResults:
      type: object
      required:
        - result_ids
        - user_note
      properties:
        result_ids:
          description: List of individual result IDs to take a snapshot of for this result profile. These are the per-sandfly result IDs, such as the `id` of each entry in an artifact's `sandfly_results`.
          type: array
          items:
            type: integer
        user_note:
          description: User-provided descriptive note explaining the results that are being added.
          type: string
    ProfileAppendArtifacts:
      type: object
      required:
        - artifact_ids
        - user_note
      properties:
        artifact_ids:
          description: List of artifact IDs to take a snapshot of for this result profile. Every sandfly's result on each artifact is added.
          type: array
          items:
            type: integer
            format: int64
        user_note:
          description: User-provided descriptive note explaining the results that are being added.
          type: string
    ProfileAppendHostsSandflies:
      type: object
      required:
        - host_sandflies
        - user_note
      properties:
        host_sandflies:
          description: Sandflies on a specific host to take a snapshot of for this result profiles.
          type: object
          allOf:
            - $ref: "#/components/schemas/HostLink"
          required:
            - sandflies
          properties:
            sandflies:
              type: array
              items:
                type: string
              description: Sandflies from which to add results.
        user_note:
          description: User-provided descriptive note explaining the results that are being added.
          type: string
    ProfileCreateRequest:
      description: Result profile details.
      allOf:
        - $ref: "#/components/schemas/ProfileCommon"
        - $ref: "#/components/schemas/ProfileAppendRequest"
      properties:
        associations:
          $ref: "#/components/schemas/ProfileAssociations"
    ProfileAutoDriftOptions:
      type: object
      description: Options that are only relevant for auto-drift result profiles.
      required:
        - scope
        - model_hosts
        - covered_hosts
        - gather_options
        - schedule_options
      properties:
        scope:
          $ref: "#/components/schemas/ProfileAutoScope"
        model_hosts:
          description: The hosts to use as the model (i.e. template) hosts for expected results.
          $ref: "#/components/schemas/ProfileAutoHosts"
        covered_hosts:
          description: The hosts that this profile should detect drift on (and optionally whitelist) after the results from the model host(s) are gathered.
          $ref: "#/components/schemas/ProfileAutoHosts"
        gather_options:
          description: When present, this profile will enter gather mode and run gather schedules as configured. If null, no gather schedule will be created and the profile will immediately enter enforcing mode.
          nullable: true
          $ref: "#/components/schemas/ProfileGatherOptions"
        schedule_options:
          description: When present, the new profile will automatically have a scan schedule associated with it that scans the covered hosts with the selected sandflies for drift detection. If null, no scan schedule will be created.
          nullable: true
          $ref: "#/components/schemas/ProfileScheduleOptions"
    ProfileAutoHosts:
      type: object
      description: Hosts, included by tag or specific host IDs, to use as the model or covered hosts in an auto-drift result profile.
      required:
        - host_sequence_ids
        - host_tags
        - apply_host_tags
      properties:
        host_sequence_ids:
          type: array
          items:
            type: integer
          description: A list of host sequence IDs.
        host_tags:
          type: array
          items:
            type: string
          description: A list of host tags.
        apply_host_tags:
          type: array
          items:
            type: string
          description: Tags in this array will be applied (added to) the listed host IDs. This allows users to select some hosts and add new tags to them at the same time instead of needing to separately tag hosts first. When tags are present in this list, the individual hosts will be removed from the final profile associations and be included by tag instead.
    ProfileAutoDriftTemplate:
      type: object
      properties:
        name:
          type: string
          description: The name of the template.
        description:
          type: string
          description: A description of the template's purpose.
        sandflies:
          type: array
          description: A list of sandflies associated with the template.
          items:
            type: string
        ignore_containers:
          type: boolean
          description: Ignore container results for the profile.
        strictness:
          $ref: "#/components/schemas/ProfileHashType"
        whitelist:
          type: boolean
          description: In addition to drift, should the resulting profile whitelist alerts found on the model hosts.
      required:
        - name
        - description
        - ignore_containers
        - sandflies
        - strictness
        - whitelist
    ProfileAutoScope:
      type: object
      description: Scope definition for autodrift profiles.
      required:
        - sandflies
        - strictness
        - whitelist
        - ignore_containers
      properties:
        sandflies:
          type: array
          items:
            type: string
          description: The list of sandflies to use for drift detection.
        strictness:
          $ref: "#/components/schemas/ProfileHashType"
        whitelist:
          type: boolean
          default: false
          description: If true, any alert results on the model host(s) will be whitelisted on the covered host(s) by the profile.
        ignore_containers:
          description: When true, container results will not be affected by this profile.
          type: boolean
          default: false
    ProfileGatherOptions:
      type: object
      description: Options to control the result gathering schedule for an auto-drift profile.
      properties:
        gather_hours:
          type: integer
          description: How many hours to run scans to gather results for this auto-drift profile before automatically switching to 'enforcing' mode and generating drift alerts on the covered host(s). Typical values may be 24 or 48 hours.
        scan_minutes:
          type: integer
          description: How often, in minutes, to run scans against the model host(s) during the gather period. All of the specified sandflies will be run against the host at this interval. Typical values may be 20, 30, 60, etc. minutes.
        full_scan:
          type: boolean
          default: false
          description: If true, the gather scans on the model hosts will run *all* active sandflies for every scan, not only the requested drift detection recon sandflies. If whitelist is true, this may be desired to whitelist as many expected alerts as possible if any alert on the model host(s) should be considered to be false positives by virtue of the model host(s) being known to be clean, correct model systems.
      required:
        - gather_hours
        - scan_minutes
        - whitelist
        - full_scan
    ProfileScheduleOptions:
      type: object
      description: Options to control the scan schedule that is created to scan the covered hosts of a drift profile.
      properties:
        minutes_timer_high:
          description: Upper limit minutes to wait between scans.
          format: int32
          type: integer
        minutes_timer_low:
          description: Lower limit of minutes to wait between scans. Cannot be greater than minutes_timer_high.
          format: int32
          type: integer
        restrict_begin_hour:
          description: nil or -1 to disable, or a number between 0-24 to indicate the beginning hour (UTC) of the window of time during which this schedule will not run.
          format: int32
          type: integer
        restrict_end_hour:
          description: nil or -1 to disable, or a number between 0-24 to indicate the end hour (UTC) of the window of time during which this schedule will not run.
          format: int32
          type: integer
        priority:
          description: Nice-compatible priority of scan on target hosts.
          format: int32
          type: integer
        all_hosts_immediately:
          description: If true, immediately start scan on all hosts covered by this schedule. If false, scans will be spread out across hosts over the scan schedule interval.
          type: boolean
      required:
        - minutes_timer_low
        - minutes_timer_high
        - restrict_begin_hour
        - restrict_end_hour
        - priority
        - all_hosts_immediately
    ProfileSandflyResults:
      type: object
      description: Details of results for a sandfly on a result profile.
      required:
        - sandfly
        - results
      properties:
        sandfly:
          type: string
          description: Sandfly name.
        results:
          type: array
          description: Results associated with the sandfly in the profile.
          items:
            type: object
            description: Result associated with the sandfly in the profile.
            required:
              - type
              - hash_type
              - hash
              - key_data
              - result_profile_result_id
            properties:
              type:
                type: string
                enum:
                  - whitelist
                  - drift
                description: Type of profile matching this result may be used for.
              hash_type:
                description: Enforcement level this result supports.
                $ref: "#/components/schemas/ProfileHashType"
              hash:
                type: string
                description: Match hash for this result. May be an empty string for a "no results" entry in the drift profile on this sandfly.
              key_data:
                type: string
                description: Key data element from the result.
              result_profile_result_id:
                type: integer
                description: Result profile result JSON ID.
    ProfileSummary:
      type: object
      description: ""
      allOf:
        - $ref: "#/components/schemas/ProfileCommon"
        - $ref: "#/components/schemas/ProfileMeta"
    Profile:
      type: object
      discriminator:
        propertyName: type
        mapping:
          legacy_profile: "#/components/schemas/ProfileLegacy"
          autodrift_profile: "#/components/schemas/ProfileAutoDrift"
      oneOf:
        - $ref: "#/components/schemas/ProfileLegacy"
        - $ref: "#/components/schemas/ProfileAutoDrift"
    ProfileDetails:
      type: object
      required:
        - associations
        - host_info
        - history
        - sandflies
      properties:
        associations:
          $ref: "#/components/schemas/ProfileAssociations"
        host_info:
          type: array
          items:
            $ref: "#/components/schemas/ProfileHostSummary"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ProfileHistory"
        sandflies:
          description: The sandflies for which this result profiles has results for.
          type: array
          items:
            $ref: "#/components/schemas/ProfileSandflySummary"
    ProfileUpdateRequest:
      description: Result profile details.
      type: object
      allOf:
        - $ref: "#/components/schemas/ProfileCommon"
      properties:
        associations:
          $ref: "#/components/schemas/ProfileAssociations"
    ProfileLegacy:
      type: object
      deprecated: true
      allOf:
        - $ref: "#/components/schemas/ProfileCommon"
        - $ref: "#/components/schemas/ProfileMeta"
        - $ref: "#/components/schemas/ProfileDetails"
    ProfileAutoDrift:
      type: object
      allOf:
        - $ref: "#/components/schemas/ProfileCommon"
        - $ref: "#/components/schemas/ProfileMeta"
        - $ref: "#/components/schemas/ProfileDetails"
      required:
        - auto_drift_options
      properties:
        auto_drift_options:
          description: Only present if the profile is an auto-drift profile.
          allOf:
            - $ref: "#/components/schemas/ProfileAutoDriftOptions"
            - $ref: "#/components/schemas/ProfileAutoDriftStats"
    ProfileAutoDriftStats:
      type: object
      description: Server-provided statistics/data for an auto-drift profile.
      required:
        - gather_start_time
        - schedule_id
      properties:
        gather_start_time:
          type: string
          format: date-time
          nullable: true
          description: The time gathering for this auto-drift profile last began (e.g. at initial creation time, or if a later edit re-enters gathering mode, the most recent occurrence). Null if there is no gather schedule.
        schedule_id:
          type: string
          nullable: true
          description: If there is currently a system-managed schedule (gather or scan) associated with this auto-drift profile, this is the name (ID) of the schedule. If there is no schedule, will be null.
    ProfileForHost:
      type: object
      allOf:
        - $ref: "#/components/schemas/ProfileSummary"
      required:
        - mode
        - hash_type
      properties:
        mode:
          $ref: "#/components/schemas/ProfileMode"
        hash_type:
          $ref: "#/components/schemas/ProfileHashType"
    ProfileHostSummary:
      type: object
      properties:
        id:
          description: The host ID of this host.
          type: string
        host_sequence_id:
          description: Sequence host ID of this host.
          type: integer
        hostname:
          description: The hostname (target address) of this host.
          type: string
        node_name:
          description: The OS node name of this host.
          type: string
        date_last_seen:
          description: The date this host was last successfully connected to.
          type: string
          format: date-time
        last_seen_ip_addr:
          description: The IP address this host was last seen at.
          type: string
        mode:
          $ref: "#/components/schemas/ProfileMode"
        hash_type:
          $ref: "#/components/schemas/ProfileHashType"
        ignore_containers:
          $ref: "#/components/schemas/ProfileIgnoreContainers"
    ProfileSandflySummary:
      type: object
      properties:
        name:
          type: string
          description: Name of the sandfly.
        description:
          type: string
          description: Description of the sandfly.
        whitelist_results:
          type: boolean
          description: Indicates if the profile has results for whitelisting this sandfly.
        whitelist_results_count:
          type: integer
          description: Number of whitelisting results for this profile.
        drift_results:
          type: boolean
          description: Indicates if the profile has results to use for drift detection on this sandfly.
        drift_results_count:
          type: integer
          description: Number of drift detection results for this profile.
        type:
          type: string
          description: Sandfly type.
        custom:
          type: boolean
          description: Indicates if this is a custom sandfly.
        cloned_from:
          type: string
          description: The sandfly from which this custom sandfly was cloned.
        partner:
          type: boolean
          description: Indicates if this is a partner sandfly.
        active:
          type: boolean
          description: Indicates if the sandfly is active.
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the sandfly.
      required:
        - name
        - description
        - whitelist_results
        - whitelist_results_count
        - drift_results
        - drift_results_count
        - type
        - custom
        - active
        - tags
    ProfileIgnoreContainers:
      description: When true, container results will not be affected by this profile.
      type: boolean
      default: false
    ProfileMode:
