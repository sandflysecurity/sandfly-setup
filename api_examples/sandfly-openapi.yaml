    UserSignal:
      type: string
      title: UserSignal
      description: Findings from a user account.
      enum:
        - uid-0-alias
        - system-account-with-shell
        - inferred-user
        - empty-password
        - weak-hash
        - no-shadow-entry
        - unusual-home
        - forced-command
        - key-outside-home
        - duplicate-key
        - key-parse-error
        - key-type-mismatch
        - legacy-key
        - writable-key-file
        - ssh-read-failed
      x-enumDescriptions:
        uid-0-alias: "uid 0 on a name other than root: a second root account."
        system-account-with-shell: A service account has been given a login shell.
        inferred-user: A user ID that owns files or processes but has no account entry.
        empty-password: The account has no password, so anyone can log in as it.
        weak-hash: The password hash uses an algorithm that is trivially or cheaply cracked.
        no-shadow-entry: The account exists in passwd with no shadow entry.
        unusual-home: The account's home directory is in an unusual place for a real user.
        forced-command: An SSH key for this account is set to run a fixed command on login.
        key-outside-home: An SSH key for this account was found in another account's home directory.
        duplicate-key: The same SSH key is repeated in authorized_keys in more than one place.
        key-parse-error: An SSH key could not be read, so its type is unverified.
        key-type-mismatch: An SSH key's stated type does not match the key itself, a sign of tampering.
        legacy-key: The SSH key uses a weak or deprecated algorithm.
        writable-key-file: The account's SSH key file can be written by others, so anyone can add a key.
        ssh-read-failed: SSH key data could not be read, so the key count is unknown rather than zero.
      x-enumSeverities:
        uid-0-alias: 5
        system-account-with-shell: 2
        inferred-user: 2
        empty-password: 5
        weak-hash: 5
        no-shadow-entry: 4
        unusual-home: 5
        forced-command: 4
        key-outside-home: 5
        duplicate-key: 4
        key-parse-error: 2
        key-type-mismatch: 5
        legacy-key: 3
        writable-key-file: 5
        ssh-read-failed: 2
