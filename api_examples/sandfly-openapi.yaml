    ResultSearchFilterItem:
      type: array
      items:
        type: object
        required:
          - field
          - operator
        properties:
          field:
            $ref: "#/components/schemas/ResultSearchFilterItemField"
          operator:
            description: |-
              The comparison operator to apply. The set of valid operators depends on the data type of the chosen field:

              - **String** fields and **tag** fields: `contains`, `equals`, `startsWith`, `endsWith`, `notContains`, `notEquals`, `notStartsWith`, `notEndsWith`, `is`, `not`, `isEmpty`, `isNotEmpty`, `isAnyOf`
              - **Integer** fields: `equals`, `=`, `!=`, `<`, `<=`, `>`, `>=`, `isEmpty`, `isNotEmpty`, `isAnyOf`
              - **Date** fields: `is`, `not`, `after`, `onOrAfter`, `before`, `onOrBefore`, `isEmpty`, `isNotEmpty`
              - **Boolean** fields: `is`
              - **Result JSON string** fields (the `data.results...` fields): `equals`, `=`, `is`, `isAnyOf`
              - **Result JSON integer** fields: `equals`, `=`, `is`, `!=`, `<`, `<=`, `>`, `>=`, `isAnyOf`
              - **Result JSON date** fields: `is`, `not`, `after`, `onOrAfter`, `before`, `onOrBefore`, and the raw `=`, `!=`, `<`, `<=`, `>`, `>=`

              `isAnyOf` matches when the field equals any member of `value`, which must be a non-empty array: of non-empty strings for a string or tag field (including `data.status` and `data.type`), of integers (or numeric strings) for an integer field. Each member matches as `equals` does for that field, so a tag field matches when any one tag equals any member, case-insensitively. On a result JSON string field each member may be at most 500 characters. An empty array, a non-array value, or a bad member is rejected with a 400; an `isAnyOf` item is never dropped as a no-op. Use one `isAnyOf` item per field and combine items with `logicOperator` as usual.
            type: string
          value:
            description: "The value to compare against: a string or an integer, or for `isAnyOf` a non-empty array of them."
            oneOf:
              - type: string
              - type: integer
              - type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/ResultSearchFilterScalarValue"
          id:
            oneOf:
              - type: string
              - type: integer
    Sandfly:
