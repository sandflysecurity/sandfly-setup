    LinuxCapability:
      type: string
      title: LinuxCapability
      description: A Linux capability, as named in capabilities(7). Decoded from a process capability set or a file security.capability attribute.
      enum:
        - CAP_CHOWN
        - CAP_DAC_OVERRIDE
        - CAP_DAC_READ_SEARCH
        - CAP_FOWNER
        - CAP_FSETID
        - CAP_KILL
        - CAP_SETGID
        - CAP_SETUID
        - CAP_SETPCAP
        - CAP_LINUX_IMMUTABLE
        - CAP_NET_BIND_SERVICE
        - CAP_NET_BROADCAST
        - CAP_NET_ADMIN
        - CAP_NET_RAW
        - CAP_IPC_LOCK
        - CAP_IPC_OWNER
        - CAP_SYS_MODULE
        - CAP_SYS_RAWIO
        - CAP_SYS_CHROOT
        - CAP_SYS_PTRACE
        - CAP_SYS_PACCT
        - CAP_SYS_ADMIN
        - CAP_SYS_BOOT
        - CAP_SYS_NICE
        - CAP_SYS_RESOURCE
        - CAP_SYS_TIME
        - CAP_SYS_TTY_CONFIG
        - CAP_MKNOD
        - CAP_LEASE
        - CAP_AUDIT_WRITE
        - CAP_AUDIT_CONTROL
        - CAP_SETFCAP
        - CAP_MAC_OVERRIDE
        - CAP_MAC_ADMIN
        - CAP_SYSLOG
        - CAP_WAKE_ALARM
        - CAP_BLOCK_SUSPEND
        - CAP_AUDIT_READ
        - CAP_PERFMON
        - CAP_BPF
        - CAP_CHECKPOINT_RESTORE
      x-enumDescriptions:
        CAP_CHOWN: Change the owner of any file.
        CAP_DAC_OVERRIDE: Bypass file read, write and execute permission checks.
        CAP_DAC_READ_SEARCH: Bypass file read permission checks and directory read and execute checks. Also a known container-escape route.
        CAP_FOWNER: Bypass ownership checks when changing permissions or attributes on files owned by others.
        CAP_FSETID: Keep set-user-ID and set-group-ID bits when a file is modified.
        CAP_KILL: Send signals to any process, including security agents.
        CAP_SETGID: Switch to any group, including the root group.
        CAP_SETUID: Switch to any user, including root.
        CAP_SETPCAP: Grant or drop capabilities for other processes and edit the bounding set.
        CAP_LINUX_IMMUTABLE: Set the immutable and append-only file attributes.
        CAP_NET_BIND_SERVICE: Bind to network ports below 1024. The most common legitimate file capability.
        CAP_NET_BROADCAST: Make socket broadcasts. Not used by current kernels.
        CAP_NET_ADMIN: "Reconfigure networking: interfaces, routing, firewall rules and promiscuous mode."
        CAP_NET_RAW: "Open raw and packet sockets: sniff and forge network traffic."
        CAP_IPC_LOCK: Lock memory so it cannot be swapped out.
        CAP_IPC_OWNER: Bypass permission checks on System V IPC objects.
        CAP_SYS_MODULE: "Load and unload kernel modules: a precondition for a kernel rootkit."
        CAP_SYS_RAWIO: Access raw I/O ports and kernel memory devices directly.
        CAP_SYS_CHROOT: Use chroot to change the root directory.
        CAP_SYS_PTRACE: Trace and inject code into any process.
        CAP_SYS_PACCT: Turn process accounting on and off.
        CAP_SYS_ADMIN: Perform a wide range of administrative operations, including mounts and namespaces. Effectively equivalent to root.
        CAP_SYS_BOOT: Reboot the system and load a new kernel with kexec.
        CAP_SYS_NICE: Change scheduling priority and CPU affinity.
        CAP_SYS_RESOURCE: Override resource limits and reserved filesystem space.
        CAP_SYS_TIME: "Set the system clock: alters every timestamp-based timeline on the host."
        CAP_SYS_TTY_CONFIG: Configure terminals and perform privileged console operations.
        CAP_MKNOD: Create device nodes, including raw disk devices.
        CAP_LEASE: Establish leases on files.
        CAP_AUDIT_WRITE: Write records to the kernel audit log, including forged entries.
        CAP_AUDIT_CONTROL: Change audit rules and disable auditing.
        CAP_SETFCAP: "Set file capabilities on any file: grant a program any capability."
        CAP_MAC_OVERRIDE: Override SELinux or AppArmor mandatory access control.
        CAP_MAC_ADMIN: Change SELinux or AppArmor policy.
        CAP_SYSLOG: Read the kernel log, which can leak kernel addresses.
        CAP_WAKE_ALARM: Set timers that wake the system from suspend.
        CAP_BLOCK_SUSPEND: Prevent the system from suspending.
        CAP_AUDIT_READ: Read the audit log over netlink.
        CAP_PERFMON: Use performance monitoring and kernel tracing.
        CAP_BPF: "Load eBPF programs: a precondition for an eBPF rootkit."
        CAP_CHECKPOINT_RESTORE: Checkpoint and restore processes, with access to another process's memory-mapped files.
      x-enumSeverities:
        CAP_CHOWN: 5
        CAP_DAC_OVERRIDE: 5
        CAP_DAC_READ_SEARCH: 5
        CAP_FOWNER: 5
        CAP_FSETID: 2
        CAP_KILL: 2
        CAP_SETGID: 5
        CAP_SETUID: 5
        CAP_SETPCAP: 5
        CAP_LINUX_IMMUTABLE: 2
        CAP_NET_BIND_SERVICE: 0
