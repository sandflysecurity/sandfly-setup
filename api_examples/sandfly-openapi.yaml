          description: Invalid request. The JSON could not be parsed; the ID in the URL is not a positive integer or does not match the `id` in the JSON; the rule names no sandflies; `sandfly` is not one of the `sandflies` given with it; `all_sandflies` is combined with `exclude_sandfly`; or a rule expression does not compile. The response message says which.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Error updating whitelist rule.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: The whitelist rule does not exist, or a sandfly or host named by the rule does not exist.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Update whitelist rule
      tags:
        - Whitelist
    delete:
