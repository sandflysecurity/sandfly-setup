    FileFlag:
      type: string
      title: FileFlag
      description: Attributes of a file.
      enum:
        - directory
        - regular
        - link
        - suid
        - suid_root
        - sgid
        - sgid_root
        - socket
        - device
        - char_device
        - named_pipe
        - sticky
        - immutable
        - hidden
        - deleted
        - containerized
      x-enumDescriptions:
        directory: The entry is a directory.
        regular: The entry is a regular file.
        link: The entry is a symbolic link.
        suid: The set-user-ID bit is set. The file runs with its owner's privileges.
        suid_root: The set-user-ID bit is set and the owner is root. The file runs as root for anyone who executes it.
        sgid: The set-group-ID bit is set. The file runs with its group's privileges.
        sgid_root: The set-group-ID bit is set and the group is root.
        socket: The entry is a Unix socket.
        device: The entry is a block device.
        char_device: The entry is a character device.
        named_pipe: The entry is a named pipe (FIFO).
