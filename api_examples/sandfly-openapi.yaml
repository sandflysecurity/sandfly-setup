          type: string
          description: Queue name.
        run_id:
          type: string
          description: Unique Run ID used to get this information.
        ssh_key_fingerprint:
          type: string
          description: SSH fingerprint of remote host.
          nullable: true
        tags:
          type: array
          description: A list of tags for this host.
          items:
            type: string
        version:
          type: integer
          description: Version type for this record.
          format: int32
        verify_host_key:
          type: boolean
          description: Verify host key.
          default: false
        results_alert:
          type: integer
          description: Total alert results on this host.
          minimum: 0
        alert_artifacts:
          type: integer
          description: Number of current alerting artifacts on this host. An artifact that more than one sandfly alerted on counts once, where `results_alert` counts each sandfly's alert.
          minimum: 0
        results_error:
          type: integer
          description: Total error results on this host.
          minimum: 0
        results_pass:
          type: integer
          description: Total pass results on this host.
          minimum: 0
        results_total:
          type: integer
          description: Total results on this host.
          minimum: 0
        severity:
          type: integer
          description: The host's severity, 0-5. When AI triage has analyzed the host, the analysis sets the severity. Otherwise it's the highest severity among the host's alerting artifacts or 0 when nothing is alerting.
          minimum: 0
          maximum: 5
        triage_verdict:
          type: string
          description: "The host's AI triage verdict: one of the six verdicts (the last one formed for the host, kept while a new one is queued or after a later attempt fails), `pending` for a host waiting for its first verdict, `error` for a host whose only attempt at a verdict failed, `excluded` for a host whose tags keep it out of automatic AI triage and which nobody has asked for a verdict on, or `none` for a host with no record and nothing queued."
          enum:
            - clean
            - likely_false_positive
            - needs_attention
            - suspicious
            - likely_malicious
            - likely_compromised
            - pending
            - error
            - excluded
            - none
        triage_stale:
          type: boolean
          description: "Whether the host's AI triage verdict is stale: true when a host materially changes and there isn't a new analysis yet. False for a host with no verdict. Not set by an operator's revert, which changes what the host reports rather than what is alerting on it."
        triage_queue_state:
          $ref: "#/components/schemas/HostTriageQueueState"
    HostTriageQueueState:
      title: HostTriageQueueState
      type: string
      description: Where the host stands on the AI triage queue, independent of its verdict. The interval and daily-limit holds apply to automatic triage only, and manually requesting triage for the host clears any hold.
      enum:
        - none
        - queued
        - running
        - held_interval
        - held_daily_limit
        - held_retry
        - held_shared
      x-enumLabels:
        none: Not queued
        queued: Triage queued
        running: Triage running
        held_interval: Triage cooldown
        held_daily_limit: Daily limit
        held_retry: Triage retrying
        held_shared: Shared verdict
      x-enumDescriptions:
        none: Not on the triage queue.
        queued: Waiting its turn on the triage queue, and picked up as soon as a worker is free.
        running: A verdict is being formed now.
        held_interval: Waiting out the minimum interval between verdicts for this host.
        held_daily_limit: The day's submission limit is reached. Resumes when the next UTC day begins.
        held_retry: The last attempt failed or was rate limited; it will be tried again shortly.
        held_shared: Waiting on a verdict being formed for another host in the same situation, which this host will reuse.
