    ErrorEngineResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          description: "What went wrong on an artifact a sandfly reported an error on. On an error artifact with no other data, this is the whole artifact: a sandfly that failed or timed out before matching anything, or a scan that could not run on the host. On a file, process or other artifact that a sandfly failed on after matching it, it sits beside that artifact's data, and is removed once the sandfly no longer reports the error. Where several sandflies reported an error on one artifact, this is the first one's; each sandfly's own is on its result."
          required:
            - message
          properties:
            message:
              type: string
              description: "What went wrong, as reported by the sandfly, the agent, or the scanning node: the error result's explanation for an error artifact with no other data, and its status message for an artifact with data of its own."
    KmodulesEngineResponse:
      description: A kmodule engine result carries exactly one of kernel_module or kernel_taint. Most kmodule sandflies report a loaded kernel module in kernel_module; a sandfly that checks the kernel's tainted state against the loaded modules instead reports, in kernel_taint, a taint flag that no loaded module accounts for.
      oneOf:
        - type: object
          description: A kmodule engine result about one loaded kernel module.
          required:
            - kernel_module
          properties:
            kernel_module:
              type: object
              description: The loaded kernel module this result is about.
              required:
                - name
                - memory_size
                - instance_count
                - state
                - memory_offset
                - taints
                - taints_list
                - kernel_taint_missing
                - hidden
                - vmalloc_artifact
                - missing_file
                - dependencies
                - module_file_path
                - file
              properties:
                name:
                  type: string
                memory_size:
                  type: integer
                instance_count:
                  type: integer
                state:
                  type: string
                memory_offset:
                  type: string
                taints:
                  type: array
                  items:
                    type: object
                    properties:
                      taint:
                        type: string
                        description: A single kernel taint letter from /proc/modules. Recognized letters are those of KernelTaintLetter; a distribution-specific letter is reported as-is with taint_reason "(unknown)".
                      taint_reason:
                        type: string
                        description: The kernel's reason for the taint, or "(unknown)" for an unrecognized letter.
                taints_list:
                  type: string
                kernel_taint_missing:
                  type: boolean
                hidden:
                  type: boolean
                vmalloc_artifact:
                  type: boolean
                  description: Indicates that this kernel module is a name that we saw in /proc/vmallocinfo but we don't see the module name in the loaded modules list.
                missing_file:
                  type: boolean
                dependencies:
                  type: array
                  items:
                    type: string
                module_file_path:
                  type: string
                file:
                  allOf:
                    - $ref: "#/components/schemas/file"
                  description: On-disk attributes of the kernel module file, in the same shape as the file engine's file object.
        - type: object
          description: A kmodule engine result about a kernel taint flag that no loaded module accounts for.
          required:
            - kernel_taint
          properties:
            kernel_taint:
              type: object
              description: A taint flag set in /proc/sys/kernel/tainted that no currently loaded module accounts for.
              required:
                - taint
                - taint_reason
              properties:
                taint:
                  $ref: "#/components/schemas/KernelTaintLetter"
                taint_reason:
                  type: string
                  description: The kernel's reason for the taint.
