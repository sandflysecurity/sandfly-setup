                          masked_salt:
                            type: string
                          masked_value:
                            type: string
                          marker:
                            type: string
                          hostnames:
                            type: array
                            nullable: true
                            description: Null when the entry is masked (HashKnownHosts), since the hostnames cannot be recovered.
